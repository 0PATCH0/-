<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дуэль — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        .duel-hero { background: linear-gradient(160deg, rgba(18,22,28,0.95), rgba(10,12,16,0.98)); border: 1px solid #d4af37; border-radius: 16px; padding: 40px 20px; text-align: center; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(212,175,55,0.1); margin-bottom: 20px; }
        .duel-hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #d4af37, transparent); }
        .vs-badge { font-family: 'Cinzel', serif; font-size: 24px; color: #e74c3c; text-shadow: 0 0 10px rgba(231,76,60,0.5); margin: 0 15px; }
        .guild-side { flex: 1; padding: 15px; }
        .guild-name { font-family: 'Cinzel', serif; font-size: 18px; color: #d4af37; margin-bottom: 5px; word-break: break-word; }
        .guild-role { font-size: 12px; color: #8a8578; text-transform: uppercase; letter-spacing: 1px; }
        .info-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; padding: 20px; margin: 20px auto; max-width: 400px; text-align: left; font-size: 15px; line-height: 1.6; }
        .info-box b { color: #d4af37; }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 20px; border: 1px solid transparent; }
        .status-pending { background: rgba(241,196,15,0.15); color: #f1c40f; border-color: rgba(241,196,15,0.4); }
        .status-accepted { background: rgba(46,204,113,0.15); color: #2ecc71; border-color: rgba(46,204,113,0.4); }
        .status-in_progress { background: rgba(230,126,34,0.15); color: #e67e22; border-color: rgba(230,126,34,0.4); }
        .status-completed { background: rgba(212,175,55,0.15); color: #d4af37; border-color: rgba(212,175,55,0.4); }
        .status-declined { background: rgba(231,76,60,0.15); color: #e74c3c; border-color: rgba(231,76,60,0.4); }
        .match-row { background: rgba(0,0,0,0.4); border: 1px solid rgba(212,175,55,0.2); border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .player-slot { flex: 1; text-align: center; }
        .player-name { font-weight: bold; font-size: 16px; margin: 8px 0; color: #e8e3d4; }
        .player-name.empty { color: #8a8578; font-style: italic; font-size: 14px; }
        .player-name.winner { color: #2ecc71; text-shadow: 0 0 10px rgba(46,204,113,0.5); }
        .vs-small { padding: 0 15px; color: #d4af37; font-family: 'Cinzel', serif; font-size: 18px; }
        .modal-overlay.active { display: flex; }
        .modal-box select { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #d4af37; color: #e8e3d4; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <pre id="debug" style="position:fixed; top:0; left:0; right:0; color:#e74c3c; background:rgba(0,0,0,0.9); padding:8px; font-size:11px; z-index:99999; margin:0; white-space:pre-wrap; display:none;"></pre>

    <div class="container" style="max-width: 800px;">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="/dashboard" class="back-link">← К списку гильдий</a>
        </nav>
        <div id="content">
            <div class="empty-state">Загрузка данных дуэли...</div>
        </div>
    </div>

    <script>
        const challengeId = window.location.pathname.split('/')[2];
        const content = document.getElementById('content');
        const debugEl = document.getElementById('debug');
        let currentDuelData = null;

        function showDebug(msg) {
            debugEl.style.display = 'block';
            debugEl.textContent += msg + '\n';
        }

        window.onerror = function(message, source, lineno, colno) {
            showDebug('ОШИБКА: ' + message + ' (строка ' + lineno + ')');
        };

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, function(m) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
            });
        }

        async function loadDuel() {
            try {
                showDebug('Загрузка вызова: ' + challengeId);
                const res = await fetch('/api/duel/' + challengeId, { credentials: 'include' });
                showDebug('Ответ сервера: ' + res.status);
                
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || ('HTTP ' + res.status));
                }
                
                const data = await res.json();
                currentDuelData = data;
                renderDuel(data);
            } catch (e) {
                content.innerHTML = `<div class="empty-state" style="color:#e74c3c;">❌ Ошибка: ${escapeHtml(e.message)}</div>`;
                showDebug('Ошибка загрузки: ' + e.message);
            }
        }

        function renderDuel(data) {
            const { challenge, challengerGuild, opponentGuild, canManageChallenger, canManageOpponent } = data;
            
            const dateObj = new Date(challenge.time * 1000);
            const dateStr = dateObj.toLocaleString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            let statusBadge = '';
            if (challenge.status === 'pending') statusBadge = '<span class="status-badge status-pending">⏳ Ожидает ответа</span>';
            if (challenge.status === 'accepted') statusBadge = '<span class="status-badge status-accepted">✅ Вызов принят</span>';
            if (challenge.status === 'declined') statusBadge = '<span class="status-badge status-declined">❌ Вызов отклонён</span>';
            if (challenge.status === 'in_progress') statusBadge = '<span class="status-badge status-in_progress">⚔️ Бои идут</span>';
            if (challenge.status === 'completed') statusBadge = '<span class="status-badge status-completed">🏆 Дуэль завершена</span>';

            let pendingButtons = '';
            if (challenge.status === 'pending' && canManageOpponent) {
                pendingButtons = `
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button class="btn btn-primary" style="flex:1;" onclick="acceptDuel()">✅ Принять вызов</button>
                        <button class="btn btn-danger" style="flex:1;" onclick="declineDuel()">❌ Отклонить</button>
                    </div>
                `;
            }

            let matchesHtml = '';
            if (['accepted', 'in_progress', 'completed'].includes(challenge.status) && challenge.matches && challenge.matches.length > 0) {
                matchesHtml = `
                    <div class="section-title" style="margin-top: 30px; text-align: left;">⚔️ Сетка боёв</div>
                    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                        ${challenge.matches.map(m => {
                            const cName = m.challengerPlayer ? m.challengerPlayer.name : '— Не выбран —';
                            const oName = m.opponentPlayer ? m.opponentPlayer.name : '— Не выбран —';
                            const canSelectC = canManageChallenger && challenge.status === 'accepted' && !m.challengerPlayer;
                            const canSelectO = canManageOpponent && challenge.status === 'accepted' && !m.opponentPlayer;
                            const cWinner = m.winner === 'challenger' ? 'winner' : '';
                            const oWinner = m.winner === 'opponent' ? 'winner' : '';

                            return `
                                <div class="match-row">
                                    <div class="player-slot">
                                        <div class="guild-role">${escapeHtml(challengerGuild.name)}</div>
                                        <div class="player-name ${cWinner} ${!m.challengerPlayer ? 'empty' : ''}">${escapeHtml(cName)}</div>
                                        ${canSelectC ? `<button class="btn btn-secondary btn-small" onclick="openPlayerModal(${m.matchIndex}, 'challenger')">Выбрать</button>` : ''}
                                    </div>
                                    <div class="vs-small">VS</div>
                                    <div class="player-slot">
                                        <div class="guild-role">${escapeHtml(opponentGuild.name)}</div>
                                        <div class="player-name ${oWinner} ${!m.opponentPlayer ? 'empty' : ''}">${escapeHtml(oName)}</div>
                                        ${canSelectO ? `<button class="btn btn-secondary btn-small" onclick="openPlayerModal(${m.matchIndex}, 'opponent')">Выбрать</button>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            let startButton = '';
            if (challenge.status === 'accepted' && (canManageChallenger || canManageOpponent)) {
                startButton = `
                    <div style="margin-top: 20px; text-align: center;">
                        <button class="btn btn-primary" style="padding: 12px 30px; font-size: 16px;" onclick="startDuel()">🔥 Начать бой!</button>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="duel-hero">
                    <div style="font-size: 48px; margin-bottom: 10px;">⚔️</div>
                    <h1 style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 32px; margin-bottom: 15px;">Дуэль</h1>
                    ${statusBadge}
                    <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 30px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.2);">
                        <div class="guild-side">
                            <div style="font-size: 24px; margin-bottom: 10px;">🏰</div>
                            <div class="guild-name">${escapeHtml(challengerGuild.name)}</div>
                            <div class="guild-role">Вызывающий</div>
                        </div>
                        <div class="vs-badge">VS</div>
                        <div class="guild-side">
                            <div style="font-size: 24px; margin-bottom: 10px;">🛡️</div>
                            <div class="guild-name">${escapeHtml(opponentGuild.name)}</div>
                            <div class="guild-role">Оппонент</div>
                        </div>
                    </div>
                    <div class="info-box">
                        <div>🕒 <b>Время:</b> ${dateStr}</div>
                        <div>⚔️ <b>Формат:</b> ${challenge.format} ${challenge.format == 1 ? 'бой' : 'боёв'}</div>
                    </div>
                    ${pendingButtons}
                </div>
                ${matchesHtml}
                ${startButton}
            `;
        }

        async function acceptDuel() {
            if (!confirm('Принять вызов?')) return;
            try {
                const res = await fetch('/api/duel/' + challengeId + '/accept', { method: 'POST', credentials: 'include' });
                if (res.ok) { alert('✅ Вызов принят!'); loadDuel(); }
                else { const d = await res.json(); alert('❌ Ошибка: ' + d.error); }
            } catch (e) { alert('❌ Ошибка сети'); }
        }

        async function declineDuel() {
            if (!confirm('Отклонить вызов?')) return;
            try {
                const res = await fetch('/api/duel/' + challengeId + '/decline', { method: 'POST', credentials: 'include' });
                if (res.ok) { alert('❌ Вызов отклонен.'); loadDuel(); }
                else { const d = await res.json(); alert('❌ Ошибка: ' + d.error); }
            } catch (e) { alert('❌ Ошибка сети'); }
        }

        async function startDuel() {
            if (!confirm('Начать бой? После этого менять состав будет нельзя.')) return;
            try {
                const res = await fetch('/api/duel/' + challengeId + '/start', { method: 'POST', credentials: 'include' });
                if (res.ok) { alert('⚔️ Бой начался!'); loadDuel(); }
                else { const d = await res.json(); alert('❌ Ошибка: ' + d.error); }
            } catch (e) { alert('❌ Ошибка сети'); }
        }

        async function openPlayerModal(matchIndex, side) {
            if (!currentDuelData) return;
            const guildId = (side === 'challenger') ? currentDuelData.challenge.challengerGuildId : currentDuelData.challenge.opponentGuildId;
            
            try {
                const res = await fetch('/api/guild/' + guildId + '/roster', { credentials: 'include' });
                if (!res.ok) return alert('Не удалось загрузить состав гильдии (нужны права модератора)');
                const roster = await res.json();
                
                let options = roster.members.map(m => `<option value="${m.userId}|${escapeHtml(m.displayName)}">${escapeHtml(m.displayName)}</option>`).join('');
                
                const modalHtml = `
                    <div class="modal-overlay active" id="player-modal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;">
                        <div class="modal-box" style="background:#12161c;padding:30px;border-radius:16px;border:1px solid #d4af37;max-width:400px;width:90%;">
                            <h3 style="color:#d4af37;font-family:'Cinzel',serif;margin-bottom:20px;">Выбрать бойца</h3>
                            <select id="selected-player">
                                <option value="">— Выберите игрока —</option>
                                ${options}
                            </select>
                            <div style="display:flex;gap:10px;">
                                <button class="btn btn-danger" style="flex:1;" onclick="document.getElementById('player-modal').remove()">Отмена</button>
                                <button class="btn btn-primary" style="flex:1;" onclick="submitPlayer(${matchIndex}, '${side}')">ОК</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
            } catch (e) { alert('❌ Ошибка: ' + e.message); }
        }

        async function submitPlayer(matchIndex, side) {
            const val = document.getElementById('selected-player').value;
            if (!val) return alert('Выберите игрока');
            const parts = val.split('|');
            const userId = parts[0];
            const name = parts[1];
            
            try {
                const res = await fetch('/api/duel/' + challengeId + '/set-player', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ matchIndex, side, userId, name })
                });
                if (res.ok) {
                    document.getElementById('player-modal').remove();
                    loadDuel();
                } else {
                    const d = await res.json();
                    alert('❌ Ошибка: ' + d.error);
                }
            } catch (e) { alert('❌ Ошибка сети: ' + e.message); }
        }

        loadDuel();
    </script>
</body>
</html>
