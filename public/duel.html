<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дуэль — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container" style="max-width: 800px;">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="/dashboard" class="back-link">← К списку гильдий</a>
        </nav>

        <div id="content">
            <div class="empty-state">Загрузка данных дуэли...</div>
        </div>
    </div>

    <script>
        const challengeId = window.location.pathname.split('/')[2];
        const content = document.getElementById('content');

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        async function loadDuel() {
            try {
                const res = await fetch('/api/duel/' + challengeId, { credentials: 'include' });
                if (!res.ok) throw new Error('Не удалось загрузить данные');
                const data = await res.json();
                renderDuel(data);
            } catch (e) {
                content.innerHTML = `<div class="empty-state" style="color:var(--danger);">Ошибка: ${escapeHtml(e.message)}</div>`;
            }
        }

        function renderDuel(data) {
            const { challenge, challengerGuild, opponentGuild, canManageChallenger, canManageOpponent } = data;
            
            const dateObj = new Date(challenge.time * 1000);
            const dateStr = dateObj.toLocaleString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            let statusBadge = '';
            if (challenge.status === 'pending') statusBadge = '<span style="color:#f1c40f;">⏳ Ожидает ответа</span>';
            if (challenge.status === 'accepted') statusBadge = '<span style="color:#2ecc71;">✅ Принят</span>';
            if (challenge.status === 'declined') statusBadge = '<span style="color:#e74c3c;">❌ Отклонен</span>';

            let buttonsHtml = '';
            if (challenge.status === 'pending' && canManageOpponent) {
                buttonsHtml = `
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button class="btn btn-primary" style="flex:1;" onclick="acceptDuel()">✅ Принять вызов</button>
                        <button class="btn btn-danger" style="flex:1;" onclick="declineDuel()">❌ Отклонить</button>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="panel" style="text-align: center; padding: 40px 20px; border-color: #d4af37; box-shadow: 0 0 50px rgba(212,175,55,0.1);">
                    <div style="font-size: 48px; margin-bottom: 10px;">⚔️</div>
                    <h1 style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 32px; margin-bottom: 5px;">Дуэль</h1>
                    <div style="font-size: 16px; margin-bottom: 20px;">${statusBadge}</div>

                    <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 30px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.2);">
                        <div style="text-align: center; flex: 1;">
                            <div style="font-size: 24px; margin-bottom: 10px;">🏰</div>
                            <div style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 18px;">${escapeHtml(challengerGuild.name)}</div>
                            <div style="font-size: 12px; color: #8a8578;">Вызывающий</div>
                        </div>
                        <div style="font-size: 28px; color: #e74c3c; font-family: 'Cinzel', serif;">VS</div>
                        <div style="text-align: center; flex: 1;">
                            <div style="font-size: 24px; margin-bottom: 10px;">🛡️</div>
                            <div style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 18px;">${escapeHtml(opponentGuild.name)}</div>
                            <div style="font-size: 12px; color: #8a8578;">Оппонент</div>
                        </div>
                    </div>

                    <div style="text-align: left; max-width: 400px; margin: 0 auto; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px;">
                        <p style="margin-bottom: 10px;"><strong>🕒 Время:</strong> ${dateStr}</p>
                        <p style="margin-bottom: 10px;"><strong>⚔️ Формат:</strong> ${challenge.format} ${challenge.format == 1 ? 'бой' : 'боёв'}</p>
                    </div>

                    ${buttonsHtml}
                </div>
            `;
        }

        async function acceptDuel() {
            if (!confirm('Принять вызов?')) return;
            try {
                const res = await fetch('/api/duel/' + challengeId + '/accept', { method: 'POST', credentials: 'include' });
                if (res.ok) { alert('✅ Вызов принят!'); loadDuel(); }
                else { const d = await res.json(); alert('Ошибка: ' + d.error); }
            } catch (e) { alert('Ошибка сети'); }
        }

        async function declineDuel() {
            if (!confirm('Отклонить вызов?')) return;
            try {
                const res = await fetch('/api/duel/' + challengeId + '/decline', { method: 'POST', credentials: 'include' });
                if (res.ok) { alert('❌ Вызов отклонен.'); loadDuel(); }
                else { const d = await res.json(); alert('Ошибка: ' + d.error); }
            } catch (e) { alert('Ошибка сети'); }
        }

        loadDuel();
    </script>
</body>
</html>
