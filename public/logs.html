<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи действий</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2 id="server-name">Загрузка...</h2>
        <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;">← К списку серверов</a>
        <hr style="border-color: var(--border-color); margin-bottom: 20px;">
        <a href="#" id="nav-home">🏠 Обзор</a>
        <a href="#" id="nav-roster">🛡️ Состав гильдии</a>
        <a href="#" id="nav-rr">🎭 Роли по кнопкам</a>
        <a href="#" id="nav-rem">⏰ Напоминания</a>
        <a href="#" id="nav-mod">⚙️ Модерация</a>
        <a href="#" id="nav-emb">📨 Эмбеды</a>
        <a href="#" class="active">📜 Логи действий</a>
    </div>
    <div class="content">
        <div class="header"><h1>📜 Журнал действий</h1></div>
        <div class="form-card">
            <table class="logs-table">
                <thead>
                    <tr><th>Время</th><th>Модератор</th><th>Действие</th><th>Детали</th></tr>
                </thead>
                <tbody id="logs-body">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const guildId = window.location.pathname.split('/')[2];
        document.getElementById('nav-home').href = `/manage/${guildId}`;
        document.getElementById('nav-roster').href = `/manage/${guildId}/roster`;
        document.getElementById('nav-rr').href = `/manage/${guildId}/reactionroles`;
        document.getElementById('nav-rem').href = `/manage/${guildId}/reminders`;
        document.getElementById('nav-mod').href = `/manage/${guildId}/moderation`;
        document.getElementById('nav-emb').href = `/manage/${guildId}/custom`;

        fetch(`/api/guild/${guildId}`).then(r=>r.json()).then(d => document.getElementById('server-name').innerText = d.name);

        fetch(`/api/guild/${guildId}/logs`).then(res => res.json()).then(data => {
            const tbody = document.getElementById('logs-body');
            if (data.length === 0) return tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Логов пока нет. Используйте команды бота!</td></tr>';
            
            tbody.innerHTML = data.map(log => `
                <tr>
                    <td style="color: var(--text-muted);">${new Date(log.date).toLocaleString('ru-RU')}</td>
                    <td style="color: var(--accent); font-weight: bold;">${log.username}</td>
                    <td>${log.action}</td>
                    <td>${log.details}</td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
