<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи действий</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"><h1>Главная</h1></a>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;"><div class="icon icon-arrow-left"></div> К списку серверов</a>
            <hr style="border-color: var(--border-color); margin-bottom: 20px;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" id="nav-guides"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" id="nav-rr"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" id="nav-rem"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" id="nav-mod"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" class="active"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" id="nav-emb"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-scroll"></div> Журнал действий</h1></div>
            <div class="form-card" style="overflow-x: auto; padding: 20px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color); color: var(--accent-gold); font-family: 'Georgia', serif;">
                            <th style="padding: 15px;">Время</th>
                            <th style="padding: 15px;">Модератор</th>
                            <th style="padding: 15px;">Действие</th>
                            <th style="padding: 15px;">Детали</th>
                        </tr>
                    </thead>
                    <tbody id="logs-body">
                        <tr><td colspan="4" style="text-align: center; padding: 20px; color: var(--text-muted);">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-guides': '/guides', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;

        fetch(`/api/guild/${guildId}`).then(r=>r.json()).then(d => document.getElementById('server-name').innerText = d.name);

        fetch(`/api/guild/${guildId}/logs`).then(res => res.json()).then(data => {
            const tbody = document.getElementById('logs-body');
            if (data.length === 0) return tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--text-muted);">Логов пока нет.</td></tr>';
            
            tbody.innerHTML = data.map(log => `
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 15px; color: var(--text-muted); font-size: 13px;">${new Date(log.date).toLocaleString('ru-RU')}</td>
                    <td style="padding: 15px; color: var(--accent-jade); font-weight: bold;">${log.username}</td>
                    <td style="padding: 15px;"><span style="background: rgba(46, 204, 113, 0.15); color: var(--accent-jade); padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(46, 204, 113, 0.3);">${log.action}</span></td>
                    <td style="padding: 15px; font-size: 14px;">${log.details}</td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
