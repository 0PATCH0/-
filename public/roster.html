<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Состав гильдии</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2 id="server-name">Загрузка...</h2>
        <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;">← К списку серверов</a>
        <hr style="border-color: var(--border-color);">
        <a href="#" id="link-back">🏠 На главную</a>
        <a href="#" class="active">🛡️ Состав гильдии</a>
    </div>
    <div class="content">
        <div class="header">
            <h1>🛡️ Состав гильдии</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="#" id="btn-config" class="btn" style="background: var(--bg-card); border: 1px solid var(--border-color);">⚙️ Настроить</a>
                <button class="btn btn-danger" onclick="deleteMessage()" id="btn-delete-msg">🗑️ Удалить сообщение</button>
                <button class="btn" onclick="forceUpdate()" id="btn-update">🔄 Обновить данные</button>
            </div>
        </div>
        <p id="last-updated" style="color: var(--text-muted); margin-bottom: 20px;">Последнее обновление: Загрузка...</p>
        
        <div class="grid" id="roster-grid">
            <!-- Сюда будут загружаться колонки -->
        </div>
    </div>
    <script>
        const guildId = window.location.pathname.split('/')[2];
        document.getElementById('link-back').href = `/manage/${guildId}`;
        document.getElementById('btn-config').href = `/manage/${guildId}/roster-config`;

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => {
            document.getElementById('server-name').innerText = data.name;
        });

        function loadRoster() {
            Promise.all([
                fetch(`/api/guild/${guildId}/roster`, { cache: 'no-store' }).then(res => res.json()),
                fetch(`/api/guild/${guildId}/roster-config`, { cache: 'no-store' }).then(res => res.json())
            ]).then(([rosterData, configData]) => {
                const grid = document.getElementById('roster-grid');
                const lastUpdatedEl = document.getElementById('last-updated');

                if (!rosterData.lastUpdated || !rosterData.data) {
                    grid.innerHTML = '<p>Список пуст. Нажмите "Обновить данные", чтобы собрать его.</p>';
                    return;
                }

                const date = new Date(rosterData.lastUpdated).toLocaleString('ru-RU');
                lastUpdatedEl.innerText = `Последнее обновление: ${date}`;

                if (!configData.columns || configData.columns.length === 0) {
                    grid.innerHTML = '<p>Колонки не настроены. Нажмите "⚙️ Настроить".</p>';
                    return;
                }

                grid.innerHTML = '';
                let totalUnique = new Set();

                configData.columns.forEach(col => {
                    const members = rosterData.data[col.roleId] || [];
                    members.forEach(m => totalUnique.add(m.id));
                    let membersHtml = members.length > 0 ? members.map(m => `<div>@${m.name}</div>`).join('') : '<i>Никого нет</i>';
                    
                    grid.innerHTML += `
                        <div class="card" style="background: var(--bg-card); border-left: 4px solid ${col.color || '#5865F2'};">
                            <h3>${col.name} (${members.length})</h3>
                            <div style="margin-top: 15px; color: var(--text-muted);">${membersHtml}</div>
                        </div>
                    `;
                });

                grid.innerHTML = `
                    <div class="card" style="grid-column: 1 / -1; background: transparent; border: none; padding: 0;">
                        <p style="color: var(--text-main); font-size: 18px;">Всего участников: <b>${totalUnique.size}</b></p>
                    </div>
                ` + grid.innerHTML;
            });
        }

        function forceUpdate() {
            const btn = document.getElementById('btn-update');
            btn.innerText = '⏳ Загрузка...';
            btn.disabled = true;

            fetch(`/api/guild/${guildId}/roster/update`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.error) alert('❌ ' + data.error);
                    loadRoster();
                })
                .finally(() => {
                    btn.innerText = '🔄 Обновить данные';
                    btn.disabled = false;
                });
        }

        function deleteMessage() {
            if (!confirm('Вы уверены, что хотите удалить сообщение со списком из Discord?')) return;
            
            fetch(`/api/guild/${guildId}/roster/message`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert('✅ Сообщение удалено из Discord!');
                });
        }

        loadRoster();
    </script>
</body>
</html>
