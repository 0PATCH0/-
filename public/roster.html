<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Состав гильдии</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-forest">
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="sidebar">
        <h2 id="server-name">Загрузка...</h2>
        <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;">← К списку серверов</a>
        <hr style="border-color: var(--border-color); margin-bottom: 20px;">
        <a href="#" id="nav-home">🏠 Обзор</a>
        <a href="#" class="active">🛡️ Состав гильдии</a>
        <a href="#" id="nav-rr">🎭 Роли по кнопкам</a>
        <a href="#" id="nav-rem">⏰ Напоминания</a>
        <a href="#" id="nav-mod">⚙️ Модерация</a>
        <a href="#" id="nav-emb">📨 Эмбеды</a>
        <a href="#" id="nav-logs">📜 Логи действий</a>
    </div>

    <div class="content">
        <div class="header">
            <div>
                <h1>🛡️ Состав гильдии</h1>
                <p id="last-updated" style="color: var(--text-muted); margin-top: 5px;">Загрузка...</p>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="#" id="btn-config" class="btn btn-small" style="background: rgba(0,0,0,0.6); border: 1px solid var(--accent); color: var(--accent);">⚙️ Настроить</a>
                <button class="btn btn-danger btn-small" onclick="deleteMessage()">🗑️ Удалить</button>
                <button class="btn btn-small" onclick="forceUpdate()" id="btn-update">🔄 Обновить</button>
            </div>
        </div>
        
        <div class="grid" id="roster-grid"></div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const navs = {'nav-home': '', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-emb': '/custom', 'nav-logs': '/logs'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;
        document.getElementById('btn-config').href = `/manage/${guildId}/roster-config`;

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => document.getElementById('server-name').innerText = data.name);

        function loadRoster() {
    Promise.all([
        fetch(`/api/guild/${guildId}/roster`, { cache: 'no-store' }).then(res => res.json()),
        fetch(`/api/guild/${guildId}/roster-config`, { cache: 'no-store' }).then(res => res.json())
    ]).then(([rosterData, configData]) => {
        const grid = document.getElementById('roster-grid');
        const lastUpdatedEl = document.getElementById('last-updated');

        if (!rosterData.lastUpdated || !rosterData.data) {
            grid.innerHTML = '<p style="color: var(--text-muted);">Список пуст. Нажмите "Обновить".</p>';
            return;
        }

        lastUpdatedEl.innerText = `Последнее обновление: ${new Date(rosterData.lastUpdated).toLocaleString('ru-RU')}`;

        if (!configData.columns || configData.columns.length === 0) {
            grid.innerHTML = '<p style="color: var(--text-muted);">Колонки не настроены.</p>';
            return;
        }

        grid.innerHTML = '';
        let totalUnique = new Set();

        configData.columns.forEach(col => {
            const members = rosterData.data[col.roleId] || [];
            members.forEach(m => totalUnique.add(m.id));
            
            // Формируем список с аватарками и упоминаниями
            let membersHtml = members.length > 0 ? members.map(m => `
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 4px;">
                    <img src="https://cdn.discordapp.com/embed/avatars/0.png" style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent);">
                    <span style="font-size: 14px; color: var(--text-main);">${m.name}</span>
                </div>
            `).join('') : '<div style="color: var(--text-muted); font-style: italic;">Никого нет</div>';
            
            grid.innerHTML += `
                <div class="card" style="border-top: 3px solid ${col.color || '#d4af37'};">
                    <h3>${col.name} <span style="font-size: 14px; color: var(--text-muted); font-weight: normal;">(${members.length})</span></h3>
                    <div style="margin-top: 15px;">${membersHtml}</div>
                </div>
            `;
        });

        grid.innerHTML = `<div class="card" style="grid-column: 1 / -1; background: transparent; border: none; box-shadow: none; padding: 0;">
                <p style="color: var(--text-main); font-size: 18px;">Всего участников: <b style="color: var(--accent);">${totalUnique.size}</b></p>
            </div>` + grid.innerHTML;
    });
        }

        function forceUpdate() {
            const btn = document.getElementById('btn-update');
            btn.innerText = '⏳...'; btn.disabled = true;
            fetch(`/api/guild/${guildId}/roster/update`, { method: 'POST' })
                .then(res => res.json()).then(data => { if (data.error) alert(data.error); loadRoster(); })
                .finally(() => { btn.innerText = '🔄 Обновить'; btn.disabled = false; });
        }

        function deleteMessage() {
            if (!confirm('Удалить ВСЕ сообщения со списком из Discord?')) return;
            fetch(`/api/guild/${guildId}/roster/message`, { method: 'DELETE' }).then(() => alert('Удалено!'));
        }

        loadRoster();
    </script>
</body>
</html>
