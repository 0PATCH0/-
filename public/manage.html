<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Роли по кнопкам</title>
    <link rel="stylesheet" href="/css/style.css?v=8">
    <script src="/js/ui.js"></script>
    <style>
        .rr-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        @media (max-width: 900px) { .rr-layout { grid-template-columns: 1fr; } }
        
        .rr-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--jade); }
    </style>
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"></a>
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard"><div class="icon icon-home"></div> К списку серверов</a>
            <hr style="border-color: var(--border); margin: 15px 0;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" id="nav-guides"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" class="active"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" id="nav-rem"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" id="nav-mod"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" id="nav-logs"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" id="nav-emb"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-masks"></div> Роли по кнопкам</h1></div>
            
            <div class="rr-layout">
                <!-- ЛЕВАЯ ЧАСТЬ: ФОРМА -->
                <div class="form-card">
                    <h3 id="form-title" style="color: var(--gold); margin-bottom: 20px; font-family: 'Georgia', serif;">Создать сообщение</h3>
                    <input type="hidden" id="edit-message-id" value="">
                    
                    <div class="form-group"><label>Заголовок</label><input type="text" id="rr-title" placeholder="Например: Выберите свои роли"></div>
                    <div class="form-group"><label>Описание</label><textarea id="rr-desc" placeholder="Выберите роли..." style="height: 80px;"></textarea></div>
                    <div class="form-group"><label>Цвет (HEX)</label><input type="color" id="rr-color" value="#2ecc71" style="height: 45px; padding: 5px;"></div>
                    <div class="form-group" id="channel-group"><label>ID Канала</label><input type="text" id="rr-channel" placeholder="123456789012345678"></div>
                    <div class="form-group"><label>Режим выбора</label>
                        <select id="rr-mode">
                            <option value="multiple">Можно брать несколько ролей</option>
                            <option value="single">Только одну роль</option>
                        </select>
                    </div>

                    <hr style="border-color: var(--border); margin: 20px 0;">
                    <h3 style="color: var(--gold); margin-bottom: 15px; font-family: 'Georgia', serif;">Кнопки ролей</h3>
                    <div id="roles-container"></div>
                    <button class="btn btn-success btn-small" onclick="addRoleRow()" style="margin-bottom: 20px;"><div class="icon icon-plus"></div> Добавить кнопку</button>
                    
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button class="btn" onclick="saveReactionRoles()" id="btn-save" style="flex: 1;"><div class="icon icon-paper-plane"></div> Отправить</button>
                        <button class="btn btn-danger" onclick="cancelEdit()" id="btn-cancel" style="display: none;"><div class="icon icon-x"></div> Отмена</button>
                    </div>
                </div>

                <!-- ПРАВАЯ ЧАСТЬ: СПИСОК СООБЩЕНИЙ -->
                <div class="form-card">
                    <h3 style="color: var(--gold); margin-bottom: 20px; font-family: 'Georgia', serif;">Активные сообщения</h3>
                    <div id="rr-list">
                        <p style="color: var(--text-muted);">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-guides': '/guides', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-logs': '/logs', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;
        
        let serverRoles = [];
        let currentEditId = null;

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => {
            document.getElementById('server-name').innerText = data.name;
            serverRoles = data.roles;
            addRoleRow();
            loadExisting();
        });

        function addRoleRow(data = { roleId: '', emoji: '', label: '' }) {
            const container = document.getElementById('roles-container');
            const row = document.createElement('div');
            row.className = 'role-row';
            let options = serverRoles.map(r => `<option value="${r.id}" ${r.id === data.roleId ? 'selected' : ''}>${r.name}</option>`).join('');
            
            row.innerHTML = `
                <select class="rr-role">${options}</select>
                <input type="text" class="rr-emoji" placeholder="Эмодзи" value="${data.emoji || ''}">
                <input type="text" class="rr-label" placeholder="Текст кнопки" value="${data.label || ''}">
                <button class="btn btn-danger btn-small" onclick="this.parentElement.remove()"><div class="icon icon-x"></div></button>
            `;
            container.appendChild(row);
        }

        function loadExisting() {
            fetch(`/api/guild/${guildId}/reactionroles`).then(res => res.json()).then(data => {
                const list = document.getElementById('rr-list');
                if (data.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted);">Сообщений пока нет.</p>';
                    return;
                }
                list.innerHTML = '';
                data.forEach(rr => {
                    list.innerHTML += `
                        <div class="rr-card">
                            <h4 style="color: var(--gold); margin-bottom: 5px;">${rr.title}</h4>
                            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Канал: <#${rr.channelId}> • Ролей: ${rr.roles.length}</p>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn btn-small" onclick='editMessage(${JSON.stringify(rr).replace(/'/g, "&#39;")})' style="flex: 1;"><div class="icon icon-pencil"></div> Ред.</button>
                                <button class="btn btn-danger btn-small" onclick="deleteMessage('${rr.messageId}')" style="flex: 1;"><div class="icon icon-trash"></div> Удалить</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function saveReactionRoles() {
            const roles = [];
            document.querySelectorAll('#roles-container .role-row').forEach(row => {
                roles.push({
                    roleId: row.querySelector('.rr-role').value,
                    emoji: row.querySelector('.rr-emoji').value,
                    label: row.querySelector('.rr-label').value || 'Получить роль'
                });
            });

            const payload = {
                title: document.getElementById('rr-title').value,
                desc: document.getElementById('rr-desc').value,
                color: document.getElementById('rr-color').value,
                mode: document.getElementById('rr-mode').value,
                roles: roles
            };

            if (!currentEditId) {
                payload.channelId = document.getElementById('rr-channel').value;
                if (!payload.channelId) return alert('Укажите ID канала!');
            }

            const method = currentEditId ? 'PUT' : 'POST';
            const url = currentEditId ? `/api/guild/${guildId}/reactionroles/${currentEditId}` : `/api/guild/${guildId}/reactionroles`;

            const btn = document.getElementById('btn-save');
            btn.innerHTML = 'Отправка...'; btn.disabled = true;

            fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(res => res.json()).then(data => {
                if (data.success) {
                    alert(currentEditId ? '✅ Обновлено!' : '✅ Отправлено!');
                    cancelEdit();
                    loadExisting();
                } else alert('❌ Ошибка: ' + data.error);
            }).finally(() => {
                btn.innerHTML = '<div class="icon icon-paper-plane"></div> Отправить'; btn.disabled = false;
            });
        }

        function editMessage(rr) {
            currentEditId = rr.messageId;
            document.getElementById('form-title').innerText = 'Редактировать сообщение';
            document.getElementById('rr-title').value = rr.title;
            document.getElementById('rr-desc').value = rr.desc || '';
            document.getElementById('rr-color').value = rr.color || '#2ecc71';
            document.getElementById('rr-mode').value = rr.mode;
            document.getElementById('channel-group').style.display = 'none'; // Скрываем канал при редактировании
            document.getElementById('btn-cancel').style.display = 'block';
            
            document.getElementById('roles-container').innerHTML = '';
            rr.roles.forEach(r => addRoleRow(r));
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            currentEditId = null;
            document.getElementById('form-title').innerText = 'Создать сообщение';
            document.getElementById('edit-message-id').value = '';
            document.getElementById('rr-title').value = '';
            document.getElementById('rr-desc').value = '';
            document.getElementById('rr-color').value = '#2ecc71';
            document.getElementById('rr-channel').value = '';
            document.getElementById('channel-group').style.display = 'block';
            document.getElementById('btn-cancel').style.display = 'none';
            
            document.getElementById('roles-container').innerHTML = '';
            addRoleRow();
        }

        function deleteMessage(id) {
            if (!confirm('Удалить это сообщение из Discord и базы?')) return;
            fetch(`/api/guild/${guildId}/reactionroles/${id}`, { method: 'DELETE' })
                .then(res => res.json()).then(data => {
                    if (data.success) {
                        alert('Сообщение удалено!');
                        loadExisting();
                    }
                });
        }
    </script>
</body>
</html>
