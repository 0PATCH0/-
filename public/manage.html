<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Роли по кнопкам</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2 id="server-name">Загрузка...</h2>
        <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;">← К списку серверов</a>
        <hr style="border-color: var(--border);">
        <a href="#" id="link-back">🏠 На главную сервера</a>
        <a href="#" class="active">🎭 Роли по кнопкам</a>
    </div>

    <div class="content">
        <div class="header">
            <h1>🎭 Роли по кнопкам</h1>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label>Заголовок Embed-сообщения</label>
                <input type="text" id="embed-title" placeholder="Например: Выберите свои роли">
            </div>
            
            <div class="form-group">
                <label>Описание</label>
                <textarea id="embed-desc" placeholder="Выберите роли, которые будут отображаться в вашем профиле..."></textarea>
            </div>

            <div class="form-group">
                <label>Цвет полоски (HEX)</label>
                <input type="text" id="embed-color" value="#5865F2" placeholder="#5865F2">
            </div>

            <div class="form-group">
                <label>ID Канала (куда отправить сообщение)</label>
                <input type="text" id="channel-id" placeholder="123456789012345678">
            </div>

            <div class="form-group">
                <label>Режим выбора</label>
                <select id="role-mode">
                    <option value="multiple">Можно брать несколько ролей</option>
                    <option value="single">Только одну роль (авто-снятие старой)</option>
                </select>
            </div>

            <hr style="border-color: var(--border); margin: 30px 0;">
            
            <h3>Кнопки ролей</h3>
            <div id="roles-container"></div>
            
            <button class="btn btn-small btn-success" onclick="addRoleRow()" style="margin-bottom: 20px;">+ Добавить кнопку</button>
            
            <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
                <button class="btn" onclick="saveSettings()">💾 Сохранить и отправить</button>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2]; // Получаем ID из URL /manage/ID/reactionroles
        let serverRoles = [];

        // 1. Загружаем данные
        fetch(`/api/guild/${guildId}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('server-name').innerText = data.name;
                document.getElementById('link-back').href = `/manage/${guildId}`;
                serverRoles = data.roles;
                addRoleRow(); // Добавляем одну пустую строку для удобства
            });

        // 2. Добавление строки
        function addRoleRow() {
            const container = document.getElementById('roles-container');
            const row = document.createElement('div');
            row.className = 'role-row';
            
            let options = serverRoles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            
            row.innerHTML = `
                <select class="role-select">${options}</select>
                <input type="text" class="role-label" placeholder="Текст на кнопке">
                <input type="text" class="role-emoji" placeholder="Эмодзи (не обяз.)" style="max-width: 100px;">
                <button class="btn btn-small btn-danger" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        // 3. Сохранение (пока просто показывает данные)
        function saveSettings() {
            const title = document.getElementById('embed-title').value;
            const desc = document.getElementById('embed-desc').value;
            const color = document.getElementById('embed-color').value;
            const channelId = document.getElementById('channel-id').value;
            const mode = document.getElementById('role-mode').value;

            const roles = [];
            document.querySelectorAll('.role-row').forEach(row => {
                roles.push({
                    roleId: row.querySelector('.role-select').value,
                    label: row.querySelector('.role-label').value || 'Роль',
                    emoji: row.querySelector('.role-emoji').value || null
                });
            });

            console.log("Отправляем данные:", { title, desc, color, channelId, mode, roles });
            alert('Данные собраны! (Код отправки напишем на следующем шаге)');
        }
    </script>
</body>
</html>
