<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Роли по кнопкам — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>
    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в управление</a>
        </nav>
        <div class="page-title">
            <h1>🎭 Роли по кнопкам</h1>
            <p>☯ Выберите роль — получите доступ</p>
        </div>
        <div class="panel" id="error-panel" style="display:none;">
            <div class="empty-state" id="error-msg"></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;" id="rr-layout">
            <div class="panel">
                <div class="panel-title"><span id="form-title">Создать сообщение</span></div>
                <div class="form-group"><label>Заголовок</label><input type="text" id="rr-title" placeholder="Например: Выберите свои роли"></div>
                <div class="form-group"><label>Описание</label><textarea id="rr-desc" placeholder="Выберите роли..." style="height: 80px;"></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Цвет</label><input type="color" id="rr-color" value="#d4af37" style="height: 45px; padding: 5px;"></div>
                    <div class="form-group" id="channel-group"><label>ID канала</label><input type="text" id="rr-channel" placeholder="123456789..."></div>
                </div>
                <div class="form-group">
                    <label>Режим выбора</label>
                    <select id="rr-mode">
                        <option value="multiple">Можно брать несколько ролей</option>
                        <option value="single">Только одну роль</option>
                    </select>
                </div>
                <div class="panel-title" style="margin-top: 20px;"><span>Кнопки ролей</span></div>
                <div id="roles-container"></div>
                <button class="btn btn-secondary btn-small" onclick="addRoleRow()" style="margin-bottom: 20px;">+ Добавить кнопку</button>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-primary" onclick="saveReactionRoles()" id="btn-save" style="flex: 1;">📤 Отправить</button>
                    <button class="btn btn-danger" onclick="cancelEdit()" id="btn-cancel" style="display: none;">Отмена</button>
                </div>
            </div>
            <div class="panel">
                <div class="panel-title"><span>Активные сообщения</span></div>
                <div id="rr-list"><div class="empty-state">Загрузка...</div></div>
            </div>
        </div>
    </div>
    <style>
        @media (max-width: 900px) { #rr-layout { grid-template-columns: 1fr !important; } }
        .role-row { display: grid; grid-template-columns: 1fr 80px 1fr 36px; gap: 8px; margin-bottom: 8px; }
        .role-row select, .role-row input {
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: var(--text-main); padding: 8px 10px;
            border-radius: 6px; font-family: 'Marcellus', serif; font-size: 13px;
        }
        .rr-card {
            background: rgba(0,0,0,0.35); border: 1px solid var(--border);
            border-left: 3px solid var(--gold); border-radius: 10px;
            padding: 14px; margin-bottom: 10px;
        }
        .rr-card h4 { color: var(--gold); font-family: 'Cinzel', serif; margin-bottom: 6px; font-size: 15px; }
        .rr-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    </style>
    <script>
        const guildId = window.location.pathname.split('/')[2];
        const backLink = document.getElementById('back-link');
        if (backLink) backLink.href = '/manage/' + guildId;

        let serverRoles = [];
        let currentEditId = null;

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        async function init() {
            try {
                const res = await fetch('/api/guild/' + guildId, { credentials: 'include' });
                if (res.status === 403) {
                    document.getElementById('error-panel').style.display = 'block';
                    document.getElementById('error-msg').textContent = '❌ У вас нет прав модератора на этом сервере.';
                    document.getElementById('rr-list').innerHTML = '';
                    return;
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                serverRoles = data.roles || [];
                addRoleRow();
                loadExisting();
            } catch (e) {
                document.getElementById('error-panel').style.display = 'block';
                document.getElementById('error-msg').textContent = '❌ Ошибка загрузки: ' + e.message;
            }
        }

        function addRoleRow(data = { roleId: '', emoji: '', label: '' }) {
            const container = document.getElementById('roles-container');
            const row = document.createElement('div');
            row.className = 'role-row';
            let options = serverRoles.map(r => `<option value="${r.id}" ${r.id === data.roleId ? 'selected' : ''}>${r.name}</option>`).join('');
            row.innerHTML = `
                <select class="rr-role">${options}</select>
                <input type="text" class="rr-emoji" placeholder="🎭" value="${escapeHtml(data.emoji || '')}">
                <input type="text" class="rr-label" placeholder="Текст" value="${escapeHtml(data.label || '')}">
                <button class="btn btn-danger btn-small" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        }

        function loadExisting() {
            fetch('/api/guild/' + guildId + '/reactionroles', { credentials: 'include' })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    const list = document.getElementById('rr-list');
                    if (!data || data.length === 0) {
                        list.innerHTML = '<div class="empty-state">Сообщений пока нет.</div>';
                        return;
                    }
                    list.innerHTML = '';
                    data.forEach(rr => {
                        const card = document.createElement('div');
                        card.className = 'rr-card';
                        card.innerHTML = `
                            <h4>${escapeHtml(rr.title)}</h4>
                            <p>Канал: ${escapeHtml(rr.channelId)} • Ролей: ${rr.roles.length}</p>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn btn-secondary btn-small" style="flex: 1;">✏ Ред.</button>
                                <button class="btn btn-danger btn-small" style="flex: 1;">🗑 Удалить</button>
                            </div>
                        `;
                        card.querySelector('.btn-secondary').onclick = () => editMessage(rr);
                        card.querySelector('.btn-danger').onclick = () => deleteMessage(rr.messageId);
                        list.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('rr-list').innerHTML =
                        '<div class="empty-state">Ошибка загрузки: ' + escapeHtml(err.message) + '</div>';
                });
        }

        function saveReactionRoles() {
            const roles = [];
            document.querySelectorAll('#roles-container .role-row').forEach(row => {
                roles.push({
                    roleId: row.querySelector('.rr-role').value,
                    emoji: row.querySelector('.rr-emoji').value,
                    label: row.querySelector('.rr-label').value || 'Получить роль'
                });
            });
            const payload = {
                title: document.getElementById('rr-title').value,
                desc: document.getElementById('rr-desc').value,
                color: document.getElementById('rr-color').value,
                mode: document.getElementById('rr-mode').value,
                roles
            };
            if (!currentEditId) {
                payload.channelId = document.getElementById('rr-channel').value;
                if (!payload.channelId) return alert('Укажите ID канала!');
            }
            const method = currentEditId ? 'PUT' : 'POST';
            const url = currentEditId
                ? '/api/guild/' + guildId + '/reactionroles/' + currentEditId
                : '/api/guild/' + guildId + '/reactionroles';
            const btn = document.getElementById('btn-save');
            btn.innerHTML = 'Отправка...'; btn.disabled = true;
            fetch(url, { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(currentEditId ? '✅ Обновлено!' : '✅ Отправлено!');
                        cancelEdit();
                        loadExisting();
                    } else alert('❌ Ошибка: ' + (data.error || 'неизвестно'));
                })
                .finally(() => { btn.innerHTML = '📤 Отправить'; btn.disabled = false; });
        }

        function editMessage(rr) {
            currentEditId = rr.messageId;
            document.getElementById('form-title').innerText = 'Редактировать сообщение';
            document.getElementById('rr-title').value = rr.title;
            document.getElementById('rr-desc').value = rr.desc || '';
            document.getElementById('rr-color').value = rr.color || '#d4af37';
            document.getElementById('rr-mode').value = rr.mode;
            document.getElementById('channel-group').style.display = 'none';
            document.getElementById('btn-cancel').style.display = 'block';
            document.getElementById('roles-container').innerHTML = '';
            rr.roles.forEach(r => addRoleRow(r));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            currentEditId = null;
            document.getElementById('form-title').innerText = 'Создать сообщение';
            document.getElementById('rr-title').value = '';
            document.getElementById('rr-desc').value = '';
            document.getElementById('rr-color').value = '#d4af37';
            document.getElementById('rr-channel').value = '';
            document.getElementById('channel-group').style.display = 'block';
            document.getElementById('btn-cancel').style.display = 'none';
            document.getElementById('roles-container').innerHTML = '';
            addRoleRow();
        }

        function deleteMessage(id) {
            if (!confirm('Удалить это сообщение из Discord и базы?')) return;
            fetch('/api/guild/' + guildId + '/reactionroles/' + id, { method: 'DELETE', credentials: 'include' })
                .then(res => res.json())
                .then(data => { if (data.success) { alert('Удалено!'); loadExisting(); } });
        }

        init();
    </script>
</body>
</html>
