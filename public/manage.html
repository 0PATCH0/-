<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Роли по кнопкам</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"></a>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;"><div class="icon icon-arrow-left"></div> К списку серверов</a>
            <hr style="border-color: var(--border-color); margin-bottom: 20px;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" id="nav-guides"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" class="active"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" id="nav-rem"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" id="nav-mod"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" id="nav-logs"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" id="nav-emb"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-masks"></div> Роли по кнопкам</h1></div>
            <div class="form-card">
                <div class="form-group"><label>Заголовок</label><input type="text" id="rr-title" placeholder="Например: Выберите свои роли"></div>
                <div class="form-group"><label>Описание</label><textarea id="rr-desc" placeholder="Выберите роли..." style="height: 80px;"></textarea></div>
                <div class="form-group"><label>Цвет (HEX)</label><input type="color" id="rr-color" value="#2ecc71" style="height: 45px; padding: 5px;"></div>
                <div class="form-group"><label>ID Канала</label><input type="text" id="rr-channel" placeholder="123456789012345678"></div>
                <div class="form-group"><label>Режим выбора</label>
                    <select id="rr-mode">
                        <option value="multiple">Можно брать несколько ролей</option>
                        <option value="single">Только одну роль</option>
                    </select>
                </div>

                <hr style="border-color: var(--border-color); margin: 20px 0;">
                <h3 style="color: var(--accent-gold); margin-bottom: 15px; font-family: 'Georgia', serif;">Кнопки ролей</h3>
                <div id="roles-container"></div>
                <button class="btn btn-success btn-small" onclick="addRoleRow()" style="margin-bottom: 20px;"><div class="icon icon-plus"></div> Добавить кнопку</button>
                
                <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <button class="btn" onclick="saveReactionRoles()" id="btn-save-rr"><div class="icon icon-paper-plane"></div> Отправить в Discord</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-guides': '/guides', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-logs': '/logs', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;
        let serverRoles = [];

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => {
            document.getElementById('server-name').innerText = data.name;
            serverRoles = data.roles;
            addRoleRow();
        });

        function addRoleRow() {
            const container = document.getElementById('roles-container');
            const row = document.createElement('div');
            row.className = 'role-row';
            let options = serverRoles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            
            row.innerHTML = `
                <select class="rr-role" style="flex: 1;">${options}</select>
                <input type="text" class="rr-label" placeholder="Текст кнопки" style="flex: 1;">
                <button class="btn btn-danger btn-small" onclick="this.parentElement.remove()"><div class="icon icon-x"></div></button>
            `;
            container.appendChild(row);
        }

        function saveReactionRoles() {
            const roles = [];
            document.querySelectorAll('#roles-container .role-row').forEach(row => {
                roles.push({
                    roleId: row.querySelector('.rr-role').value,
                    label: row.querySelector('.rr-label').value || 'Получить роль'
                });
            });

            const payload = {
                title: document.getElementById('rr-title').value,
                desc: document.getElementById('rr-desc').value,
                color: document.getElementById('rr-color').value,
                channelId: document.getElementById('rr-channel').value,
                mode: document.getElementById('rr-mode').value,
                roles: roles
            };

            if (!payload.channelId) return alert('Укажите ID канала!');
            const btn = document.getElementById('btn-save-rr');
            btn.innerHTML = 'Отправка...'; btn.disabled = true;

            fetch(`/api/guild/${guildId}/reactionroles`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                if (data.success) alert('✅ Сообщение отправлено в Discord!');
                else alert('❌ Ошибка: ' + data.error);
            }).finally(() => {
                btn.innerHTML = '<div class="icon icon-paper-plane"></div> Отправить в Discord'; btn.disabled = false;
            });
        }
    </script>
</body>
</html>
