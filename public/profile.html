<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/style.css?v=25">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: rgba(212, 175, 55, 0.35);
            --jade: #2ecc71;
            --jade-glow: rgba(46, 204, 113, 0.5);
            --danger: #e74c3c;
            --border: rgba(212, 175, 55, 0.18);
            --text-main: #e8e3d4;
            --text-muted: #8a8578;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Marcellus', serif;
            color: var(--text-main);
            background: #06080a;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .bg-ink {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 90%, rgba(46, 204, 113, 0.04) 0%, transparent 40%),
                linear-gradient(180deg, #06080a 0%, #0b0e13 100%);
            pointer-events: none;
        }
        .fog {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at 50% 100%, rgba(212,175,55,0.05) 0%, transparent 50%);
        }
        .container {
            position: relative; z-index: 2;
            max-width: 960px; margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px;
            animation: fadeDown 0.8s ease-out;
        }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .logo {
            font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700;
            letter-spacing: 3px; color: var(--gold);
            text-shadow: 0 0 15px var(--gold-soft);
        }
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 13px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold); }

        .page-title {
            text-align: center; margin-bottom: 30px;
            animation: fadeUp 1s ease-out 0.2s both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .page-title h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(28px, 5vw, 42px);
            background: linear-gradient(135deg, #d4af37, #f4e4a0, #aa8624, #d4af37);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px; margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(212,175,55,0.3));
        }
        .page-title p {
            color: var(--text-muted); letter-spacing: 5px;
            text-transform: uppercase; font-size: 12px;
        }

        .switch-container {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.45);
            padding: 16px 20px; border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            position: relative; z-index: 1;
        }
        .switch-container h4 { margin: 0; color: var(--text-main); }
        .switch-container p { margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; inset: 0;
            background-color: #555; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 4px; bottom: 4px; background-color: white;
            transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--jade); box-shadow: 0 0 15px var(--jade-glow); }
        input:checked + .slider:before { transform: translateX(24px); }

        #characters-container { position: relative; z-index: 1; }
        .character-block {
            background: linear-gradient(160deg, rgba(18, 22, 28, 0.9), rgba(10, 12, 16, 0.95));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s ease-out;
        }
        .character-block::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .char-title {
            font-family: 'Cinzel', serif; color: var(--gold);
            margin-bottom: 18px; font-size: 18px;
            display: flex; justify-content: space-between; align-items: center;
            letter-spacing: 1px;
        }
        .remove-char-btn {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-size: 12px;
            transition: 0.2s;
            font-family: 'Marcellus', serif;
        }
        .remove-char-btn:hover { background: var(--danger); color: #fff; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; font-size: 12px; color: var(--text-muted);
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px; border-radius: 8px;
            font-family: 'Marcellus', serif; font-size: 14px;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212,175,55,0.2);
        }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .build-tabs {
            display: flex; gap: 10px; margin-bottom: 20px;
            background: rgba(0,0,0,0.5); padding: 6px;
            border-radius: 12px; border: 1px solid rgba(212,175,55,0.1);
        }
        .tab-btn {
            flex: 1; padding: 12px;
            background: transparent; border: none;
            color: var(--text-muted); border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 15px;
            transition: 0.3s; font-family: 'Marcellus', serif;
        }
        .tab-btn.active.pve { background: rgba(46, 204, 113, 0.15); color: var(--jade); }
        .tab-btn.active.pvp { background: rgba(231, 76, 60, 0.15); color: var(--danger); }

        .build-content { display: none; }
        .build-content.active { display: block; animation: fadeUp 0.3s ease-out; }

        .equipment-panel {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(212,175,55,0.1);
        }
        .panel-title {
            font-size: 13px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            font-family: 'Cinzel', serif;
        }
        .panel-title.mystic { color: #e2b95c; }
        .panel-title.inner { color: #6db38a; }
        .slot-counter {
            font-size: 12px; background: rgba(255,255,255,0.08);
            padding: 3px 10px; border-radius: 10px;
            color: var(--text-muted);
        }
        .slot-counter.full { background: rgba(212,175,55,0.2); color: var(--gold); }

        .slots-grid { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
        .slots-grid.two-cols { grid-template-columns: repeat(2, 1fr); }

        .equip-slot {
            background: rgba(0,0,0,0.6);
            border: 1px dashed rgba(255,255,255,0.18);
            border-radius: 10px; aspect-ratio: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
            position: relative; overflow: hidden;
        }
        .equip-slot:hover {
            border-color: var(--gold);
            background: rgba(212,175,55,0.06);
            box-shadow: 0 0 14px rgba(212,175,55,0.15);
        }
        .equip-slot.filled {
            border-style: solid;
            border-color: rgba(212,175,55,0.4);
            background: #0d0f14;
        }
        .equip-slot.filled:hover { border-color: var(--gold); }
        .equip-slot img { width: 78%; height: 78%; object-fit: contain; }
        .equip-slot .empty-icon { font-size: 24px; color: rgba(255,255,255,0.1); }
        .equip-slot .slot-name {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85); font-size: 9px;
            padding: 3px; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #ccc;
        }
        .equip-slot .remove-icon {
            position: absolute; top: 3px; right: 3px;
            width: 16px; height: 16px;
            background: rgba(231,76,60,0.85); color: white;
            border-radius: 50%; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.2s; z-index: 2;
        }
        .equip-slot:hover .remove-icon { opacity: 1; }

        .rarity-Legendary { border-color: #d4af37 !important; box-shadow: inset 0 0 12px rgba(212,175,55,0.35) !important; }
        .rarity-Epic      { border-color: #9b59b6 !important; box-shadow: inset 0 0 12px rgba(155,89,182,0.3) !important; }
        .rarity-Rare      { border-color: #3498db !important; box-shadow: inset 0 0 12px rgba(52,152,219,0.3) !important; }
        .rarity-Common    { border-color: #7f8c8d !important; }
        .rarity-Offensive { border-color: #e74c3c !important; box-shadow: inset 0 0 12px rgba(231,76,60,0.3) !important; }
        .rarity-General   { border-color: #2ecc71 !important; box-shadow: inset 0 0 12px rgba(46,204,113,0.3) !important; }
        .rarity-Movement  { border-color: #3498db !important; box-shadow: inset 0 0 12px rgba(52,152,219,0.3) !important; }

        .action-btns {
            display: flex; flex-direction: column; gap: 10px;
            margin-top: 20px; position: relative; z-index: 1;
        }
        .action-btns button {
            width: 100%; padding: 14px;
            border-radius: 10px; font-family: 'Cinzel', serif;
            font-size: 14px; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; transition: 0.2s;
            border: 1px solid transparent;
        }
        .btn-add {
            background: rgba(46,204,113,0.1); color: var(--jade);
            border-color: rgba(46,204,113,0.4);
        }
        .btn-add:hover { background: rgba(46,204,113,0.25); }
        .btn-save {
            background: linear-gradient(135deg, #d4af37, #aa8624);
            color: #0a0b10;
            box-shadow: 0 6px 25px rgba(212,175,55,0.25);
        }
        .btn-save:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-delete {
            background: rgba(231,76,60,0.1); color: var(--danger);
            border-color: rgba(231,76,60,0.4);
        }
        .btn-delete:hover { background: rgba(231,76,60,0.25); }

        /* Модалка */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: linear-gradient(160deg, #12161c, #0a0c11);
            width: 95%; max-width: 820px; height: 85vh;
            border-radius: 16px; border: 1px solid var(--gold);
            box-shadow: 0 0 50px rgba(212,175,55,0.25);
            display: flex; flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 {
            color: var(--gold); font-family: 'Cinzel', serif;
            margin: 0; font-size: 18px; letter-spacing: 1px;
        }
        .modal-close {
            background: none; border: none; color: var(--danger);
            font-size: 28px; cursor: pointer; line-height: 1;
        }
        .modal-filters {
            padding: 10px 20px;
            display: flex; gap: 8px; flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.25);
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 5px 12px; border-radius: 20px;
            font-size: 12px; cursor: pointer; transition: 0.2s;
            font-family: 'Marcellus', serif;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.1); }
        .filter-btn.active {
            background: rgba(212,175,55,0.15);
            border-color: rgba(212,175,55,0.5);
            color: var(--gold);
        }
        .modal-body {
            flex: 1; overflow-y: auto; padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px; align-content: start;
        }
        .modal-footer {
            padding: 15px 20px; border-top: 1px solid var(--border);
            display: flex; justify-content: flex-end; gap: 10px;
        }
        .modal-footer button {
            padding: 10px 20px; border-radius: 8px;
            font-family: 'Marcellus', serif; font-size: 14px;
            cursor: pointer; border: 1px solid transparent;
        }
        .skill-card {
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 4px; background: rgba(0,0,0,0.4);
            border: 2px solid transparent; border-radius: 10px;
            cursor: pointer; transition: 0.2s;
            text-align: center; position: relative;
        }
        .skill-card:hover { transform: translateY(-2px); border-color: rgba(212,175,55,0.35); }
        .skill-card.selected {
            border-color: var(--gold);
            background: rgba(212,175,55,0.1);
        }
        .skill-card img {
            width: 48px; height: 48px; border-radius: 6px;
            object-fit: cover; background: #0a0b10;
        }
        .skill-card span {
            font-size: 10px; margin-top: 6px;
            color: var(--text-muted); line-height: 1.2;
        }
        .skill-card.selected span { color: var(--gold); font-weight: bold; }
        .skill-card .rarity-bar {
            position: absolute; bottom: 0; left: 8%; right: 8%;
            height: 2px; border-radius: 2px;
            background: rgba(255,255,255,0.08);
        }

        @media (max-width: 600px) {
            .slots-grid { grid-template-columns: repeat(4, 1fr); }
            .equip-slot .slot-name { font-size: 8px; }
            .character-block { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в гильдию</a>
        </nav>

        <div class="page-title">
            <h1>Мои персонажи</h1>
            <p>☯ Путь Уся начинается с имени</p>
        </div>

        <div class="switch-container">
            <div>
                <h4>Сделать профиль глобальным?</h4>
                <p>Будет виден на всех серверах бота.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="is-global">
                <span class="slider"></span>
            </label>
        </div>

        <div id="characters-container"></div>

        <div class="action-btns">
            <button class="btn-add" onclick="addCharacter()" id="btn-add">+ Добавить персонажа</button>
            <button class="btn-save" onclick="saveProfile()" id="btn-save">💾 Сохранить профиль</button>
            <button class="btn-delete" onclick="deleteMyProfile()" id="btn-delete-profile" style="display:none;">🗑️ Удалить профиль</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Выбор навыков</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-filters" id="modal-filters"></div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button style="background: rgba(0,0,0,0.4); color: var(--text-muted); border-color: var(--border);" onclick="closeModal()">Отмена</button>
                <button style="background: var(--gold); color: #000; font-weight: bold;" onclick="applyModal()">Применить</button>
            </div>
        </div>
    </div>

    <script src="/js/gamedata.js"></script>
    <script src="/js/gamedata_meta.js"></script>
    <script>
        window.addEventListener('load', () => loadProfile());

        const urlParams = new URLSearchParams(window.location.search);
        let guildId = urlParams.get('guild') || window.location.pathname.split('/').pop();
        const targetUserId = urlParams.get('user');
        const effectiveGuildId = (guildId && guildId !== 'profile') ? guildId : 'global';

        document.getElementById('back-link').href = '/guild/' + effectiveGuildId;

        let charCount = 0;
        let modalContext = { blockId: null, type: 'mystic', activeTab: 'PvE', slotIndex: null, temp: [], filter: 'all' };
        let charDataCache = {};
        const LIMITS = { mystic: 8, inner: 4 };

        function getMeta(type, id) {
            if (!window.GAME_META) return { rarity: 'Common', desc: '' };
            const source = type === 'mystic' ? window.GAME_META.mysticSkills : window.GAME_META.innerWays;
            return source[id] || { rarity: 'Common', desc: '' };
        }
        function getItemById(type, id) {
            if (!window.GAME_DATA) return null;
            const list = type === 'mystic' ? window.GAME_DATA.mysticSkills : window.GAME_DATA.innerWays;
            return (list || []).find(x => x.id === id) || null;
        }
        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }
        function updateField(blockId, field, value) {
            if (charDataCache[blockId]) charDataCache[blockId][field] = value;
        }

        function createBlock(data = {}, index = 0) {
            charCount++;
            const blockId = 'char-' + charCount;
            charDataCache[blockId] = {
                _id: data._id || null,
                gameNickname: data.gameNickname || '',
                guildName: data.guildName || '',
                bio: data.bio || '',
                builds: data.builds || {
                    PvE: { mysticSkills: [], innerWays: [], martialArts: [] },
                    PvP: { mysticSkills: [], innerWays: [], martialArts: [] }
                }
            };
            ['PvE', 'PvP'].forEach(tab => {
                if (!charDataCache[blockId].builds[tab]) charDataCache[blockId].builds[tab] = { mysticSkills: [], innerWays: [], martialArts: [] };
                if (!Array.isArray(charDataCache[blockId].builds[tab].mysticSkills)) charDataCache[blockId].builds[tab].mysticSkills = [];
                if (!Array.isArray(charDataCache[blockId].builds[tab].innerWays)) charDataCache[blockId].builds[tab].innerWays = [];
                if (!Array.isArray(charDataCache[blockId].builds[tab].martialArts)) charDataCache[blockId].builds[tab].martialArts = [];
            });

            const block = document.createElement('div');
            block.className = 'character-block';
            block.id = blockId;

            block.innerHTML = `
                <div class="char-title">
                    <span>⚔️ Персонаж ${index + 1}</span>
                    <button class="remove-char-btn" onclick="removeCharacter('${blockId}')">Удалить</button>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
                    <div class="form-group"><label>Игровой ник</label><input type="text" value="${escapeHtml(data.gameNickname || '')}" placeholder="Ник" oninput="updateField('${blockId}','gameNickname',this.value)"></div>
                    <div class="form-group"><label>Гильдия</label><input type="text" value="${escapeHtml(data.guildName || '')}" placeholder="Гильдия" oninput="updateField('${blockId}','guildName',this.value)"></div>
                </div>
                <div class="form-group"><label>О себе</label><textarea oninput="updateField('${blockId}','bio',this.value)">${escapeHtml(data.bio || '')}</textarea></div>

                <div class="build-tabs">
                    <button class="tab-btn active pve" onclick="switchTab('${blockId}', 'PvE')">🌿 PvE Билд</button>
                    <button class="tab-btn pvp" onclick="switchTab('${blockId}', 'PvP')">⚔️ PvP Билд</button>
                </div>
                <div class="build-content active" id="pve-content-${blockId}">${renderBuildUI(blockId, 'PvE')}</div>
                <div class="build-content" id="pvp-content-${blockId}">${renderBuildUI(blockId, 'PvP')}</div>
            `;
            document.getElementById('characters-container').appendChild(block);
            renderAllSlots(blockId);
        }

        function renderBuildUI(blockId, activeTab) {
            return `
                <div class="equipment-panel">
                    <div class="panel-header">
                        <div class="panel-title mystic">✨ Мистические навыки</div>
                        <div class="slot-counter" id="mystic-counter-${activeTab}-${blockId}">0 / ${LIMITS.mystic}</div>
                    </div>
                    <div class="slots-grid" id="mystic-slots-${activeTab}-${blockId}">
                        ${Array.from({length: LIMITS.mystic}).map((_, i) => `
                            <div class="equip-slot" id="mystic-slot-${activeTab}-${blockId}-${i}" onclick="openModal('${blockId}', 'mystic', '${activeTab}', ${i})"><span class="empty-icon">+</span></div>
                        `).join('')}
                    </div>
                </div>
                <div class="equipment-panel">
                    <div class="panel-header">
                        <div class="panel-title inner">🌀 Внутренние пути</div>
                        <div class="slot-counter" id="inner-counter-${activeTab}-${blockId}">0 / ${LIMITS.inner}</div>
                    </div>
                    <div class="slots-grid" id="inner-slots-${activeTab}-${blockId}">
                        ${Array.from({length: LIMITS.inner}).map((_, i) => `
                            <div class="equip-slot" id="inner-slot-${activeTab}-${blockId}-${i}" onclick="openModal('${blockId}', 'inner', '${activeTab}', ${i})"><span class="empty-icon">+</span></div>
                        `).join('')}
                    </div>
                </div>
                <div class="equipment-panel">
                    <div class="panel-header">
                        <div class="panel-title" style="color:#c084fc;">🥋 Боевые искусства</div>
                        <div class="slot-counter" id="martial-counter-${activeTab}-${blockId}">0 / 2</div>
                    </div>
                    <div class="slots-grid two-cols" id="martial-slots-${activeTab}-${blockId}">
                        ${Array.from({length: 2}).map((_, i) => `
                            <div class="equip-slot" id="martial-slot-${activeTab}-${blockId}-${i}" onclick="openMartialModal('${blockId}', '${activeTab}', ${i})"><span class="empty-icon">+</span></div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAllSlots(blockId) {
            const data = charDataCache[blockId];
            if (!data) return;
            ['PvE', 'PvP'].forEach(tab => {
                ['mystic', 'inner'].forEach(type => {
                    const arr = data.builds[tab][type === 'mystic' ? 'mysticSkills' : 'innerWays'] || [];
                    const limit = LIMITS[type];
                    for (let i = 0; i < limit; i++) {
                        const slot = document.getElementById(`${type}-slot-${tab}-${blockId}-${i}`);
                        if (!slot) continue;
                        const id = arr[i];
                        if (id) {
                            const item = getItemById(type, id);
                            const meta = getMeta(type, id);
                            slot.className = 'equip-slot filled rarity-' + (meta.rarity || 'Common');
                            slot.innerHTML = `
                                <img src="${item ? item.img : ''}" alt="" onerror="this.style.display='none'">
                                <span class="slot-name">${item ? escapeHtml(item.nameRU || item.nameEN) : id}</span>
                                <span class="remove-icon" onclick="removeSlot(event,'${blockId}','${type}','${tab}',${i})">×</span>
                            `;
                        } else {
                            slot.className = 'equip-slot';
                            slot.innerHTML = `<span class="empty-icon">+</span>`;
                        }
                    }
                    const counter = document.getElementById(`${type}-counter-${tab}-${blockId}`);
                    if (counter) {
                        const filled = arr.filter(Boolean).length;
                        counter.textContent = `${filled} / ${limit}`;
                        counter.classList.toggle('full', filled >= limit);
                    }
                });
            });
            renderMartialSlots(blockId);
        }

        function removeSlot(ev, blockId, type, tab, index) {
            ev.stopPropagation();
            const key = type === 'mystic' ? 'mysticSkills' : 'innerWays';
            charDataCache[blockId].builds[tab][key][index] = null;
            charDataCache[blockId].builds[tab][key] = charDataCache[blockId].builds[tab][key].filter(x => x !== null);
            renderAllSlots(blockId);
        }

        function switchTab(blockId, tab) {
            const block = document.getElementById(blockId);
            if (!block) return;
            block.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            block.querySelectorAll('.tab-btn').forEach(b => {
                if (b.textContent.includes(tab === 'PvE' ? 'PvE' : 'PvP')) b.classList.add('active', tab === 'PvE' ? 'pve' : 'pvp');
            });
            ['PvE', 'PvP'].forEach(t => {
                const el = document.getElementById(`${t.toLowerCase()}-content-${blockId}`);
                if (el) el.classList.toggle('active', t === tab);
            });
        }

        function openModal(blockId, type, tab, slotIndex) {
            modalContext = { blockId, type, activeTab: tab, slotIndex, temp: [], filter: 'all' };
            document.getElementById('modal-title').textContent = (type === 'mystic' ? 'Мистические навыки' : 'Внутренние пути') + ' — ' + tab;
            renderFilters();
            renderModalBody();
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            modalContext = { blockId: null, type: 'mystic', activeTab: 'PvE', slotIndex: null, temp: [], filter: 'all' };
        }
        function renderFilters() {
            const wrap = document.getElementById('modal-filters');
            if (!wrap) return;
                        const meta = window.GAME_META || {};
            const source = modalContext.type === 'mystic' ? (meta.mysticSkills || {}) : (meta.innerWays || {});
            const rarities = Array.from(new Set(Object.values(source).map(x => x.rarity || 'Common')));
            const russian = { Legendary: 'Легендарные', Epic: 'Эпические', Rare: 'Редкие', Common: 'Обычные', Offensive: 'Атака', General: 'Общие', Movement: 'Движение' };
            const all = ['all', ...rarities];
            wrap.innerHTML = all.map(r => `
                <button class="filter-btn ${modalContext.filter === r ? 'active' : ''}" onclick="setFilter('${r}')">
                    ${r === 'all' ? 'Все' : (russian[r] || r)}
                </button>
            `).join('');
        }

        function setFilter(r) {
            modalContext.filter = r;
            renderFilters();
            renderModalBody();
        }

        function renderModalBody() {
            const body = document.getElementById('modal-body');
            if (!body) return;
            const data = window.GAME_DATA || { mysticSkills: [], innerWays: [] };
            const meta = window.GAME_META || { mysticSkills: {}, innerWays: {} };
            const list = modalContext.type === 'mystic' ? data.mysticSkills : data.innerWays;
            const typeMeta = modalContext.type === 'mystic' ? meta.mysticSkills : meta.innerWays;
            const currentId = charDataCache[modalContext.blockId]
                && charDataCache[modalContext.blockId].builds[modalContext.activeTab]
                && charDataCache[modalContext.blockId].builds[modalContext.activeTab][modalContext.type === 'mystic' ? 'mysticSkills' : 'innerWays'][modalContext.slotIndex];

            const filtered = (list || []).filter(item => {
                if (modalContext.filter === 'all') return true;
                const m = typeMeta[item.id] || {};
                return (m.rarity || 'Common') === modalContext.filter;
            });

            if (filtered.length === 0) {
                body.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 30px;">Ничего не найдено</div>`;
                return;
            }

            body.innerHTML = filtered.map(item => {
                const m = typeMeta[item.id] || { rarity: 'Common', desc: '' };
                const selected = (item.id === currentId) ? 'selected' : '';
                return `
                    <div class="skill-card ${selected}" onclick="pickSkill('${item.id}')" title="${escapeHtml(m.desc || '')}">
                        <img src="${item.img}" alt="" onerror="this.style.opacity=0.2">
                        <span>${escapeHtml(item.nameRU || item.nameEN)}</span>
                        <div class="rarity-bar rarity-${m.rarity || 'Common'}"></div>
                    </div>
                `;
            }).join('');
        }

        function pickSkill(id) {
            modalContext.temp = [id];
            renderModalBody();
        }

        function applyModal() {
            if (!modalContext.blockId) return;
            const { blockId, type, activeTab, slotIndex } = modalContext;
            const key = type === 'mystic' ? 'mysticSkills' : 'innerWays';
            const arr = charDataCache[blockId].builds[activeTab][key];
            const pickedId = modalContext.temp[0];
            if (!pickedId) { closeModal(); return; }
            const dup = arr.indexOf(pickedId);
            if (dup !== -1 && dup !== slotIndex) arr[dup] = null;
            arr[slotIndex] = pickedId;
            charDataCache[blockId].builds[activeTab][key] = arr.filter(x => x !== null);
            renderAllSlots(blockId);
            closeModal();
        }

        function addCharacter() {
            const blocks = document.querySelectorAll('.character-block').length;
            if (blocks >= 3) { alert('Максимум 3 персонажа.'); return; }
            createBlock({}, blocks);
        }

        function removeCharacter(blockId) {
            const blocks = document.querySelectorAll('.character-block');
            if (blocks.length <= 1) { alert('Должен остаться хотя бы один персонаж.'); return; }
            const el = document.getElementById(blockId);
            if (el) el.remove();
            delete charDataCache[blockId];
            document.querySelectorAll('.character-block').forEach((b, i) => {
                const t = b.querySelector('.char-title span');
                if (t) t.textContent = '⚔️ Персонаж ' + (i + 1);
            });
        }

        async function saveProfile() {
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            const original = btn.innerHTML;
            btn.innerHTML = '⏳ Сохранение...';
            try {
                const characters = Object.keys(charDataCache).map(blockId => {
                    const c = charDataCache[blockId];
                    const cleanBuild = tab => {
                        const b = c.builds[tab] || { mysticSkills: [], innerWays: [], martialArts: [] };
                        return {
                            mysticSkills: (b.mysticSkills || []).filter(Boolean),
                            innerWays: (b.innerWays || []).filter(Boolean),
                            martialArts: (b.martialArts || []).filter(Boolean)
                        };
                    };
                    return {
                        gameNickname: c.gameNickname || '',
                        guildName: c.guildName || '',
                        bio: c.bio || '',
                        builds: { PvE: cleanBuild('PvE'), PvP: cleanBuild('PvP') }
                    };
                }).filter(c => c.gameNickname.trim().length > 0);

                if (characters.length === 0) {
                    alert('Заполните хотя бы одного персонажа (ник обязателен).');
                    btn.disabled = false;
                    btn.innerHTML = original;
                    return;
                }

                const isGlobal = document.getElementById('is-global').checked;
                const res = await fetch('/api/profile/' + encodeURIComponent(effectiveGuildId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ characters, isGlobal })
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
                alert('✅ Профиль сохранён');
                if (json.profile) loadProfileFromData(json.profile);
            } catch (e) {
                console.error(e);
                alert('❌ Ошибка сохранения: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = original;
            }
        }

        async function loadProfile() {
            try {
                const q = new URLSearchParams();
                if (targetUserId) q.set('user', targetUserId);
                const res = await fetch('/api/profile/' + encodeURIComponent(effectiveGuildId) + '?' + q.toString(), {
                    credentials: 'include'
                });
                if (!res.ok) { createBlock({}, 0); return; }
                const json = await res.json();
                loadProfileFromData(json);
            } catch (e) {
                console.error('loadProfile', e);
                createBlock({}, 0);
            }
        }

        function loadProfileFromData(profile) {
            const container = document.getElementById('characters-container');
            container.innerHTML = '';
            Object.keys(charDataCache).forEach(k => delete charDataCache[k]);
            charCount = 0;
            const characters = (profile && profile.characters) || [];
            if (characters.length === 0) {
                createBlock({}, 0);
            } else {
                characters.forEach((c, i) => createBlock(c, i));
            }
            const g = document.getElementById('is-global');
            if (g) g.checked = !!(profile && profile.isGlobal);
            const delBtn = document.getElementById('btn-delete-profile');
            if (delBtn) delBtn.style.display = (profile && profile._id) ? 'block' : 'none';
            if (targetUserId) {
                document.querySelectorAll('input, textarea').forEach(el => el.disabled = true);
                const addBtn = document.getElementById('btn-add');
                const saveBtn = document.getElementById('btn-save');
                if (addBtn) addBtn.style.display = 'none';
                if (saveBtn) saveBtn.style.display = 'none';
                if (delBtn) delBtn.style.display = 'none';
            }
        }

        async function deleteMyProfile() {
            if (!confirm('Удалить профиль полностью? Это действие необратимо.')) return;
            try {
                const res = await fetch('/api/profile/' + encodeURIComponent(effectiveGuildId), {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                alert('Профиль удалён');
                location.reload();
            } catch (e) {
                console.error(e);
                alert('❌ Ошибка удаления: ' + e.message);
            }
        }

        // ══════════ БОЕВЫЕ ИСКУССТВА ══════════

        function renderMartialSlots(blockId) {
            const data = charDataCache[blockId];
            if (!data) return;
            ['PvE', 'PvP'].forEach(tab => {
                const arr = (data.builds[tab] && data.builds[tab].martialArts) || [];
                for (let i = 0; i < 2; i++) {
                    const slot = document.getElementById(`martial-slot-${tab}-${blockId}-${i}`);
                    if (!slot) continue;
                    const id = arr[i];
                    if (id) {
                        const art = (window.GAME_DATA.martialArts || []).find(a => a.id === id);
                        slot.className = 'equip-slot filled';
                        slot.innerHTML = `
                            <div style="font-size:28px; line-height:1;">${art ? (art.emoji || '🥋') : '🥋'}</div>
                            <span class="slot-name">${art ? escapeHtml(art.nameRU) : id}</span>
                            <span class="remove-icon" onclick="removeMartial(event,'${blockId}','${tab}',${i})">×</span>
                        `;
                    } else {
                        slot.className = 'equip-slot';
                        slot.innerHTML = `<span class="empty-icon">+</span>`;
                    }
                }
                const counter = document.getElementById(`martial-counter-${tab}-${blockId}`);
                if (counter) {
                    const filled = arr.filter(Boolean).length;
                    counter.textContent = `${filled} / 2`;
                }
            });
        }

        function removeMartial(ev, blockId, tab, index) {
            ev.stopPropagation();
            const arr = (charDataCache[blockId].builds[tab].martialArts) || [];
            arr[index] = null;
            charDataCache[blockId].builds[tab].martialArts = arr.filter(x => x !== null);
            renderMartialSlots(blockId);
        }

        let martialModalCtx = { blockId: null, tab: 'PvE', slotIndex: 0 };
        let martialFilter = 'all';

        function openMartialModal(blockId, tab, slotIndex) {
            martialModalCtx = { blockId, tab, slotIndex };
            martialFilter = 'all';
            const title = document.getElementById('modal-title');
            if (title) title.textContent = '🥋 Боевые искусства — ' + tab;
            const filtersWrap = document.getElementById('modal-filters');
            if (filtersWrap) {
                const arts = (window.GAME_DATA && window.GAME_DATA.martialArts) || [];
                const paths = [...new Set(arts.map(a => a.path))];
                filtersWrap.innerHTML = `<button class="filter-btn active" onclick="filterMartial('all', this)">Все</button>` +
                    paths.map(p => `<button class="filter-btn" onclick="filterMartial('${p.replace(/'/g, "\\'")}', this)">${p}</button>`).join('');
            }
            renderMartialBody();
            const footer = document.querySelector('#modal .modal-footer');
            if (footer) footer.style.display = 'none';
            document.getElementById('modal').classList.add('active');
        }

        function filterMartial(path, btn) {
            martialFilter = path;
            document.querySelectorAll('#modal-filters .filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderMartialBody();
        }

        function renderMartialBody() {
            const body = document.getElementById('modal-body');
            if (!body) return;
            const arts = ((window.GAME_DATA && window.GAME_DATA.martialArts) || [])
                .filter(a => martialFilter === 'all' || a.path === martialFilter);
            if (arts.length === 0) {
                body.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:30px;">Ничего не найдено</div>`;
                return;
            }
            body.innerHTML = arts.map(a => `
                <div class="skill-card" onclick="pickMartial('${a.id}')" title="${escapeHtml(a.desc || '')}">
                    <div style="font-size:36px; line-height:1;">${a.emoji || '🥋'}</div>
                    <span>${escapeHtml(a.nameRU)}</span>
                    <div style="font-size:9px; color:var(--text-muted); margin-top:2px;">${a.path}</div>
                </div>
            `).join('');
        }

        function pickMartial(id) {
            const { blockId, tab, slotIndex } = martialModalCtx;
            const build = charDataCache[blockId].builds[tab];
            if (!build.martialArts) build.martialArts = [];
            const arr = build.martialArts;
            const existing = arr.indexOf(id);
            if (existing !== -1 && existing !== slotIndex) arr[existing] = null;
            arr[slotIndex] = id;
            build.martialArts = arr.filter(Boolean);
            renderMartialSlots(blockId);
            const footer = document.querySelector('#modal .modal-footer');
            if (footer) footer.style.display = '';
            closeModal();
        }

        // Оборачиваем closeModal, чтобы при закрытии обычной модалки футер возвращался
        const _origCloseModal = closeModal;
        closeModal = function() {
            const footer = document.querySelector('#modal .modal-footer');
            if (footer) footer.style.display = '';
            _origCloseModal();
        };
    </script>
</body>
</html>
