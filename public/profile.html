<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой игровой профиль</title>
    <link rel="stylesheet" href="/css/style.css?v=25">
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.7); }
        }
        .character-block { 
            background: rgba(15, 18, 24, 0.9); 
            border: 1px solid var(--border); 
            padding: 25px; 
            border-radius: 16px; 
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }
        .character-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .char-title { 
            font-family: 'Cinzel', serif; 
            color: var(--gold); 
            margin-bottom: 20px; 
            font-size: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .remove-char-btn { 
            background: rgba(231, 76, 60, 0.2); 
            border: 1px solid var(--danger);
            color: var(--danger); 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px;
            transition: 0.2s;
        }
        .remove-char-btn:hover { background: var(--danger); color: #fff; }
        
        .switch-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.4); 
            padding: 15px 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border); 
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--jade); box-shadow: 0 0 15px var(--jade-glow); }
        input:checked + .slider:before { transform: translateX(24px); }

        .build-tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 10px;
        }
        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            background: transparent; 
            border: none; 
            color: var(--text-muted); 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }
        .tab-btn.active.pve { background: rgba(46, 204, 113, 0.2); color: var(--jade); box-shadow: inset 0 0 15px rgba(46, 204, 113, 0.2); }
        .tab-btn.active.pvp { background: rgba(231, 76, 60, 0.2); color: var(--danger); box-shadow: inset 0 0 15px rgba(231, 76, 60, 0.2); }

        .build-content { display: none; animation: fadeInUp 0.4s ease-out; }
        .build-content.active { display: block; }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .skill-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 5px;
            background: rgba(0,0,0,0.5);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .skill-card:hover { transform: translateY(-3px); border-color: rgba(212, 175, 55, 0.3); }
        .skill-card.selected { 
            border-color: var(--gold); 
            background: rgba(212, 175, 55, 0.1);
            animation: glowPulse 2s infinite;
        }
        .skill-card img { 
            width: 50px; 
            height: 50px; 
            border-radius: 6px; 
            object-fit: cover;
            background: #0a0b10;
        }
        .skill-card span { 
            font-size: 10px; 
            margin-top: 6px; 
            color: var(--text-muted); 
            line-height: 1.2;
        }
        .skill-card.selected span { color: var(--gold); font-weight: bold; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
            animation: fadeInUp 0.3s ease-out;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #12161c; width: 95%; max-width: 900px; height: 85vh;
            border-radius: 16px; border: 1px solid var(--gold);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            display: flex; flex-direction: column;
            animation: fadeInUp 0.4s ease-out;
        }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { color: var(--gold); font-family: 'Cinzel', serif; margin: 0; }
        .modal-close { background: none; border: none; color: var(--danger); font-size: 28px; cursor: pointer; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>
    <a href="#" id="top-banner-link" class="top-banner"></a>
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard"><div class="icon icon-home"></div> К списку серверов</a>
            <hr style="border-color: var(--border); margin: 15px 0;">
            <a href="/dashboard"><div class="icon icon-arrow-left"></div> Назад в панель</a>
        </div>

        <div class="content" style="max-width: 900px;">
            <div class="header" style="text-align: center; border: none;">
                <h1 style="font-size: 36px; color: var(--gold);">Мои персонажи</h1>
                <p style="color: var(--text-muted); margin: 10px 0 30px;">Эта информация будет видна другим игрокам</p>
            </div>

            <div class="switch-container">
                <div>
                    <h4 style="margin: 0; color: var(--text-main);">Сделать профиль глобальным?</h4>
                    <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted);">Будет виден на всех серверах бота.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="is-global">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="characters-container"></div>
            
            <button class="btn btn-success" onclick="addCharacter()" id="btn-add" style="width: 100%; margin-bottom: 15px;">+ Добавить персонажа</button>
            <button class="btn" onclick="saveProfile()" id="btn-save" style="width: 100%; margin-bottom: 15px; background: linear-gradient(135deg, #d4af37, #aa8624); color: #000;">💾 Сохранить профиль</button>
            <button class="btn btn-danger" onclick="deleteMyProfile()" id="btn-delete-profile" style="width: 100%; display: none;">🗑️ Удалить профиль</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Выбор навыков</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeModal()">Отмена</button>
                <button class="btn" onclick="applyModal()" style="background: var(--gold); color: #000;">Применить</button>
            </div>
        </div>
    </div>

    <script src="/js/gamedata.js"></script>
    <script>
        if (typeof window.GAME_DATA === 'undefined') {
            alert('Ошибка: файл gamedata.js не загрузился. Проверьте, что он лежит в public/js/');
        }

        const urlParams = new URLSearchParams(window.location.search);
        let guildId = urlParams.get('guild') || window.location.pathname.split('/').pop();
        const targetUserId = urlParams.get('user'); 
        
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        let charCount = 0;
        let modalContext = { blockId: null, type: 'mystic', activeTab: 'PvE', temp: [] };
        let charDataCache = {};

        function createBlock(data = {}, index = 0) {
            charCount++;
            const blockId = `char-${charCount}`;
            charDataCache[blockId] = data;
            
            const block = document.createElement('div');
            block.className = 'character-block';
            block.id = blockId;
            
            block.innerHTML = `
                <div class="char-title">
                    <span>⚔️ Персонаж ${index + 1}</span>
                    ${index > 0 ? `<button class="remove-char-btn" onclick="this.closest('.character-block').remove()">Удалить</button>` : ''}
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                    <div class="form-group"><label>Игровой ник</label><input type="text" class="c-nick" value="${data.gameNickname || ''}" placeholder="Ник"></div>
                    <div class="form-group"><label>Гильдия</label><input type="text" class="c-guild" value="${data.guildName || ''}" placeholder="Гильдия"></div>
                </div>

                <div class="form-group"><label>О себе</label><textarea class="c-bio" style="height: 60px;">${data.bio || ''}</textarea></div>

                <div class="build-tabs">
                    <button class="tab-btn active pve" onclick="switchTab('${blockId}', 'PvE')">🌿 PvE Билд</button>
                    <button class="tab-btn pvp" onclick="switchTab('${blockId}', 'PvP')">⚔️ PvP Билд</button>
                </div>

                <div class="build-content active" id="pve-content-${blockId}">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="color: var(--jade); font-weight: bold;">PvE Мистические Навыки</span>
                        <button class="btn btn-small" onclick="openModal('${blockId}', 'mystic', 'PvE')">Изменить</button>
                    </div>
                    <div class="skills-grid" id="pve-skills-${blockId}"></div>
                </div>
                
                <div class="build-content" id="pvp-content-${blockId}">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="color: var(--danger); font-weight: bold;">PvP Мистические Навыки</span>
                        <button class="btn btn-small" onclick="openModal('${blockId}', 'mystic', 'PvP')">Изменить</button>
                    </div>
                    <div class="skills-grid" id="pvp-skills-${blockId}"></div>
                </div>
            `;
            document.getElementById('characters-container').appendChild(block);
            renderSelected(blockId);
        }

        function switchTab(blockId, type) {
            const block = document.getElementById(blockId);
            block.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            block.querySelectorAll('.build-content').forEach(c => c.classList.remove('active'));
            block.querySelector(type === 'PvE' ? '.tab-btn.pve' : '.tab-btn.pvp').classList.add('active');
            block.querySelector(`#${type.toLowerCase()}-content-${blockId}`).classList.add('active');
        }

        function renderSelected(blockId) {
            const data = charDataCache[blockId] || {};
            const pveSkills = data.builds?.PvE?.mysticSkills || [];
            const pvpSkills = data.builds?.PvP?.mysticSkills || [];
            
            const renderGrid = (skillsArray) => {
                if (!window.GAME_DATA) return '';
                return window.GAME_DATA.mysticSkills.map(s => {
                    if (!skillsArray.includes(s.id)) return '';
                    return `<div class="skill-card selected"><img src="${s.img}" onerror="this.src='https://via.placeholder.com/50x50/0a0b10/2ecc71?text=?'"><span>${s.nameRU}</span></div>`;
                }).join('');
            };
            
            document.getElementById(`pve-skills-${blockId}`).innerHTML = renderGrid(pveSkills) || '<span style="color: var(--text-muted);">Не выбрано</span>';
            document.getElementById(`pvp-skills-${blockId}`).innerHTML = renderGrid(pvpSkills) || '<span style="color: var(--text-muted);">Не выбрано</span>';
        }

        function openModal(blockId, type, activeTab) {
            modalContext = { blockId, type, activeTab, temp: [...((charDataCache[blockId]?.builds?.[activeTab]?.mysticSkills) || [])] };
            
            document.getElementById('modal-title').innerText = `Выбор Навыков (${activeTab})`;
            document.getElementById('modal').classList.add('active');
            
            renderModalGrid();
        }

        function renderModalGrid() {
            const body = document.getElementById('modal-body');
            if (!window.GAME_DATA) {
                body.innerHTML = '<p style="color: red;">Ошибка загрузки данных</p>';
                return;
            }
            
            body.innerHTML = window.GAME_DATA.mysticSkills.map(s => {
                const isSelected = modalContext.temp.includes(s.id);
                return `
                    <div class="skill-card ${isSelected ? 'selected' : ''}" data-id="${s.id}" onclick="toggleSkill(this, '${s.id}')">
                        <img src="${s.img}" onerror="this.src='https://via.placeholder.com/50x50/0a0b10/2ecc71?text=?'">
                        <span>${s.nameRU}</span>
                    </div>
                `;
            }).join('');
        }

        function toggleSkill(el, id) {
            const idx = modalContext.temp.indexOf(id);
            if (idx > -1) {
                modalContext.temp.splice(idx, 1);
                el.classList.remove('selected');
            } else {
                modalContext.temp.push(id);
                el.classList.add('selected');
            }
        }

        function applyModal() {
            const { blockId, activeTab, temp } = modalContext;
            if (!charDataCache[blockId].builds) charDataCache[blockId].builds = { PvE: { innerWays: [], mysticSkills: [] }, PvP: { innerWays: [], mysticSkills: [] } };
            if (!charDataCache[blockId].builds[activeTab]) charDataCache[blockId].builds[activeTab] = { innerWays: [], mysticSkills: [] };
            
            charDataCache[blockId].builds[activeTab].mysticSkills = temp;
            renderSelected(blockId);
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function addCharacter() {
            if (charCount >= 3) return alert('Максимум 3 персонажа.');
            createBlock({}, charCount);
        }

        // Инициализация
        createBlock({}, 0);

        fetch(targetUserId ? `/api/profile/${guildId}?user=${targetUserId}` : `/api/profile/${guildId}`)
            .then(res => res.json())
            .then(data => {
                if (data.characters && data.characters.length > 0) {
                    document.getElementById('characters-container').innerHTML = '';
                    charCount = 0;
                    charDataCache = {};
                    if (!targetUserId) document.getElementById('btn-delete-profile').style.display = 'block';
                    if (data.isGlobal) document.getElementById('is-global').checked = true;
                    data.characters.forEach((char, idx) => createBlock(char, idx));
                }
            })
            .catch(err => console.log('Нет данных, пустая форма'));

        function saveProfile() {
            const btn = document.getElementById('btn-save');
            btn.innerText = '⏳ Сохранение...';
            btn.disabled = true;

            const characters = Object.keys(charDataCache).map(blockId => {
                const block = document.getElementById(blockId);
                const data = charDataCache[blockId];
                return {
                    gameNickname: block.querySelector('.c-nick').value,
                    guildName: block.querySelector('.c-guild').value,
                    bio: block.querySelector('.c-bio').value,
                    builds: data.builds || { PvE: { innerWays: [], mysticSkills: [] }, PvP: { innerWays: [], mysticSkills: [] } }
                };
            });

            fetch(`/api/profile/${guildId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ characters, isGlobal: document.getElementById('is-global').checked, targetUser: targetUserId })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    alert('✅ Профиль сохранен в базу!');
                    window.location.reload();
                } else {
                    alert('❌ Ошибка: ' + data.error);
                    btn.innerText = '💾 Сохранить профиль';
                    btn.disabled = false;
                }
            }).catch(() => {
                alert('❌ Ошибка сети');
                btn.innerText = '💾 Сохранить профиль';
                btn.disabled = false;
            });
        }

        function deleteMyProfile() {
            if (!confirm('Удалить профиль?')) return;
            fetch(`/api/profile/${guildId}`, { method: 'DELETE' }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
