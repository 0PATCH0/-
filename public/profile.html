<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой игровой профиль</title>
    <link rel="stylesheet" href="/css/style.css?v=25">
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.2); }
            50% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }
        }
        .character-block { 
            background: rgba(15, 18, 24, 0.95); 
            border: 1px solid var(--border); 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }
        .character-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .char-title { 
            font-family: 'Cinzel', serif; 
            color: var(--gold); 
            margin-bottom: 20px; 
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .remove-char-btn { 
            background: rgba(231, 76, 60, 0.2); 
            border: 1px solid var(--danger);
            color: var(--danger); 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px;
            transition: 0.2s;
        }
        .remove-char-btn:hover { background: var(--danger); color: #fff; }
        
        .switch-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.4); 
            padding: 15px 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border); 
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--jade); box-shadow: 0 0 15px var(--jade-glow); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Стили для вкладок билдов */
        .build-tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            background: rgba(0,0,0,0.5);
            padding: 6px;
            border-radius: 12px;
        }
        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            background: transparent; 
            border: none; 
            color: var(--text-muted); 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }
        .tab-btn.active.pve { background: rgba(46, 204, 113, 0.15); color: var(--jade); box-shadow: inset 0 0 20px rgba(46, 204, 113, 0.15); }
        .tab-btn.active.pvp { background: rgba(231, 76, 60, 0.15); color: var(--danger); box-shadow: inset 0 0 20px rgba(231, 76, 60, 0.15); }

        .build-content { display: none; animation: fadeInUp 0.3s ease-out; }
        .build-content.active { display: block; }

        /* Панель экипировки */
        .equipment-panel {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .panel-title {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title.mystic { color: #e2b95c; }
        .panel-title.inner { color: #6db38a; }
        .slot-counter {
            font-size: 12px;
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 10px;
            color: var(--text-muted);
        }
        .slot-counter.full { background: rgba(212, 175, 55, 0.2); color: var(--gold); }

        /* Сетка слотов */
        .slots-grid {
            display: grid;
            gap: 10px;
        }
        .slots-grid.mystic-grid {
            grid-template-columns: repeat(4, 1fr);
        }
        .slots-grid.inner-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        .equip-slot {
            background: rgba(0,0,0,0.6);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .equip-slot:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }
        .equip-slot.filled {
            border-style: solid;
            border-color: rgba(212, 175, 55, 0.4);
            background: #0d0f14;
        }
        .equip-slot.filled:hover {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .equip-slot img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 4px;
        }
        .equip-slot .empty-icon {
            font-size: 24px;
            color: rgba(255,255,255,0.1);
        }
        .equip-slot .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            font-size: 9px;
            padding: 2px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ccc;
        }
        .equip-slot .remove-icon {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            background: rgba(231, 76, 60, 0.8);
            color: white;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.2s;
        }
        .equip-slot:hover .remove-icon {
            opacity: 1;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
            animation: fadeInUp 0.2s ease-out;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #12161c; width: 95%; max-width: 800px; height: 85vh;
            border-radius: 16px; border: 1px solid var(--gold);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
            display: flex; flex-direction: column;
            animation: fadeInUp 0.3s ease-out;
        }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { color: var(--gold); font-family: 'Cinzel', serif; margin: 0; font-size: 18px; }
        .modal-close { background: none; border: none; color: var(--danger); font-size: 28px; cursor: pointer; line-height: 1; }
        
        .modal-filters {
            padding: 10px 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.1); }
        .filter-btn.active {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.5);
            color: var(--gold);
        }

        .modal-body { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); 
            gap: 10px; 
            align-content: start;
        }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

        .skill-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 4px;
            background: rgba(0,0,0,0.4);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            position: relative;
        }
        .skill-card:hover { transform: translateY(-2px); border-color: rgba(212, 175, 55, 0.3); }
        .skill-card.selected { 
            border-color: var(--gold); 
            background: rgba(212, 175, 55, 0.1);
            animation: glowPulse 2s infinite;
        }
        .skill-card img { 
            width: 48px; 
            height: 48px; 
            border-radius: 6px; 
            object-fit: cover;
            background: #0a0b10;
        }
        .skill-card span { 
            font-size: 10px; 
            margin-top: 6px; 
            color: var(--text-muted); 
            line-height: 1.2;
        }
        .skill-card.selected span { color: var(--gold); font-weight: bold; }
        
        /* Адаптивность для маленьких экранов */
        @media (max-width: 600px) {
            .slots-grid.mystic-grid, .slots-grid.inner-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .equip-slot .slot-name {
                font-size: 8px;
            }
            .character-block {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <a href="#" id="top-banner-link" class="top-banner"></a>
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard"><div class="icon icon-home"></div> К списку серверов</a>
            <hr style="border-color: var(--border); margin: 15px 0;">
            <a href="/dashboard"><div class="icon icon-arrow-left"></div> Назад в панель</a>
        </div>

        <div class="content" style="max-width: 900px;">
            <div class="header" style="text-align: center; border: none;">
                <h1 style="font-size: 36px; color: var(--gold);">Мои персонажи</h1>
                <p style="color: var(--text-muted); margin: 10px 0 30px;">Эта информация будет видна другим игрокам</p>
            </div>

            <div class="switch-container">
                <div>
                    <h4 style="margin: 0; color: var(--text-main);">Сделать профиль глобальным?</h4>
                    <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted);">Будет виден на всех серверах бота.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="is-global">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="characters-container"></div>
            
            <button class="btn btn-success" onclick="addCharacter()" id="btn-add" style="width: 100%; margin-bottom: 15px;">+ Добавить персонажа</button>
            <button class="btn" onclick="saveProfile()" id="btn-save" style="width: 100%; margin-bottom: 15px; background: linear-gradient(135deg, #d4af37, #aa8624); color: #000;">💾 Сохранить профиль</button>
            <button class="btn btn-danger" onclick="deleteMyProfile()" id="btn-delete-profile" style="width: 100%; display: none;">🗑️ Удалить профиль</button>
        </div>
    </div>

    <!-- Модальное окно выбора -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Выбор навыков</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-filters" id="modal-filters">
                <!-- Фильтры будут добавлены динамически -->
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeModal()">Отмена</button>
                <button class="btn" onclick="applyModal()" style="background: var(--gold); color: #000;">Применить</button>
            </div>
        </div>
    </div>

    <script src="/js/gamedata.js"></script>
    <script>
        // Безопасная проверка после полной загрузки страницы
        window.addEventListener('load', () => {
            if (typeof window.GAME_DATA === 'undefined') {
                console.warn('ВНИМАНИЕ: gamedata.js не загружен или содержит синтаксическую ошибку!');
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        let guildId = urlParams.get('guild') || window.location.pathname.split('/').pop();
        const targetUserId = urlParams.get('user'); 
        
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        let charCount = 0;
        // Контекст модального окна: blockId, type (mystic/inner), activeTab (PvE/PvP), temp (массив ID)
        let modalContext = { blockId: null, type: 'mystic', activeTab: 'PvE', temp: [], filter: 'all' };
        let charDataCache = {};

        // Лимиты по игре
        const LIMITS = { mystic: 8, inner: 4 };

        function createBlock(data = {}, index = 0) {
            charCount++;
            const blockId = `char-${charCount}`;
            // Гарантируем структуру данных
            charDataCache[blockId] = {
                ...data,
                builds: data.builds || {
                    PvE: { mysticSkills: [], innerWays: [] },
                    PvP: { mysticSkills: [], innerWays: [] }
                }
            };
            // Если билды есть, но не хватает полей, дополняем
            ['PvE', 'PvP'].forEach(tab => {
                if (!charDataCache[blockId].builds[tab]) charDataCache[blockId].builds[tab] = { mysticSkills: [], innerWays: [] };
                if (!charDataCache[blockId].builds[tab].mysticSkills) charDataCache[blockId].builds[tab].mysticSkills = [];
                if (!charDataCache[blockId].builds[tab].innerWays) charDataCache[blockId].builds[tab].innerWays = [];
            });

            const block = document.createElement('div');
            block.className = 'character-block';
            block.id = blockId;
            
            block.innerHTML = `
                <div class="char-title">
                    <span>⚔️ Персонаж ${index + 1}</span>
                    ${index > 0 ? `<button class="remove-char-btn" onclick="this.closest('.character-block').remove()">Удалить</button>` : ''}
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                    <div class="form-group"><label>Игровой ник</label><input type="text" class="c-nick" value="${data.gameNickname || ''}" placeholder="Ник"></div>
                    <div class="form-group"><label>Гильдия</label><input type="text" class="c-guild" value="${data.guildName || ''}" placeholder="Гильдия"></div>
                </div>

                <div class="form-group"><label>О себе</label><textarea class="c-bio" style="height: 60px;">${data.bio || ''}</textarea></div>

                <div class="build-tabs">
                    <button class="tab-btn active pve" onclick="switchTab('${blockId}', 'PvE')">🌿 PvE Билд</button>
                    <button class="tab-btn pvp" onclick="switchTab('${blockId}', 'PvP')">⚔️ PvP Билд</button>
                </div>

                <!-- Содержимое для PvE -->
                <div class="build-content active" id="pve-content-${blockId}">
                    ${renderBuildUI(blockId, 'PvE')}
                </div>
                
                <!-- Содержимое для PvP -->
                <div class="build-content" id="pvp-content-${blockId}">
                    ${renderBuildUI(blockId, 'PvP')}
                </div>
            `;
            document.getElementById('characters-container').appendChild(block);
            renderAllSlots(blockId);
        }

        function renderBuildUI(blockId, activeTab) {
            return `
                <!-- Панель Мистических навыков -->
                <div class="equipment-panel">
                    <div class="panel-header">
                        <div class="panel-title mystic">✨ Мистические навыки</div>
                        <div class="slot-counter" id="mystic-counter-${activeTab}-${blockId}">0 / ${LIMITS.mystic}</div>
                    </div>
                    <div class="slots-grid mystic-grid" id="mystic-slots-${activeTab}-${blockId}">
                        ${Array.from({length: LIMITS.mystic}).map((_, i) => `
                            <div class="equip-slot" id="mystic-slot-${activeTab}-${blockId}-${i}" onclick="openModal('${blockId}', 'mystic', '${activeTab}', ${i})">
                                <span class="empty-icon">+</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Панель Внутренних путей -->
                <div class="equipment-panel">
                    <div class="panel-header">
                        <div class="panel-title inner">🌀 Внутренние пути</div>
                        <div class="slot-counter" id="inner-counter-${activeTab}-${blockId}">0 / ${LIMITS.inner}</div>
                    </div>
                    <div class="slots-grid inner-grid" id="inner-slots-${activeTab}-${blockId}">
                        ${Array.from({length: LIMITS.inner}).map((_, i) => `
                            <div class="equip-slot" id="inner-slot-${activeTab}-${blockId}-${i}" onclick="openModal('${blockId}', 'inner', '${activeTab}', ${i})">
                                <span class="empty-icon">+</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function switchTab(blockId, type) {
            const block = document.getElementBy
