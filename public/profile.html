<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой игровой профиль</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-container { max-width: 600px; margin: 50px auto; padding: 20px; }
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-header h1 { font-family: 'Cinzel', serif; color: var(--accent); font-size: 36px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .profile-header p { color: var(--text-muted); }
        .back-btn { display: block; text-align: center; margin-bottom: 20px; color: var(--text-muted); text-decoration: none; }
        .back-btn:hover { color: var(--accent); }
    </style>
</head>
<body class="bg-forest">
    <div class="profile-container">
        <a href="/dashboard" class="back-btn">← Вернуться в панель</a>
        
        <div class="profile-header">
            <h1>Мой профиль</h1>
            <p>Эта информация будет видна другим игрокам</p>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label>Игровой ник (в Where Winds Meet)</label>
                <input type="text" id="game-nickname" placeholder="Например: Koten-Ren">
            </div>
            <div class="form-group">
                <label>Название гильдии в игре</label>
                <input type="text" id="guild-name" placeholder="Например: СНОВА">
            </div>
            <div class="form-group">
                <label>Ваш класс / роль</label>
                <select id="class-role">
                    <option value="">Не выбрано</option>
                    <option value="Танк">Танк</option>
                    <option value="ДД (Урон)">ДД (Урон)</option>
                    <option value="Хил (Поддержка)">Хил (Поддержка)</option>
                    <option value="Универсал">Универсал</option>
                </select>
            </div>
            <div class="form-group">
                <label>Основное оружие</label>
                <input type="text" id="weapon" placeholder="Например: Меч и Веер">
            </div>
            <div class="form-group">
                <label>О себе (био)</label>
                <textarea id="bio" placeholder="Люблю PvP, играю по вечерам..." style="height: 80px;"></textarea>
            </div>
            
            <button class="btn" onclick="saveProfile()" style="width: 100%; margin-top: 10px;">💾 Сохранить профиль</button>
        </div>
    </div>

    <script>
        fetch('/api/profile').then(res => res.json()).then(data => {
            if (data.gameNickname) document.getElementById('game-nickname').value = data.gameNickname;
            if (data.guildName) document.getElementById('guild-name').value = data.guildName;
            if (data.classRole) document.getElementById('class-role').value = data.classRole;
            if (data.weapon) document.getElementById('weapon').value = data.weapon;
            if (data.bio) document.getElementById('bio').value = data.bio;
        });

        function saveProfile() {
            const payload = {
                gameNickname: document.getElementById('game-nickname').value,
                guildName: document.getElementById('guild-name').value,
                classRole: document.getElementById('class-role').value,
                weapon: document.getElementById('weapon').value,
                bio: document.getElementById('bio').value
            };

            fetch('/api/profile', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                if (data.success) alert('✅ Профиль сохранен!');
                else alert('❌ Ошибка: ' + data.error);
            });
        }
    </script>
</body>
</html>
