<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой игровой профиль</title>
    <link rel="stylesheet" href="/css/style.css?v=15">
    <script src="/js/ui.js"></script>
    <script src="/js/gamedata.js"></script>
    <style>
        .character-block { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; position: relative; }
        .char-title { font-family: 'Cinzel', serif; color: var(--jade); margin-bottom: 15px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
        .remove-char-btn { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; display: none; font-size: 12px; }
        
        .switch-container { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--jade); }
        input:checked + .slider:before { transform: translateX(24px); }

        .build-tabs-container { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 5px; display: flex; gap: 5px; margin-bottom: 15px; }
        .build-tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .build-tab-btn.active.pve { background: rgba(46, 204, 113, 0.2); color: var(--jade); box-shadow: 0 0 10px rgba(46, 204, 113, 0.3); }
        .build-tab-btn.active.pvp { background: rgba(231, 76, 60, 0.2); color: var(--danger); box-shadow: 0 0 10px rgba(231, 76, 60, 0.3); }

        .build-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; align-items: center; transition: 0.3s; font-weight: bold; font-size: 15px;}
        .build-btn:hover { background: var(--gold); color: #000; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--bg-sidebar); width: 95%; max-width: 900px; height: 85vh; border-radius: 12px; border: 1px solid var(--gold); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-family: 'Cinzel', serif; color: var(--gold); margin: 0; }
        .close-btn { background: transparent; border: none; color: var(--danger); font-size: 24px; cursor: pointer; }
        
        .modal-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .modal-tab { flex: 1; padding: 15px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .modal-tab.active { color: var(--jade); border-bottom-color: var(--jade); }

        .modal-filters { padding: 10px 20px; display: flex; gap: 10px; flex-wrap: wrap; background: rgba(0,0,0,0.2); }
        .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .filter-btn.active { background: var(--jade); border-color: var(--jade); color: #000; }

        .modal-grid { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 15px; align-content: start; }
        .skill-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; text-align: center; transition: 0.2s; }
        .skill-icon img { width: 64px; height: 64px; border-radius: 8px; border: 2px solid #333; transition: 0.2s; object-fit: cover; background: #000; }
        .skill-icon span { font-size: 11px; margin-top: 5px; color: var(--text-muted); line-height: 1.2; }
        .skill-icon.selected img { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }
        .skill-icon.selected span { color: var(--gold); font-weight: bold; }
        .skill-icon:hover img { transform: scale(1.05); }
        .modal-footer { padding: 15px; border-top: 1px solid var(--border); text-align: right; }
    </style>
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"></a>
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard"><div class="icon icon-home"></div> К списку серверов</a>
            <hr style="border-color: var(--border); margin: 15px 0;">
            <a href="/dashboard"><div class="icon icon-arrow-left"></div> Назад в панель</a>
        </div>

        <div class="content" style="max-width: 900px;">
            <div class="header" style="text-align: center; border: none;">
                <h1 style="font-size: 36px;" id="page-title">Мои персонажи</h1>
                <p style="color: var(--text-muted); margin-top: 10px;">Эта информация будет видна другим игрокам</p>
            </div>

            <div class="switch-container">
                <div>
                    <h4 style="margin: 0; color: var(--text-main);">Сделать профиль глобальным?</h4>
                    <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted);">Если включено, профиль будет виден на всех серверах бота.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="is-global">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="characters-container"></div>
            
            <button class="btn btn-success" onclick="addCharacter()" id="btn-add" style="width: 100%; margin-bottom: 15px;"><div class="icon icon-home" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 fill=%22%23000%22 viewBox=%220 0 24 24%22><path d=%22M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z%22/></svg>');"></div> Добавить персонажа</button>
            <button class="btn" onclick="saveProfile()" style="width: 100%; margin-bottom: 15px;"><div class="icon icon-floppy-disk"></div> Сохранить профиль</button>
            <button class="btn btn-danger" onclick="deleteMyProfile()" id="btn-delete-profile" style="width: 100%; display: none;"><div class="icon icon-trash"></div> Удалить профиль</button>
        </div>
    </div>

    <div class="modal-overlay" id="skillModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Настройка Билда</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" onclick="switchModalTab('mystic')">Мистические Навыки</button>
                <button class="modal-tab" onclick="switchModalTab('inner')">Внутренние Пути</button>
            </div>
            <div class="modal-filters" id="modalFilters"></div>
            <div class="modal-grid" id="modalGrid"></div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="applySelection()">Применить</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let guildId = urlParams.get('guild');
        if (!guildId) {
            const pathParts = window.location.pathname.split('/');
            guildId = pathParts[pathParts.length - 1];
        }
        const targetUserId = urlParams.get('user'); 
        
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const ARTS_LIST = ['Nameless Sword (Безымянный меч)', 'Strategic Sword (Стратегический меч)', 'Nameless Spear (Безымянное копье)', 'Heavenquaker Spear (Копье Небесного Грома)', 'Stormbreaker Spear (Копье Разрушителя Шторма)', 'Panacea Fan (Веер Панацея)', 'Inkwell Fan (Веер Чернильница)', 'Soulshade Umbrella (Зонт Тени Души)', 'Vernal Umbrella (Весенний зонт)', 'Infernal Twinblades (Адские парные клинки)', 'Thundercry Blade (Клинок Громового Крика)', 'Mortal Rope Dart (Дротик на веревке)'];
        const ROLES_LIST = ['Танк', 'ДД (Урон)', 'Хил (Поддержка)'];

        let charCount = 0;
        let currentBlockId = null;
        let activeBuildType = 'PvE';
        let currentTab = 'mystic';
        let currentFilter = 'All';
        let tempBuildData = {};

        function createCharacterBlock(data = {}, index = 0) {
            charCount++;
            const block = document.createElement('div');
            block.className = 'character-block';
            block.id = `char-block-${charCount}`;
            
            let builds = data.builds;
            if (!builds || !builds.PvE || !builds.PvP) {
                builds = { PvE: { innerWays: [], mysticSkills: [] }, PvP: { innerWays: [], mysticSkills: [] } };
            }
            
            const buildsJson = JSON.stringify(builds);
            const rolesHtml = ROLES_LIST.map(r => `
                <label class="checkbox-item">
                    <input type="checkbox" class="role-check" value="${r}" ${(data.roles || []).includes(r) ? 'checked' : ''}>
                    <span class="custom-checkbox"></span>
                    <span style="font-size: 13px;">${r}</span>
                </label>
            `).join('');

            const artsHtml = ARTS_LIST.map(art => `
                <label class="checkbox-item">
                    <input type="checkbox" class="art-check" value="${art}" ${(data.martialArts || []).includes(art) ? 'checked' : ''}>
                    <span class="custom-checkbox"></span>
                    <span style="font-size: 13px;">${art}</span>
                </label>
            `).join('');

            block.innerHTML = `
                <div class="char-title">
                    <span>Персонаж ${index + 1}</span>
                    <button class="remove-char-btn" onclick="removeCharacter('${block.id}')">Удалить</button>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group"><label>Игровой ник</label><input type="text" class="c-nick" value="${data.gameNickname || ''}" placeholder="Например: Koten-Ren"></div>
                    <div class="form-group"><label>Гильдия</label><input type="text" class="c-guild" value="${data.guildName || ''}" placeholder="Например: СНОВА"></div>
                </div>

                <div class="form-group">
                    <label>Боевая роль (Можно выбрать несколько)</label>
                    <div class="checkbox-grid">${rolesHtml}</div>
                </div>

                <div class="form-group">
                    <label>Боевые искусства (Можно выбрать несколько)</label>
                    <div class="checkbox-grid">${artsHtml}</div>
                </div>

                <div class="form-group">
                    <label>Билды (Навыки и Пути)</label>
                    <div class="build-tabs-container">
                        <button type="button" class="build-tab-btn pve active" onclick="switchBuildTab(this, 'PvE')">🌿 PvE Билд</button>
                        <button type="button" class="build-tab-btn pvp" onclick="switchBuildTab(this, 'PvP')">⚔️ PvP Билд</button>
                    </div>
                    <input type="hidden" class="c-builds-data" value='${buildsJson}'>
                    <input type="hidden" class="c-current-build-type" value="PvE">
                    
                    <button class="build-btn" onclick="openModal('${block.id}')">
                        <div class="icon icon-shield"></div> Настроить Билд
                    </button>
                </div>

                <div class="form-group"><label>Ссылка на внешний билд (если есть)</label><input type="text" class="c-build" value="${data.buildUrl || ''}" placeholder="https://mobalytics.gg/..."></div>
                <div class="form-group"><label>О себе</label><textarea class="c-bio" style="height: 60px;">${data.bio || ''}</textarea></div>
            `;
            document.getElementById('characters-container').appendChild(block);
            updateRemoveButtons();
        }

        function switchBuildTab(btn, type) {
            const block = btn.closest('.character-block');
            block.querySelectorAll('.build-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            block.querySelector('.c-current-build-type').value = type;
        }

        function addCharacter() {
            if (charCount >= 3) return showToast('Максимум 3 персонажа.', 'error');
            createCharacterBlock({}, charCount);
        }

        function removeCharacter(id) {
            document.getElementById(id).remove();
            charCount--;
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const blocks = document.querySelectorAll('.character-block');
            blocks.forEach((block, index) => {
                block.querySelector('.char-title span').innerText = `Персонаж ${index + 1}`;
                const removeBtn = block.querySelector('.remove-char-btn');
                removeBtn.style.display = blocks.length > 1 ? 'block' : 'none';
            });
            document.getElementById('btn-add').style.display = blocks.length >= 3 ? 'none' : 'flex';
        }

        function openModal(blockId) {
            currentBlockId = blockId;
            const block = document.getElementById(blockId);
            activeBuildType = block.querySelector('.c-current-build-type').value;
            
            let allBuilds = JSON.parse(block.querySelector('.c-builds-data').value);
            if (!allBuilds) allBuilds = { PvE: { innerWays: [], mysticSkills: [] }, PvP: { innerWays: [], mysticSkills: [] } };
            
            tempBuildData = { 
                innerWays: allBuilds[activeBuildType]?.innerWays || [], 
                mysticSkills: allBuilds[activeBuildType]?.mysticSkills || [] 
            };
            
            document.getElementById('modalTitle').innerText = `Настройка билда: ${activeBuildType}`;
            document.getElementById('modalTitle').style.color = activeBuildType === 'PvP' ? '#e74c3c' : '#2ecc71';
            document.getElementById('skillModal').style.display = 'flex';
            switchModalTab('mystic');
        }

        function closeModal() {
            document.getElementById('skillModal').style.display = 'none';
            currentBlockId = null;
        }

        function switchModalTab(tab) {
            currentTab = tab;
            currentFilter = 'All';
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.modal-tab')[tab === 'mystic' ? 0 : 1].classList.add('active');
            renderFilters();
            renderGrid();
        }

        function renderFilters() {
            const filterContainer = document.getElementById('modalFilters');
            let categories = currentTab === 'mystic' ? ['All', 'Offensive', 'General', 'Movement'] : ['All', 'Bamboocut', 'Bellstrike', 'Stonesplit', 'Silkbind', 'General'];
            filterContainer.innerHTML = categories.map(cat => 
                `<button class="filter-btn ${currentFilter === cat ? 'active' : ''}" onclick="setFilter('${cat}')">${cat}</button>`
            ).join('');
        }

        function setFilter(cat) {
            currentFilter = cat;
            renderFilters();
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('modalGrid');
            
            // Защита, если GAME_DATA не загрузился
            if (typeof GAME_DATA === 'undefined') {
                grid.innerHTML = '<p style="color:red;">Ошибка: Файл gamedata.js не загружен!</p>';
                return;
            }

            const dataList = currentTab === 'mystic' ? GAME_DATA.mysticSkills : GAME_DATA.innerWays;
            const selectedList = currentTab === 'mystic' ? tempBuildData.mysticSkills : tempBuildData.innerWays;
            const filtered = currentFilter === 'All' ? dataList : dataList.filter(item => item.category === currentFilter);
            
            grid.innerHTML = filtered.map(item => {
                const isSelected = selectedList.includes(item.id);
                return `
                    <div class="skill-icon ${isSelected ? 'selected' : ''}" onclick="toggleSkill('${item.id}')">
                        <img src="${item.img}" alt="${item.nameEN}" onerror="this.src='https://via.placeholder.com/100x100/232428/2ecc71?text=???'">
                        <span>${item.nameRU}</span>
                    </div>
                `;
            }).join('');
        }

        function toggleSkill(id) {
            const selectedList = currentTab === 'mystic' ? tempBuildData.mysticSkills : tempBuildData.innerWays;
            const index = selectedList.indexOf(id);
            if (index > -1) selectedList.splice(index, 1);
            else selectedList.push(id);
            renderGrid();
        }

        function applySelection() {
            const block = document.getElementById(currentBlockId);
            let allBuilds = JSON.parse(block.querySelector('.c-builds-data').value);
            if (!allBuilds) allBuilds = { PvE: { innerWays: [], mysticSkills: [] }, PvP: { innerWays: [], mysticSkills: [] } };
            
            allBuilds[activeBuildType] = { innerWays: tempBuildData.innerWays, mysticSkills: tempBuildData.mysticSkills };
            block.querySelector('.c-builds-data').value = JSON.stringify(allBuilds);
            
            closeModal();
            showToast(`Билд ${activeBuildType} обновлен!`, 'success');
        }

        const fetchUrl = targetUserId ? `/api/profile/${guildId}?user=${targetUserId}` : `/api/profile/${guildId}`;

        fetch(fetchUrl).then(res => res.json()).then(data => {
            if (data.characters && data.characters.length > 0) {
                if (!targetUserId) document.getElementById('btn-delete-profile').style.display = 'block';
                if (data.isGlobal) document.getElementById('is-global').checked = true;
                data.characters.forEach((char, idx) => createCharacterBlock(char, idx));
            } else {
                createCharacterBlock();
            }
        }).catch(() => createCharacterBlock());

        function saveProfile() {
            const characters = [];
            document.querySelectorAll('.character-block').forEach(block => {
                const roles = Array.from(block.querySelectorAll('.role-check:check
