<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой игровой профиль</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/ui.js"></script>
    <style>
        .profile-container { max-width: 700px; margin: 50px auto; padding: 20px; }
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-header h1 { font-family: 'Cinzel', serif; color: var(--accent); font-size: 36px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .back-btn { display: block; text-align: center; margin-bottom: 20px; color: var(--text-muted); text-decoration: none; }
        .back-btn:hover { color: var(--accent); }
        
        .character-block { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 20px; position: relative; }
        .char-title { font-family: 'Cinzel', serif; color: var(--accent); margin-bottom: 15px; font-size: 18px; }
        .remove-char-btn { position: absolute; top: 15px; right: 15px; background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; display: none; }
        
        .switch-container { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body class="bg-forest">
    <div class="profile-container">
        <a href="/dashboard" class="back-btn">← Вернуться в панель</a>
        
        <div class="profile-header">
            <h1 id="page-title">Мои персонажи</h1>
            <p id="page-subtitle">Эта информация будет видна другим игрокам</p>
        </div>

        <div class="switch-container" id="switch-global">
            <div>
                <h4 style="margin: 0; color: var(--text-main);">Сделать профиль глобальным?</h4>
                <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted);">Если включено, профиль будет виден на всех серверах бота.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="is-global">
                <span class="slider"></span>
            </label>
        </div>

        <div id="characters-container"></div>
        
        <button class="btn btn-success" onclick="addCharacter()" id="btn-add" style="width: 100%; margin-bottom: 15px;">+ Добавить второго персонажа</button>
        <button class="btn" onclick="saveProfile()" style="width: 100%; margin-bottom: 15px;">💾 Сохранить профиль</button>
        <button class="btn btn-danger" onclick="deleteMyProfile()" id="btn-delete-profile" style="width: 100%; display: none;">🗑️ Удалить профиль</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const guildId = urlParams.get('guild') || window.location.pathname.split('/').pop();
        const targetUserId = urlParams.get('user'); 
        
        let charCount = 0;
        let isNewProfile = true;

        if (targetUserId) {
            document.getElementById('page-title').innerText = 'Редактирование профиля';
            document.getElementById('page-subtitle').innerText = `Вы редактируете профиль пользователя <@${targetUserId}>`;
        }

        function createCharacterBlock(data = {}, index = 0) {
            charCount++;
            const block = document.createElement('div');
            block.className = 'character-block';
            block.id = `char-block-${charCount}`;
            
            block.innerHTML = `
                <button class="remove-char-btn" onclick="removeCharacter('${block.id}')">Удалить</button>
                <div class="char-title">Персонаж ${index + 1}</div>
                <div class="form-group"><label>Игровой ник</label><input type="text" class="c-nick" value="${data.gameNickname || ''}" placeholder="Например: Koten-Ren"></div>
                <div class="form-group"><label>Гильдия</label><input type="text" class="c-guild" value="${data.guildName || ''}" placeholder="Например: СНОВА"></div>
                <div class="form-group"><label>Класс / Роль</label>
                    <select class="c-class">
                        <option value="">Не выбрано</option>
                        <option value="Танк" ${data.classRole === 'Танк' ? 'selected' : ''}>Танк</option>
                        <option value="ДД (Урон)" ${data.classRole === 'ДД (Урон)' ? 'selected' : ''}>ДД (Урон)</option>
                        <option value="Хил (Поддержка)" ${data.classRole === 'Хил (Поддержка)' ? 'selected' : ''}>Хил (Поддержка)</option>
                        <option value="Универсал" ${data.classRole === 'Универсал' ? 'selected' : ''}>Универсал</option>
                    </select>
                </div>
                <div class="form-group"><label>Оружие</label><input type="text" class="c-weapon" value="${data.weapon || ''}" placeholder="Например: Меч и Веер"></div>
                <div class="form-group"><label>О себе</label><textarea class="c-bio" style="height: 60px;">${data.bio || ''}</textarea></div>
            `;
            document.getElementById('characters-container').appendChild(block);
            updateRemoveButtons();
        }

        function addCharacter() {
            if (charCount >= 2) return showToast('Можно добавить не более 2 персонажей.', 'error');
            createCharacterBlock({}, charCount);
        }

        function removeCharacter(id) {
            document.getElementById(id).remove();
            charCount--;
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const blocks = document.querySelectorAll('.character-block');
            blocks.forEach((block, index) => {
                block.querySelector('.char-title').innerText = `Персонаж ${index + 1}`;
                const removeBtn = block.querySelector('.remove-char-btn');
                removeBtn.style.display = blocks.length > 1 ? 'block' : 'none';
            });
            document.getElementById('btn-add').style.display = blocks.length >= 2 ? 'none' : 'block';
        }

        // ЗАГРУЗКА ПРОФИЛЯ
        const fetchUrl = targetUserId 
            ? `/api/profile/${guildId}?user=${targetUserId}` 
            : `/api/profile/${guildId}`;

        fetch(fetchUrl)
            .then(res => {
                if (!res.ok) throw new Error('Ошибка загрузки');
                return res.json();
            })
            .then(data => {
                if (data.characters && data.characters.length > 0) {
                    isNewProfile = false;
                    // Показываем кнопку удаления только если это свой профиль
                    if (!targetUserId) document.getElementById('btn-delete-profile').style.display = 'block';
                    
                    if (data.isGlobal) document.getElementById('is-global').checked = true;
                    data.characters.forEach((char, idx) => createCharacterBlock(char, idx));
                } else {
                    createCharacterBlock();
                }
            })
            .catch(err => {
                showToast('Не удалось загрузить профиль', 'error');
                createCharacterBlock();
            });

        function saveProfile() {
            const characters = [];
            document.querySelectorAll('.character-block').forEach(block => {
                characters.push({
                    gameNickname: block.querySelector('.c-nick').value,
                    guildName: block.querySelector('.c-guild').value,
                    classRole: block.querySelector('.c-class').value,
                    weapon: block.querySelector('.c-weapon').value,
                    bio: block.querySelector('.c-bio').value
                });
            });

            const isGlobal = document.getElementById('is-global').checked;

            const payload = { characters, isGlobal };
            if (targetUserId) payload.targetUser = targetUserId;

            fetch(`/api/profile/${guildId}`, {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    showToast('Профиль сохранен!', 'success');
                    setTimeout(() => window.location.reload(), 1000);
                } else {
                    showToast('Ошибка: ' + data.error, 'error');
                }
            });
        }

        function deleteMyProfile() {
            if (!confirm('Вы уверены, что хотите удалить свой профиль?')) return;
            fetch(`/api/profile/${guildId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showToast('Профиль удален!', 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    } else showToast('Ошибка: ' + data.error, 'error');
                });
        }
    </script>
</body>
</html>
