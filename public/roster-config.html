<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка колонок</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .form-card { background: var(--bg-card); padding: 30px; border-radius: 12px; max-width: 800px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .help-text { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 id="server-name">Загрузка...</h2>
        <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;">← К списку серверов</a>
        <hr style="border-color: var(--border-color);">
        <a href="#" id="link-back">🏠 На главную</a>
        <a href="#" class="active">⚙️ Настройка колонок</a>
    </div>
    <div class="content">
        <div class="header"><h1>⚙️ Настройка колонок для списка</h1></div>
        <div class="form-card">
            <p style="color: var(--text-muted); margin-bottom: 20px;">Выберите роли, которые будут отображаться в команде /список.</p>
            
            <div id="columns-container"></div>
            
            <button class="btn btn-success btn-small" onclick="addColumn()" style="margin-bottom: 20px;">+ Добавить колонку</button>
            
            <div style="border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 20px;">
                <button class="btn" onclick="saveConfig()">💾 Сохранить настройки</button>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        document.getElementById('link-back').href = `/manage/${guildId}`;
        let serverRoles = [];

        Promise.all([
            fetch(`/api/guild/${guildId}`).then(res => res.json()),
            fetch(`/api/guild/${guildId}/roster-config`).then(res => res.json())
        ]).then(([guildData, configData]) => {
            document.getElementById('server-name').innerText = guildData.name;
            serverRoles = guildData.roles;

            if (configData && configData.columns && configData.columns.length > 0) {
                configData.columns.forEach(col => addColumn(col.roleId, col.name));
            } else {
                addColumn(); 
            }
        });

        function addColumn(selectedRoleId = '', currentName = '') {
            const container = document.getElementById('columns-container');
            const row = document.createElement('div');
            row.className = 'role-row';
            
            let options = serverRoles.map(r => `<option value="${r.id}" ${r.id === selectedRoleId ? 'selected' : ''}>${r.name}</option>`).join('');
            
            row.innerHTML = `
                <select class="col-role" style="flex: 1;">${options}</select>
                <div style="flex: 1; display: flex; flex-direction: column;">
                    <input type="text" class="col-name" placeholder="Название (например: ⚔️ ДД)" value="${currentName}">
                    <span class="help-text">Чтобы вставить эмодзи, напиши \:имя_эмодзи: в Discord, скопируй результат (например: <:tank:123456789>) и вставь сюда.</span>
                </div>
                <button class="btn btn-danger btn-small" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        function saveConfig() {
            const columns = [];
            document.querySelectorAll('#columns-container .role-row').forEach(row => {
                columns.push({
                    roleId: row.querySelector('.col-role').value,
                    name: row.querySelector('.col-name').value || 'Без названия'
                });
            });

            fetch(`/api/guild/${guildId}/roster-config`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ columns })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    alert('✅ Настройки сохранены! Теперь вернитесь к составу гильдии.');
                    window.location.href = `/manage/${guildId}/roster`;
                }
                else alert('❌ Ошибка: ' + data.error);
            });
        }
    </script>
</body>
</html>
