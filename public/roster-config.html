<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>Настройка колонок</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"><h1>Главная</h1></a>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;"><div class="icon icon-arrow-left"></div> К списку серверов</a>
            <hr style="border-color: var(--border-color); margin-bottom: 20px;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" class="active"><div class="icon icon-gear"></div> Настройка колонок</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-gear"></div> Настройка колонок</h1></div>
            <div class="form-card">
                <p style="color: var(--text-muted); margin-bottom: 20px;">Выберите роли и укажите названия. Можно использовать эмодзи сервера (напишите :имя_эмодзи:).</p>
                <div id="columns-container"></div>
                <button class="btn btn-success btn-small" onclick="addColumn()" style="margin-bottom: 20px;"><div class="icon icon-plus"></div> Добавить колонку</button>
                <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <button class="btn" onclick="saveConfig()"><div class="icon icon-floppy-disk"></div> Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        document.getElementById('nav-home').href = `/manage/${guildId}`;
        document.getElementById('nav-roster').href = `/manage/${guildId}/roster`;
        let serverRoles = [];

        Promise.all([
            fetch(`/api/guild/${guildId}`).then(res => res.json()),
            fetch(`/api/guild/${guildId}/roster-config`).then(res => res.json())
        ]).then(([guildData, configData]) => {
            document.getElementById('server-name').innerText = guildData.name;
            serverRoles = guildData.roles;

            if (configData && configData.columns && configData.columns.length > 0) {
                configData.columns.forEach(col => addColumn(col.roleId, col.name, col.color));
            } else {
                addColumn(); 
            }
        });

        function addColumn(selectedRoleId = '', currentName = '', currentColor = '#2ecc71') {
            const container = document.getElementById('columns-container');
            const row = document.createElement('div');
            row.className = 'role-row';
            let options = serverRoles.map(r => `<option value="${r.id}" ${r.id === selectedRoleId ? 'selected' : ''}>${r.name}</option>`).join('');
            
            row.innerHTML = `
                <select class="col-role">${options}</select>
                <input type="text" class="col-name" placeholder="Название" value="${currentName}">
                <input type="color" class="col-color color-picker" value="${currentColor}" title="Цвет">
                <button class="btn btn-danger btn-small" onclick="this.parentElement.remove()"><div class="icon icon-x"></div></button>
            `;
            container.appendChild(row);
        }

        function saveConfig() {
            const columns = [];
            document.querySelectorAll('#columns-container .role-row').forEach(row => {
                columns.push({
                    roleId: row.querySelector('.col-role').value,
                    name: row.querySelector('.col-name').value || 'Без названия',
                    color: row.querySelector('.col-color').value
                });
            });

            fetch(`/api/guild/${guildId}/roster-config`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ columns })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    alert('✅ Настройки сохранены!');
                    window.location.href = `/manage/${guildId}/roster`;
                }
            });
        }
    </script>
</body>
</html>
