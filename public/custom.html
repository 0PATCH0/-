<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эмбед-сообщения</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <!-- ВСТАВЛЯТЬ СЮДА: Фон и эффекты -->
    <video class="bg-video" autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
    <div class="bg-particles"></div>
    <!-- КОНЕЦ БЛОКА С ФОНОМ -->

    <!-- Кнопка-печать "Главная" -->
    <a href="#" id="top-banner-link" class="top-banner"></a>
    
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>
    
    <div class="main-container">
        <!-- ... остальной код ... -->

    <a href="#" id="top-banner-link" class="top-banner"></a>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;"><div class="icon icon-arrow-left"></div> К списку серверов</a>
            <hr style="border-color: var(--border-color); margin-bottom: 20px;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" id="nav-guides"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" id="nav-rr"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" id="nav-rem"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" id="nav-mod"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" id="nav-logs"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" class="active"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-envelope"></div> Управление сообщениями</h1></div>
            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); align-items: start;">
                <div class="form-card">
                    <h3 id="form-title" style="color: var(--accent-gold); margin-bottom: 20px; font-family: 'Georgia', serif;">Создать сообщение</h3>
                    <input type="hidden" id="edit-message-id" value="">
                    <div class="form-group"><label>ID Канала</label><input type="text" id="channel-id" placeholder="123456789..."></div>
                    <div class="form-group"><label>Заголовок</label><input type="text" id="cmd-title" placeholder="Заголовок"></div>
                    <div class="form-group"><label>Текст</label><textarea id="cmd-desc" placeholder="Описание..." style="height: 100px;"></textarea></div>
                    <div class="form-group"><label>Цвет полоски</label><input type="color" id="cmd-color" value="#2ecc71" style="height: 45px; padding: 5px;"></div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button class="btn" onclick="saveMessage()" id="btn-save" style="flex: 1;"><div class="icon icon-paper-plane"></div> Отправить</button>
                        <button class="btn btn-danger" onclick="cancelEdit()" id="btn-cancel" style="display: none;"><div class="icon icon-x"></div></button>
                    </div>
                </div>

                <div class="form-card">
                    <h3 style="color: var(--accent-gold); margin-bottom: 20px; font-family: 'Georgia', serif;">Отправленные</h3>
                    <div id="messages-list"><p style="color: var(--text-muted);">Загрузка...</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-guides': '/guides', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-logs': '/logs'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;
        
        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => document.getElementById('server-name').innerText = data.name);

        function loadMessages() {
            fetch(`/api/guild/${guildId}/embeds`).then(res => res.json()).then(data => {
                const list = document.getElementById('messages-list');
                if (data.length === 0) return list.innerHTML = '<p style="color: var(--text-muted);">Сообщений нет.</p>';
                
                list.innerHTML = '';
                data.forEach(msg => {
                    list.innerHTML += `
                        <div style="background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid ${msg.color || 'var(--accent-jade)'};">
                            <h4 style="color: var(--accent-gold); margin-bottom: 5px;">${msg.title || 'Без заголовка'}</h4>
                            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">${msg.description ? msg.description.substring(0, 50) + '...' : ''}</p>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn btn-small" onclick='editMessage(${JSON.stringify(msg)})'><div class="icon icon-pencil"></div> Ред.</button>
                                <button class="btn btn-danger btn-small" onclick="deleteMessage('${msg.messageId}')"><div class="icon icon-trash"></div> Удалить</button>
                            </div>
                        </div>
                    `;
                });
            });
        }
        loadMessages();

        function saveMessage() {
            const messageId = document.getElementById('edit-message-id').value;
            const payload = {
                channelId: document.getElementById('channel-id').value,
                title: document.getElementById('cmd-title').value,
                description: document.getElementById('cmd-desc').value,
                color: document.getElementById('cmd-color').value,
                image: '', footer: '', author: ''
            };

            if (!messageId && !payload.channelId) return alert('Укажите ID канала!');

            const method = messageId ? 'PUT' : 'POST';
            const url = messageId ? `/api/guild/${guildId}/embeds/${messageId}` : `/api/guild/${guildId}/embeds`;

            fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(res => res.json()).then(data => {
                if (data.success) {
                    alert(method === 'PUT' ? 'Обновлено!' : 'Отправлено!');
                    cancelEdit(); loadMessages();
                }
            });
        }

        function editMessage(msg) {
            document.getElementById('form-title').innerText = 'Редактировать';
            document.getElementById('edit-message-id').value = msg.messageId;
            document.getElementById('channel-id').value = msg.channelId;
            document.getElementById('channel-id').disabled = true;
            document.getElementById('cmd-title').value = msg.title || '';
            document.getElementById('cmd-desc').value = msg.description || '';
            document.getElementById('cmd-color').value = msg.color || '#2ecc71';
            document.getElementById('btn-save').innerHTML = '<div class="icon icon-floppy-disk"></div> Сохранить';
            document.getElementById('btn-cancel').style.display = 'block';
        }

        function cancelEdit() {
            document.getElementById('form-title').innerText = 'Создать сообщение';
            document.getElementById('edit-message-id').value = '';
            document.getElementById('channel-id').disabled = false;
            document.getElementById('channel-id').value = '';
            document.getElementById('cmd-title').value = '';
            document.getElementById('cmd-desc').value = '';
            document.getElementById('btn-save').innerHTML = '<div class="icon icon-paper-plane"></div> Отправить';
            document.getElementById('btn-cancel').style.display = 'none';
        }

        function deleteMessage(id) {
            if (!confirm('Удалить сообщение?')) return;
            fetch(`/api/guild/${guildId}/embeds/${id}`, { method: 'DELETE' }).then(() => loadMessages());
        }
    </script>
</body>
</html>
