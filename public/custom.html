<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эмбеды — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в управление</a>
        </nav>

        <div class="page-title">
            <h1>✉️ Эмбеды</h1>
            <p>☯ Сообщения от имени бота</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;" id="custom-layout">
            <div class="panel">
                <div class="panel-title">
                    <span id="form-title">Создать сообщение</span>
                </div>

                <div class="form-group">
                    <label>ID канала</label>
                    <input type="text" id="channel-id" placeholder="123456789...">
                </div>
                <div class="form-group">
                    <label>Заголовок</label>
                    <input type="text" id="cmd-title" placeholder="Заголовок сообщения">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="cmd-desc" placeholder="Текст сообщения..." style="min-height: 100px;"></textarea>
                </div>
                <div class="form-group">
                    <label>Цвет полоски</label>
                    <input type="color" id="cmd-color" value="#d4af37" style="height: 45px; padding: 5px;">
                </div>
                <div class="form-group">
                    <label>Картинка (URL, опционально)</label>
                    <input type="url" id="cmd-image" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Автор (опционально)</label>
                    <input type="text" id="cmd-author" placeholder="Имя автора">
                </div>
                <div class="form-group">
                    <label>Подвал (опционально)</label>
                    <input type="text" id="cmd-footer" placeholder="Footer текст">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-primary" onclick="saveMessage()" id="btn-save" style="flex: 1;">📤 Отправить</button>
                    <button class="btn btn-danger" onclick="cancelEdit()" id="btn-cancel" style="display: none;">Отмена</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span>Отправленные</span>
                </div>
                <div id="messages-list">
                    <div class="empty-state">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @media (max-width: 900px) {
            #custom-layout { grid-template-columns: 1fr !important; }
        }
        .msg-card {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .msg-card h4 { color: var(--gold); font-family: 'Cinzel', serif; margin-bottom: 6px; font-size: 15px; }
        .msg-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    </style>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const backLink = document.getElementById('back-link');
        if (backLink) backLink.href = '/manage/' + guildId;

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[m]));
        }

        function loadMessages() {
            fetch('/api/guild/' + guildId + '/custom', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('messages-list');
                    if (!data || data.length === 0) {
                        list.innerHTML = '<div class="empty-state">Сообщений нет.</div>';
                        return;
                    }
                    list.innerHTML = '';
                    data.forEach(msg => {
                        const card = document.createElement('div');
                        card.className = 'msg-card';
                        card.style.borderLeft = '3px solid ' + (msg.color || '#d4af37');
                        card.innerHTML = `
                            <h4>${escapeHtml(msg.title || 'Без заголовка')}</h4>
                            <p>${msg.description ? escapeHtml(msg.description.substring(0, 80)) + '...' : 'Без описания'}</p>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn btn-secondary btn-small" style="flex: 1;">✏ Ред.</button>
                                <button class="btn btn-danger btn-small" style="flex: 1;">🗑 Удалить</button>
                            </div>
                        `;
                        card.querySelector('.btn-secondary').onclick = () => editMessage(msg);
                        card.querySelector('.btn-danger').onclick = () => deleteMessage(msg.messageId);
                        list.appendChild(card);
                    });
                })
                .catch(() => {
                    document.getElementById('messages-list').innerHTML = '<div class="empty-state">Ошибка загрузки.</div>';
                });
        }

        loadMessages();

        function saveMessage() {
            const messageId = document.getElementById('btn-cancel').style.display === 'block';
            const payload = {
                channelId: document.getElementById('channel-id').value,
                title: document.getElementById('cmd-title').value,
                description: document.getElementById('cmd-desc').value,
                color: document.getElementById('cmd-color').value,
                image: document.getElementById('cmd-image').value,
                author: document.getElementById('cmd-author').value,
                footer: document.getElementById('cmd-footer').value
            };

            if (!messageId && !payload.channelId) return alert('Укажите ID канала!');

            const method = messageId ? 'POST' : 'POST'; // web.js не имеет PUT — только POST/DELETE
            const url = '/api/guild/' + guildId + '/custom';

            fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    alert('✅ Отправлено!');
                    cancelEdit();
                    loadMessages();
                } else alert('❌ Ошибка: ' + (data.error || 'неизвестно'));
            }).catch(() => alert('❌ Ошибка сети'));
        }

        function editMessage(msg) {
            document.getElementById('form-title').innerText = 'Редактировать (только текст)';
            document.getElementById('channel-id').value = msg.channelId;
            document.getElementById('channel-id').disabled = true;
            document.getElementById('cmd-title').value = msg.title || '';
            document.getElementById('cmd-desc').value = msg.description || '';
            document.getElementById('cmd-color').value = msg.color || '#d4af37';
            document.getElementById('cmd-image').value = msg.image || '';
            document.getElementById('cmd-author').value = msg.author || '';
            document.getElementById('cmd-footer').value = msg.footer || '';
            document.getElementById('btn-cancel').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('form-title').innerText = 'Создать сообщение';
            document.getElementById('channel-id').value = '';
            document.getElementById('channel-id').disabled = false;
            document.getElementById('cmd-title').value = '';
            document.getElementById('cmd-desc').value = '';
            document.getElementById('cmd-color').value = '#d4af37';
            document.getElementById('cmd-image').value = '';
            document.getElementById('cmd-author').value = '';
            document.getElementById('cmd-footer').value = '';
            document.getElementById('btn-cancel').style.display = 'none';
        }

        function deleteMessage(id) {
            if (!confirm('Удалить сообщение?')) return;
            fetch('/api/guild/' + guildId + '/custom/' + id, { method: 'DELETE', credentials: 'include' })
                .then(() => loadMessages());
        }
    </script>
</body>
</html>
