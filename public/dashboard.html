<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои серверы</title>
    <link rel="stylesheet" href="/css/style.css?v=6">
</head>
<body style="padding-top: 20px;">

    <div class="main-container">
        <div class="sidebar">
            <h2>Панель управления</h2>
            <a href="/dashboard" class="active"><div class="icon icon-home"></div> Мои серверы</a>
            <a href="/logout" style="margin-top: 50px; color: var(--danger);"><div class="icon icon-arrow-left"></div> Выйти</a>
        </div>

        <div class="content">
            <div class="header">
                <h1 id="welcome-text">Привет, загрузка...</h1>
            </div>

            <div class="grid" id="server-list">
                <p style="color: var(--text-muted);">Поиск серверов...</p>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/user').then(res => res.json()).then(data => {
            document.getElementById('welcome-text').innerText = `Привет, ${data.user.username}!`;
            
            const grid = document.getElementById('server-list');
            
            if (data.guilds.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">Бот не найден ни на одном из ваших серверов.</p>';
                return;
            }

            grid.innerHTML = '';
            
            data.guilds.forEach(guild => {
                const isAdmin = (BigInt(guild.permissions) & BigInt(0x8)) === BigInt(0x8);
                const icon = guild.icon 
                    ? `<img src="https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--jade);">` 
                    : `<div style="width: 50px; height: 50px; border-radius: 50%; background: var(--jade); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px;">${guild.name.charAt(0)}</div>`;
                
                // Формируем кнопки: если админ - две кнопки, если нет - только профиль
                let buttonsHtml = '';
                if (isAdmin) {
                    buttonsHtml = `
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <a href="/manage/${guild.id}" class="btn btn-small" style="flex: 1;">Управление</a>
                            <a href="/profile?guild=${guild.id}" class="btn btn-small" style="flex: 1; background: rgba(212, 175, 55, 0.15); border-color: var(--gold); color: var(--gold);">Мой профиль</a>
                        </div>
                    `;
                } else {
                    buttonsHtml = `
                        <div style="margin-top: 15px;">
                            <a href="/profile?guild=${guild.id}" class="btn btn-small" style="width: 100%;">Заполнить профиль</a>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                        <div style="display: flex; gap: 15px; align-items: center;">
                            ${icon}
                            <h3 style="margin: 0; font-size: 18px;">${guild.name}</h3>
                        </div>
                        ${buttonsHtml}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
