<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои серверы</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body style="padding-top: 20px;"> <!-- Убираем отступ под баннер, так как его тут нет -->

    <div class="main-container">
        <div class="sidebar">
            <h2>Панель управления</h2>
            <a href="/dashboard" class="active"><div class="icon icon-home"></div> Мои серверы</a>
            <a href="/profile"><div class="icon icon-users"></div> Мой профиль</a>
            <a href="/logout" style="margin-top: 50px; color: var(--danger);"><div class="icon icon-arrow-left"></div> Выйти</a>
        </div>

        <div class="content">
            <div class="header">
                <h1 id="welcome-text">Загрузка...</h1>
            </div>
            <div class="grid" id="server-list">
                <p style="color: var(--text-muted);">Поиск серверов...</p>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/user').then(res => res.json()).then(data => {
            document.getElementById('welcome-text').innerText = `Привет, ${data.user.username}!`;
            const grid = document.getElementById('server-list');
            
            if (data.guilds.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">У вас нет серверов, где вы администратор.</p>';
                return;
            }

            grid.innerHTML = '';
            data.guilds.forEach(guild => {
                const icon = guild.icon ? `<img src="https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent-jade); margin-right: 20px;">` : `<div style="width: 60px; height: 60px; border-radius: 50%; background: var(--accent-jade); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 28px; margin-right: 20px;">${guild.name.charAt(0)}</div>`;
                
                grid.innerHTML += `
                    <a href="/manage/${guild.id}" class="card" style="flex-direction: row; align-items: center; padding: 20px; display: flex;">
                        ${icon}
                        <div>
                            <h3 style="margin-bottom: 5px; font-size: 18px;">${guild.name}</h3>
                            <p style="font-size: 13px; color: var(--text-muted);">Нажмите для управления</p>
                        </div>
                    </a>
                `;
            });
        });
    </script>
</body>
</html>
