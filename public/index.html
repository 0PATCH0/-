<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Winds Meet — Панель управления</title>
    <link rel="stylesheet" href="/css/style.css?v=25">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Marcellus', serif;
            color: #e8e3d4;
            background: #06080a;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ─── Фон с чернильными разводами и шумом ─── */
        .bg-ink {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 45%),
                radial-gradient(ellipse at 80% 80%, rgba(46, 204, 113, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #0d1015 0%, #06080a 100%);
            pointer-events: none;
        }
        .bg-ink::after {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
        }

        /* ─── Туман ─── */
        .fog {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 30% 90%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 10%, rgba(255, 255, 255, 0.015) 0%, transparent 40%);
            animation: fogDrift 20s ease-in-out infinite alternate;
        }
        @keyframes fogDrift {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* ─── Частицы ─── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(212, 175, 55, 0.8);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
        }

        /* ─── Навигация (только профиль, если залогинен) ─── */
        .nav {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
        }
        .nav-auth {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #8a8578;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px 6px 6px;
            border-radius: 50px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
        }
        .nav-auth img {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .nav-auth a {
            color: #8a8578;
            text-decoration: none;
            margin-left: 8px;
            transition: color 0.3s;
        }
        .nav-auth a:hover { color: #d4af37; }

        /* ─── Контент ─── */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 800px;
            animation: fadeUp 1.2s ease-out 0.2s both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── Печать ветра ─── */
        .seal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px; height: 80px;
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            margin-bottom: 35px;
            font-family: 'Cinzel', serif;
            font-size: 34px;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            position: relative;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.1);
            animation: sealGlow 4s ease-in-out infinite alternate;
        }
        .seal::before,
        .seal::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 50%;
        }
        .seal::before { top: -6px; left: 50%; transform: translateX(-50%); }
        .seal::after { bottom: -6px; left: 50%; transform: translateX(-50%); }
        @keyframes sealGlow {
            0% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.1); }
            100% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.35), inset 0 0 25px rgba(212, 175, 55, 0.2); }
        }

        /* ─── Заголовок ─── */
        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(36px, 8vw, 76px);
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4a0 40%, #aa8624 70%, #d4af37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 18px;
            line-height: 1.1;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.3));
        }
        .hero-sub {
            font-size: clamp(12px, 2vw, 15px);
            color: #8a8578;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .hero-sub::before,
        .hero-sub::after {
            content: '——';
            color: rgba(212, 175, 55, 0.4);
            font-size: 12px;
            letter-spacing: normal;
        }

        /* ─── Кнопка ─── */
        .btn-main {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 18px 50px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-decoration: none;
            color: #0a0b10;
            background: linear-gradient(135deg, #d4af37, #aa8624);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.25), inset 0 0 0 1px rgba(244, 228, 160, 0.4);
            transition: all 0.3s ease;
        }
        .btn-main::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(212, 175, 55, 0.4), inset 0 0 0 1px rgba(244, 228, 160, 0.6);
        }
        .btn-main:hover::before { transform: translateX(100%); }
        .btn-main svg {
            width: 20px; height: 20px;
            fill: currentColor;
        }

        /* ─── Футер ─── */
        .footer {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #3a3528;
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            z-index: 2;
        }

        @media (max-width: 600px) {
            .nav { top: 15px; right: 15px; }
            .seal { width: 64px; height: 64px; font-size: 26px; margin-bottom: 25px; }
            .hero-title { letter-spacing: 4px; }
            .btn-main { padding: 16px 36px; font-size: 14px; }
            .hero-sub { margin-bottom: 45px; }
        }
    </style>
</head>
<body>
    <!-- Фон -->
    <div class="bg-ink"></div>
    <div class="fog"></div>
    <div class="particles" id="particles"></div>

    <!-- Навигация -->
    <nav class="nav">
        <div class="nav-auth" id="auth-area" style="display: none;"></div>
    </nav>

    <!-- Контент -->
    <div class="container">
        <div class="seal">風</div>
        <h1 class="hero-title">WHERE WINDS MEET</h1>
        <p class="hero-sub">Панель управления</p>
        <a href="/auth/discord" class="btn-main" id="cta-main">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <span>Войти через Discord</span>
        </a>
    </div>

    <footer class="footer">Where Winds Meet • Fan Project • 2026</footer>

    <script>
        // Частицы
        (function() {
            const wrap = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.bottom = (Math.random() * 20) + '%';
                p.style.animationDuration = (10 + Math.random() * 15) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.opacity = 0.2 + Math.random() * 0.4;
                wrap.appendChild(p);
            }
        })();

        // Проверка авторизации
        fetch('/api/user', { credentials: 'include' })
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                const authArea = document.getElementById('auth-area');
                const cta = document.getElementById('cta-main');
                if (!authArea) return;
                if (data && data.user) {
                    const u = data.user;
                    const avatar = u.avatar
                        ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png`
                        : `https://cdn.discordapp.com/embed/avatars/0.png`;
                    authArea.style.display = 'flex';
                    authArea.innerHTML = `
                        <img src="${avatar}" alt="">
                        <span>${u.username}</span>
                        <a href="/logout">Выйти</a>
                    `;
                    if (cta) {
                        cta.href = '/dashboard';
                        cta.querySelector('span:last-child').textContent = 'Перейти в панель';
                    }
                } else {
                    authArea.style.display = 'none';
                }
            })
            .catch(() => {
                const authArea = document.getElementById('auth-area');
                if (authArea) authArea.style.display = 'none';
            });
    </script>
</body>
</html>
