<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления Ботом</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2f3136; color: #ffffff; text-align: center; padding-top: 100px; }
        .container { background-color: #36393f; padding: 40px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { margin-bottom: 10px; }
        p { color: #b9bbbe; margin-bottom: 30px; }
        .btn { background-color: #5865F2; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background-color: #4752C4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Панель управления</h1>
        <p>Войдите через Discord, чтобы настроить бота на вашем сервере.</p>
        <a href="/auth/discord" class="btn">Войти через Discord</a>
    </div>
</body>
</html>
