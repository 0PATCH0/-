<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль игрока — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/style.css?v=25">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: rgba(212, 175, 55, 0.35);
            --jade: #2ecc71;
            --danger: #e74c3c;
            --border: rgba(212, 175, 55, 0.18);
            --text-main: #e8e3d4;
            --text-muted: #8a8578;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Marcellus', serif;
            color: var(--text-main);
            background: #06080a;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .bg-ink {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 90%, rgba(46, 204, 113, 0.04) 0%, transparent 40%),
                linear-gradient(180deg, #06080a 0%, #0b0e13 100%);
            pointer-events: none;
        }
        .fog {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at 50% 100%, rgba(212,175,55,0.05) 0%, transparent 50%);
        }
        .container {
            position: relative; z-index: 2;
            max-width: 900px; margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px;
            animation: fadeDown 0.8s ease-out;
        }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .logo {
            font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700;
            letter-spacing: 3px; color: var(--gold);
            text-shadow: 0 0 15px var(--gold-soft);
        }
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 13px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold); }

        .player-hero {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 40px;
            animation: fadeUp 1s ease-out 0.2s both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .player-avatar {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid rgba(212,175,55,0.5);
            box-shadow: 0 0 30px rgba(212,175,55,0.25);
            overflow: hidden;
            margin-bottom: 18px;
        }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .player-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(22px, 5vw, 34px);
            background: linear-gradient(135deg, #d4af37, #f4e4a0, #aa8624, #d4af37);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 15px rgba(212,175,55,0.3));
        }
        .player-global {
            color: var(--jade); font-size: 13px; margin-top: 6px;
            letter-spacing: 2px;
        }

        .char-block {
            background: linear-gradient(160deg, rgba(18, 22, 28, 0.9), rgba(10, 12, 16, 0.95));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            position: relative; overflow: hidden;
            animation: fadeUp 0.6s ease-out;
        }
        .char-block::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .char-title {
            font-family: 'Cinzel', serif;
            font-size: 22px; color: var(--gold);
            margin-bottom: 6px; letter-spacing: 1px;
        }
        .char-guild {
            font-size: 13px; color: var(--text-muted); margin-bottom: 16px;
        }
        .char-bio {
            font-size: 14px; color: #c4bfae;
            font-style: italic; line-height: 1.6;
            padding: 12px 14px;
            background: rgba(0,0,0,0.3);
            border-left: 3px solid rgba(212,175,55,0.4);
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .build-section { margin-bottom: 16px; }
        .build-title {
            font-family: 'Cinzel', serif;
            font-size: 15px; color: var(--jade);
            letter-spacing: 2px; margin-bottom: 10px;
            text-transform: uppercase;
        }
        .build-title.pvp { color: var(--danger); }
        .section-label {
            font-family: 'Cinzel', serif;
            font-size: 12px; color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 14px 0 8px;
        }
        .skill-chips {
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .chip {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px; color: #c4bfae;
            display: flex; align-items: center; gap: 6px;
        }
        .chip img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }
        .chip-emoji { font-size: 14px; }
        .chip-empty {
            color: var(--text-muted); font-style: italic; font-size: 13px;
        }

        .empty-char {
            text-align: center; padding: 40px;
            color: var(--text-muted); font-style: italic;
        }

        @media (max-width: 600px) {
            .top-nav { margin-bottom: 25px; }
            .logo { font-size: 16px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад</a>
        </nav>

        <div id="content">
            <div class="empty-char">Загрузка профиля...</div>
        </div>
    </div>

    <script src="/js/gamedata.js"></script>
    <script>
        const pathParts = window.location.pathname.split('/');
        const userId = pathParts[2]; // /view-profile/:userId
        const guildId = new URLSearchParams(window.location.search).get('guild') || 'global';

        document.getElementById('back-link').href = (guildId && guildId !== 'global')
            ? '/manage/' + guildId + '/profiles'
            : '/global-profiles';

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }
        function findSkill(type, id) {
            const list = type === 'mystic'
                ? (window.GAME_DATA?.mysticSkills || [])
                : type === 'inner'
                    ? (window.GAME_DATA?.innerWays || [])
                    : (window.GAME_DATA?.martialArts || []);
            return list.find(s => s.id === id);
        }
        function renderChips(type, ids) {
            if (!ids || ids.length === 0) {
                return '<div class="chip-empty">Не выбраны</div>';
            }
            return ids.map(id => {
                const item = findSkill(type, id);
                if (!item) return `<div class="chip">${escapeHtml(id)}</div>`;
                if (type === 'martial') {
                    return `<div class="chip"><span class="chip-emoji">${item.emoji || '🥋'}</span>${escapeHtml(item.nameRU)}</div>`;
                }
                return `<div class="chip"><img src="${item.img}" alt="" onerror="this.style.display='none'">${escapeHtml(item.nameRU)}</div>`;
            }).join('');
        }

        async function load() {
            try {
                const res = await fetch('/api/profile/' + guildId + '?user=' + userId, {
                    credentials: 'include'
                });
                if (!res.ok) {
                    document.getElementById('content').innerHTML =
                        '<div class="empty-char">Профиль не найден.</div>';
                    return;
                }
                const profile = await res.json();
                render(profile);
            } catch (e) {
                console.error(e);
                document.getElementById('content').innerHTML =
                    '<div class="empty-char">Ошибка загрузки.</div>';
            }
        }

        function render(profile) {
            const characters = profile.characters || [];
            if (characters.length === 0) {
                document.getElementById('content').innerHTML =
                    '<div class="empty-char">У игрока пока нет персонажей.</div>';
                return;
            }

            const header = `
                <div class="player-hero">
                    <div class="player-avatar">
                        <img src="https://cdn.discordapp.com/avatars/${userId}/0.png"
                             onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" alt="">
                    </div>
                    <div class="player-name">Профиль игрока</div>
                    ${profile.isGlobal ? '<div class="player-global">🌐 Глобальный профиль</div>' : ''}
                </div>
            `;

            const charsHtml = characters.map(c => {
                const pve = c.builds?.PvE || {};
                const pvp = c.builds?.PvP || {};
                return `
                    <div class="char-block">
                        <div class="char-title">${escapeHtml(c.gameNickname || 'Без имени')}</div>
                        <div class="char-guild">🏰 ${escapeHtml(c.guildName || 'Гильдия не указана')}</div>
                        ${c.bio ? `<div class="char-bio">"${escapeHtml(c.bio)}"</div>` : ''}

                        <div class="build-section">
                            <div class="build-title">🌿 PvE Билд</div>
                            <div class="section-label">✨ Мистические навыки</div>
                            <div class="skill-chips">${renderChips('mystic', pve.mysticSkills)}</div>
                            <div class="section-label">🌀 Внутренние пути</div>
                            <div class="skill-chips">${renderChips('inner', pve.innerWays)}</div>
                            <div class="section-label">🥋 Боевые искусства</div>
                            <div class="skill-chips">${renderChips('martial', pve.martialArts)}</div>
                        </div>

                        <div class="build-section">
                            <div class="build-title pvp">⚔️ PvP Билд</div>
                            <div class="section-label">✨ Мистические навыки</div>
                            <div class="skill-chips">${renderChips('mystic', pvp.mysticSkills)}</div>
                            <div class="section-label">🌀 Внутренние пути</div>
                            <div class="skill-chips">${renderChips('inner', pvp.innerWays)}</div>
                            <div class="section-label">🥋 Боевые искусства</div>
                            <div class="skill-chips">${renderChips('martial', pvp.martialArts)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('content').innerHTML = header + charsHtml;
        }

        load();
    </script>
</body>
</html>
