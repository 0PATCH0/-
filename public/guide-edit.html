<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор гайда — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        /* Сетка */
        .editor-layout { display: flex; gap: 30px; align-items: flex-start; margin-top: 20px; }
        .editor-main { flex: 1; min-width: 0; }
        .editor-preview { width: 450px; position: sticky; top: 20px; }
        @media (max-width: 992px) { .editor-layout { flex-direction: column; } .editor-preview { width: 100%; position: static; } }

        /* Карточки глав */
        .chapter-card { background: linear-gradient(160deg, rgba(18, 22, 28, 0.95), rgba(10, 12, 16, 0.98)); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; overflow: hidden; position: relative; transition: 0.3s; }
        .chapter-card:hover { border-color: rgba(212, 175, 55, 0.5); box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1); }
        .chapter-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: rgba(0,0,0,0.4); cursor: pointer; }
        .chapter-header .ch-num { color: var(--gold); font-family: 'Cinzel', serif; font-weight: bold; font-size: 16px; min-width: 24px; }
        .chapter-header .ch-preview { flex: 1; font-family: 'Cinzel', serif; color: var(--text-main); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chapter-header .ch-actions { display: flex; gap: 6px; }
        .chapter-header .ch-btn { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--text-muted); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .chapter-header .ch-btn:hover { color: var(--gold); border-color: var(--gold); }
        .chapter-body { display: none; padding: 16px; border-top: 1px solid rgba(212,175,55,0.1); }
        .chapter-card.open .chapter-body { display: block; }

        /* Поля картинок */
        .image-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .image-item { display: flex; gap: 8px; }
        .image-item input { flex: 1; }
        .image-item button { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; border-radius: 6px; cursor: pointer; padding: 8px 12px; }
        
        /* ВКЛАДКИ НАСТРОЕК */
        .tabs { display: flex; gap: 5px; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
        .tab { padding: 8px 15px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-family: 'Cinzel', serif; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== СТИЛИ ПРЕДПРОСМОТРА (Как в Discord) ===== */
        .discord-dark { background: #313338; border-radius: 8px; padding: 16px; font-family: "gg sans", "Noto Sans", sans-serif; color: #dbdee1; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
        .discord-embed { border-left: 4px solid var(--gold); background: #2b2d31; border-radius: 4px; padding: 12px 16px; max-width: 100%; box-sizing: border-box; }
        .discord-author { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .discord-author img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .discord-author span { font-size: 14px; font-weight: 600; color: #fff; }
        .discord-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .discord-desc { font-size: 14px; line-height: 1.4; white-space: pre-wrap; margin-bottom: 12px; color: #dbdee1; }
        .discord-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .discord-field-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .discord-field-value { font-size: 14px; color: #dbdee1; }
        .discord-image { max-width: 100%; border-radius: 4px; margin-top: 10px; display: block; }
        .discord-thumbnail { position: absolute; right: 16px; top: 12px; width: 80px; height: 80px; border-radius: 4px; object-fit: cover; }
        .discord-footer { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: #949ba4; }
        .discord-footer img { width: 20px; height: 20px; border-radius: 50%; }
        .discord-btn { display: inline-block; margin-top: 10px; padding: 6px 12px; background: #4e5058; color: #fff; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: 500; }
        .discord-btn:hover { background: #5865F2; }

        .btn-loading { opacity: 0.7; cursor: wait !important; }
    </style>
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container" style="max-width: 1400px;">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="btn-back">← К гайдам</a>
        </nav>

        <div class="page-title">
            <h1 id="page-title">✍️ Новый гайд</h1>
            <p>☯ Знания начинаются с первой главы</p>
        </div>

        <div class="editor-layout">
            <!-- ЛЕВАЯ ЧАСТЬ -->
            <div class="editor-main">
                <div class="panel">
                    <div class="panel-title"><span>Общая информация</span></div>
                    <div class="form-group">
                        <label>Название гайда *</label>
                        <input type="text" id="guide-name" placeholder="Например: ГВГ Полный гайд">
                    </div>
                    <div class="form-group">
                        <label>Краткое описание (для меню в Discord)</label>
                        <input type="text" id="guide-desc" placeholder="Тактики, сборки и советы">
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <span>Главы гайда</span>
                        <button type="button" class="btn btn-primary btn-small" onclick="addChapter()">+ Добавить главу</button>
                    </div>
                    <div id="chapters-container"></div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap;">
                    <button type="button" class="btn btn-primary" onclick="saveGuide()" id="btn-save" style="flex: 1; min-width: 200px; font-size: 16px; padding: 15px;">💾 Сохранить гайд</button>
                    <button type="button" class="btn btn-danger" onclick="deleteGuide()" id="btn-delete" style="display: none;">🗑 Удалить гайд</button>
                </div>
            </div>

            <!-- ПРАВАЯ ЧАСТЬ -->
            <div class="editor-preview">
                <div class="panel-title" style="margin-bottom: 15px;">👁 Предпросмотр (Discord)</div>
                <div id="preview-container" class="discord-dark">
                    <div style="text-align: center; opacity: 0.5;">Заполните данные...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ИСПРАВЛЕНО: Безопасное извлечение URL
        function getIdsFromUrl() {
            const parts = window.location.pathname.split('/');
            // /manage/123/guides/edit/456
            const guildId = parts[2];
            const guideId = parts[5]; 
            return { guildId, guideId, isNew: guideId === 'new' };
        }

        const { guildId, guideId, isNew } = getIdsFromUrl();

        const backLink = document.getElementById('btn-back');
        if (backLink) backLink.href = '/manage/' + guildId + '/guides';

        let isDirty = false;

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        // Рендер превью
        function updatePreview() {
            const container = document.getElementById('preview-container');
            const cards = document.querySelectorAll('#chapters-container .chapter-card');
            
            if (cards.length === 0) {
                container.innerHTML = '<div style="text-align: center; opacity: 0.5;">Нет глав</div>';
                return;
            }

            let html = '';
            cards.forEach(card => {
                const title = card.querySelector('.ch-title').value || 'Без названия';
                const content = card.querySelector('.ch-content').value || '*Пусто*';
                const color = card.querySelector('.ch-color').value || '#d4af37';
                const author = card.querySelector('.ch-author').value;
                const authorImg = card.querySelector('.ch-author-img').value;
                const footer = card.querySelector('.ch-footer').value;
                const thumbnail = card.querySelector('.ch-thumbnail').value;
                const attachName = card.querySelector('.ch-attachment-name').value;
                const attachUrl = card.querySelector('.ch-attachment-url').value;
                
                const images = Array.from(card.querySelectorAll('.ch-image')).map(inp => inp.value.trim()).filter(Boolean);

                html += `
                    <div class="discord-embed" style="border-left-color: ${color}; margin-bottom: 20px; position: relative;">
                        ${author ? `
                            <div class="discord-author">
                                ${authorImg ? `<img src="${escapeHtml(authorImg)}" onerror="this.style.display='none'">` : ''}
                                <span>${escapeHtml(author)}</span>
                            </div>
                        ` : ''}
                        
                        <div class="discord-title">${escapeHtml(title)}</div>
                        <div class="discord-desc">${escapeHtml(content)}</div>
                        
                        ${thumbnail ? `<img src="${escapeHtml(thumbnail)}" class="discord-thumbnail" onerror="this.style.display='none'">` : ''}
                        ${images.length > 0 ? images.map(img => `<img src="${escapeHtml(img)}" class="discord-image" onerror="this.style.display='none'">`).join('') : ''}
                        
                        ${footer ? `<div class="discord-footer">${escapeHtml(footer)}</div>` : ''}
                        ${attachUrl ? `<a href="${escapeHtml(attachUrl)}" target="_blank" class="discord-btn">🔗 ${escapeHtml(attachName || 'Вложение')}</a>` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function addImageField(container, val = '') {
            const div = document.createElement('div');
            div.className = 'image-item';
            div.innerHTML = `
                <input type="text" class="ch-image" value="${escapeHtml(val)}" placeholder="https://i.imgur.com/..." oninput="markDirty(); updatePreview();">
                <button type="button" onclick="this.parentElement.remove(); updatePreview();" title="Удалить">✖</button>
            `;
            container.appendChild(div);
        }

        function switchTab(card, tabId) {
            card.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            card.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            card.querySelector(`.tab[data-target="${tabId}"]`).classList.add('active');
            card.querySelector(`#${tabId}`).classList.add('active');
        }

        function addChapter(data = {}, position) {
            const container = document.getElementById('chapters-container');
            const card = document.createElement('div');
            card.className = 'chapter-card';
            
            const d = {
                title: data.title || '',
                content: data.content || '',
                color: data.color || '#d4af37',
                author: data.author || '',
                authorImg: data.authorImg || '',
                footer: data.footer || '',
                thumbnail: data.thumbnail || '',
                images: data.images && data.images.length > 0 ? data.images : (data.imageUrl ? [data.imageUrl] : ['']),
                attachmentUrl: data.attachmentUrl || '',
                attachmentName: data.attachmentName || ''
            };

            const uid = 'ch_' + Math.random().toString(36).substr(2, 9);

            card.innerHTML = `
                <div class="chapter-header">
                    <span class="ch-num">1.</span>
                    <span class="ch-preview">${escapeHtml(d.title || 'Без заголовка')}</span>
                    <div class="ch-actions">
                        <button type="button" class="ch-btn" title="Выше" onclick="event.stopPropagation(); moveChapter(this, -1)">↑</button>
                        <button type="button" class="ch-btn" title="Ниже" onclick="event.stopPropagation(); moveChapter(this, 1)">↓</button>
                        <button type="button" class="ch-btn" title="Дублировать" onclick="event.stopPropagation(); duplicateChapter(this)">📋</button>
                    </div>
                </div>
                <div class="chapter-body">
                    <div class="tabs">
                        <button type="button" class="tab active" data-target="${uid}_main" onclick="switchTab(this.closest('.chapter-card'), '${uid}_main')">Основное</button>
                        <button type="button" class="tab" data-target="${uid}_design" onclick="switchTab(this.closest('.chapter-card'), '${uid}_design')">Дизайн</button>
                        <button type="button" class="tab" data-target="${uid}_media" onclick="switchTab(this.closest('.chapter-card'), '${uid}_media')">Медиа и файлы</button>
                    </div>

                    <!-- ВКЛАДКА: Основное -->
                    <div id="${uid}_main" class="tab-content active">
                        <div class="form-group">
                            <label>Заголовок</label>
                            <input type="text" class="ch-title" value="${escapeHtml(d.title)}" placeholder="Название" oninput="updatePreview()">
                        </div>
                        <div class="form-group">
                            <label>Текст (Markdown)</label>
                            <textarea class="ch-content" style="min-height: 120px;" placeholder="Текст..." oninput="updatePreview()">${escapeHtml(d.content)}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Автор главы</label>
                            <input type="text" class="ch-author" value="${escapeHtml(d.author)}" placeholder="Имя автора" oninput="updatePreview()">
                        </div>
                        <div class="form-group">
                            <label>Ссылка на аватар автора</label>
                            <input type="text" class="ch-author-img" value="${escapeHtml(d.authorImg)}" placeholder="https://..." oninput="updatePreview()">
                        </div>
                    </div>

                    <!-- ВКЛАДКА: Дизайн -->
                    <div id="${uid}_design" class="tab-content">
                        <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <div class="form-group" style="flex: 1; min-width: 120px;">
                                <label>Цвет полосы</label>
                                <input type="color" class="ch-color" value="${d.color}" style="height: 45px; width: 100%;" oninput="updatePreview()">
                            </div>
                            <div class="form-group" style="flex: 2; min-width: 200px;">
                                <label>Миниатюра (справа)</label>
                                <input type="text" class="ch-thumbnail" value="${escapeHtml(d.thumbnail)}" placeholder="https://..." oninput="updatePreview()">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Футер (нижний текст)</label>
                            <input type="text" class="ch-footer" value="${escapeHtml(d.footer)}" placeholder="Where Winds Meet" oninput="updatePreview()">
                        </div>
                    </div>

                    <!-- ВКЛАДКА: Медиа -->
                    <div id="${uid}_media" class="tab-content">
                        <div class="form-group">
                            <label>Изображения (URL)</label>
                            <div class="image-list"></div>
                            <button type="button" class="btn btn-secondary btn-small" onclick="addImageField(this.previousElementSibling); updatePreview();">+ Добавить картинку</button>
                        </div>
                        <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;">
                            <div class="form-group" style="flex: 2;">
                                <label>Ссылка на файл</label>
                                <input type="text" class="ch-attachment-url" value="${escapeHtml(d.attachmentUrl)}" placeholder="https://..." oninput="updatePreview()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label>Текст кнопки</label>
                                <input type="text" class="ch-attachment-name" value="${escapeHtml(d.attachmentName)}" placeholder="Скачать" oninput="updatePreview()">
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 15px;">
                        <button type="button" class="btn btn-danger btn-small" onclick="removeChapter(this)">🗑 Удалить главу</button>
                    </div>
                </div>
            `;

            card.querySelector('.chapter-header').addEventListener('click', (e) => {
                if (e.target.closest('.ch-btn')) return;
                card.classList.toggle('open');
            });

            card.querySelector('.ch-title').addEventListener('input', (e) => {
                card.querySelector('.ch-preview').textContent = e.target.value || 'Без заголовка';
            });

            const imgList = card.querySelector('.image-list');
            d.images.forEach(img => addImageField(imgList, img));

            if (position !== undefined && container.children[position]) {
                container.insertBefore(card, container.children[position]);
            } else {
                container.appendChild(card);
            }

            if (container.children.length === 1) card.classList.add('open');
            
            renumberChapters();
            updatePreview();
        }

        function renumberChapters() {
            document.querySelectorAll('#chapters-container .chapter-card').forEach((card, i) => {
                card.querySelector('.ch-num').textContent = (i + 1) + '.';
                card.querySelector('.ch-btn[title="Выше"]').disabled = (i === 0);
                card.querySelector('.ch-btn[title="Ниже"]').disabled = (i === card.parentElement.children.length - 1);
            });
        }
        function moveChapter(btn, direction) { /* ... */ }
        function duplicateChapter(btn) { /* ... */ }
        function removeChapter(btn) {
            if (!confirm('Удалить эту главу?')) return;
            btn.closest('.chapter-card').remove();
            renumberChapters(); markDirty(); updatePreview();
        }

        // Загрузка данных
        if (!isNew) {
            document.getElementById('page-title').innerHTML = '✍️ Редактирование гайда';
            document.getElementById('btn-delete').style.display = 'block';

            fetch('/api/guild/' + guildId + '/guides/' + guideId, { credentials: 'include' })
                .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                .then(guide => {
                    document.getElementById('guide-name').value = guide.name || '';
                    document.getElementById('guide-desc').value = guide.description || '';
                    if (guide.chapters && guide.chapters.length > 0) {
                        guide.chapters.forEach(ch => addChapter(ch));
                    } else {
                        addChapter();
                    }
                    isDirty = false;
                    updatePreview();
                })
                .catch(err => alert('Ошибка загрузки гайда: ' + err.message));
        } else {
            addChapter();
            isDirty = false;
        }

        // СОХРАНЕНИЕ (ИСПРАВЛЕНО)
        function saveGuide() {
            const name = document.getElementById('guide-name').value.trim();
            const description = document.getElementById('guide-desc').value.trim();
            const chapters = [];

            document.querySelectorAll('#chapters-container .chapter-card').forEach(card => {
                const images = Array.from(card.querySelectorAll('.ch-image')).map(inp => inp.value.trim()).filter(Boolean);
                chapters.push({
                    title: card.querySelector('.ch-title').value.trim() || 'Без названия',
                    content: card.querySelector('.ch-content').value,
                    color: card.querySelector('.ch-color').value,
                    author: card.querySelector('.ch-author').value.trim(),
                    authorImg: card.querySelector('.ch-author-img').value.trim(),
                    footer: card.querySelector('.ch-footer').value.trim(),
                    thumbnail: card.querySelector('.ch-thumbnail').value.trim(),
                    imageUrl: images[0] || '', 
                    imageUrls: images,          
                    attachmentUrl: card.querySelector('.ch-attachment-url').value.trim(),
                    attachmentName: card.querySelector('.ch-attachment-name').value.trim()
                });
            });

            if (!name) return alert('Введите название гайда!');
            if (chapters.length === 0) return alert('Добавьте хотя бы одну главу!');

            const method = isNew ? 'POST' : 'PUT';
            const url = isNew 
                ? '/api/guild/' + guildId + '/guides' 
                : '/api/guild/' + guildId + '/guides/' + guideId;

            const btn = document.getElementById('btn-save');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Сохранение...'; btn.disabled = true;

            fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ name, description, chapters })
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Ошибка сервера');
                return data;
            })
            .then(() => {
                isDirty = false;
                btn.innerHTML = '✅ Сохранено!';
                btn.style.background = '#2ecc71';
                setTimeout(() => window.location.href = '/manage/' + guildId + '/guides', 1000);
            })
            .catch(err => {
                alert('❌ Ошибка: ' + err.message);
                btn.innerHTML = originalText; btn.disabled = false;
            });
        }

        function deleteGuide() { /* ... код удаления ... */ }

        document.addEventListener('input', () => { isDirty = true; });
    </script>
</body>
</html>
