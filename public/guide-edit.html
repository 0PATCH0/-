<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор гайда — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        /* Двухколоночная сетка для редактора и превью */
        .editor-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            margin-top: 20px;
        }
        .editor-main {
            flex: 1;
            min-width: 0;
        }
        .editor-preview {
            width: 400px;
            position: sticky;
            top: 20px;
            background: linear-gradient(160deg, rgba(18, 22, 28, 0.95), rgba(10, 12, 16, 0.98));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        @media (max-width: 992px) {
            .editor-layout { flex-direction: column; }
            .editor-preview { width: 100%; position: static; max-height: none; }
        }

        /* Стили для карточек глав */
        .chapter-card {
            background: linear-gradient(160deg, rgba(18, 22, 28, 0.95), rgba(10, 12, 16, 0.98));
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .chapter-card:hover {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
        }
        .chapter-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }
        .chapter-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: rgba(0,0,0,0.4);
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }
        .chapter-header:hover { background: rgba(0,0,0,0.6); }
        .chapter-header .ch-num {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 16px;
            min-width: 24px;
        }
        .chapter-header .ch-preview {
            flex: 1;
            font-family: 'Cinzel', serif;
            color: var(--text-main);
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chapter-header .ch-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .chapter-header .ch-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .chapter-header .ch-btn:hover { color: var(--gold); border-color: var(--gold); }
        .chapter-header .ch-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .chapter-body {
            display: none;
            padding: 16px;
            border-top: 1px solid rgba(212,175,55,0.1);
        }
        .chapter-card.open .chapter-body { display: block; animation: fadeInDown 0.3s ease; }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Список картинок */
        .image-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .image-item { display: flex; gap: 8px; align-items: center; }
        .image-item input { flex: 1; }
        .image-item button { 
            background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; 
            color: #e74c3c; border-radius: 6px; cursor: pointer; padding: 8px 12px; transition: 0.2s;
        }
        .image-item button:hover { background: #e74c3c; color: #fff; }
        
        /* Превью стили */
        .preview-embed {
            background: #2b2d31; border-radius: 8px; border-left: 4px solid var(--gold);
            padding: 15px; color: #dbdee1; font-family: sans-serif; font-size: 14px; line-height: 1.4;
            word-wrap: break-word;
        }
        .preview-embed h2 { color: #fff; margin-top: 0; font-size: 18px; border-bottom: 1px solid #3f4147; padding-bottom: 8px; }
        .preview-embed p { margin: 8px 0; white-space: pre-wrap; }
        .preview-images { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .preview-images img { max-width: 100%; border-radius: 4px; max-height: 150px; object-fit: cover; }
        .preview-btn {
            display: inline-block; margin-top: 10px; padding: 8px 12px; background: #4e5058; color: #fff;
            text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold;
        }
        .preview-title { font-size: 16px; color: var(--gold); font-family: 'Cinzel', serif; margin-bottom: 10px; }
        
        .btn-loading { opacity: 0.7; cursor: wait !important; }
    </style>
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container" style="max-width: 1400px;"> <!-- Расширяем контейнер -->
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="btn-back">← К гайдам</a>
        </nav>

        <div class="page-title">
            <h1 id="page-title">✍️ Новый гайд</h1>
            <p>☯ Знания начинаются с первой главы</p>
        </div>

        <div class="editor-layout">
            <!-- ЛЕВАЯ ЧАСТЬ (Редактор) -->
            <div class="editor-main">
                <div class="panel">
                    <div class="panel-title"><span>Общая информация</span></div>
                    <div class="form-group">
                        <label>Название гайда *</label>
                        <input type="text" id="guide-name" placeholder="Например: ГВГ Полный гайд">
                    </div>
                    <div class="form-group">
                        <label>Краткое описание (для меню в Discord)</label>
                        <input type="text" id="guide-desc" placeholder="Тактики, сборки и советы">
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <span>Главы гайда</span>
                        <button type="button" class="btn btn-primary btn-small" onclick="addChapter()">+ Добавить главу</button>
                    </div>
                    <div id="chapters-container"></div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap;">
                    <button type="button" class="btn btn-primary" onclick="saveGuide()" id="btn-save" style="flex: 1; min-width: 200px; font-size: 16px; padding: 15px;">💾 Сохранить гайд</button>
                    <button type="button" class="btn btn-danger" onclick="deleteGuide()" id="btn-delete" style="display: none;">🗑 Удалить гайд</button>
                </div>
            </div>

            <!-- ПРАВАЯ ЧАСТЬ (Превью) -->
            <div class="editor-preview">
                <div class="preview-title">👁 Предпросмотр в Discord</div>
                <div id="preview-container">
                    <div class="preview-embed" style="opacity: 0.5; text-align: center;">
                        Начните вводить данные, чтобы увидеть превью...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Безопасный HTML
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        const pathParts = window.location.pathname.split('/');
        const guildId = pathParts[2];
        const guideId = pathParts[4];
        const isNew = guideId === 'new';

        const backLink = document.getElementById('btn-back');
        if (backLink) backLink.href = '/manage/' + guildId + '/guides';

        let isDirty = false;

        // Функция обновления превью
        function updatePreview() {
            const container = document.getElementById('preview-container');
            const chapters = document.querySelectorAll('#chapters-container .chapter-card');
            
            if (chapters.length === 0) {
                container.innerHTML = '<div class="preview-embed" style="opacity: 0.5; text-align: center;">Нет добавленных глав</div>';
                return;
            }

            let html = '';
            chapters.forEach(card => {
                const title = card.querySelector('.ch-title').value || 'Без названия';
                const content = card.querySelector('.ch-content').value || '*Пусто*';
                const color = card.querySelector('.ch-color').value || '#d4af37';
                const attachName = card.querySelector('.ch-attachment-name').value;
                const attachUrl = card.querySelector('.ch-attachment-url').value;
                
                // Собираем картинки
                const images = Array.from(card.querySelectorAll('.ch-image')).map(inp => inp.value.trim()).filter(Boolean);

                html += `
                    <div class="preview-embed" style="border-left-color: ${color}; margin-bottom: 20px;">
                        <h2>${escapeHtml(title)}</h2>
                        <p>${escapeHtml(content)}</p>
                        ${images.length > 0 ? `
                            <div class="preview-images">
                                ${images.map(img => `<img src="${escapeHtml(img)}" onerror="this.style.display='none'">`).join('')}
                            </div>
                        ` : ''}
                        ${attachUrl ? `<a href="${escapeHtml(attachUrl)}" target="_blank" class="preview-btn">🔗 ${escapeHtml(attachName || 'Вложение')}</a>` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Добавление поля для картинки
        function addImageField(container, val = '') {
            const div = document.createElement('div');
            div.className = 'image-item';
            div.innerHTML = `
                <input type="text" class="ch-image" value="${escapeHtml(val)}" placeholder="https://i.imgur.com/..." oninput="markDirty(); updatePreview();">
                <button type="button" onclick="this.parentElement.remove(); updatePreview();" title="Удалить">✖</button>
            `;
            container.appendChild(div);
        }

        function addChapter(data = {}, position) {
            const container = document.getElementById('chapters-container');
            const card = document.createElement('div');
            card.className = 'chapter-card';
            
            const d = {
                title: data.title || '',
                content: data.content || '',
                color: data.color || '#d4af37',
                images: data.images && data.images.length > 0 ? data.images : (data.imageUrl ? [data.imageUrl] : ['']),
                attachmentUrl: data.attachmentUrl || '',
                attachmentName: data.attachmentName || ''
            };

            // Создаем каркас
            card.innerHTML = `
                <div class="chapter-header">
                    <span class="ch-num">1.</span>
                    <span class="ch-preview">${escapeHtml(d.title || 'Без заголовка')}</span>
                    <div class="ch-actions">
                        <button type="button" class="ch-btn" title="Выше" onclick="event.stopPropagation(); moveChapter(this, -1)">↑</button>
                        <button type="button" class="ch-btn" title="Ниже" onclick="event.stopPropagation(); moveChapter(this, 1)">↓</button>
                        <button type="button" class="ch-btn" title="Дублировать" onclick="event.stopPropagation(); duplicateChapter(this)">📋</button>
                    </div>
                </div>
                <div class="chapter-body">
                    <div class="form-group">
                        <label>Заголовок главы</label>
                        <input type="text" class="ch-title" value="${escapeHtml(d.title)}" placeholder="Название главы" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Текст главы (Markdown)</label>
                        <textarea class="ch-content" style="min-height: 150px; line-height: 1.5;" placeholder="## Подзаголовок&#10;&#10;Ваш текст здесь..." oninput="updatePreview()">${escapeHtml(d.content)}</textarea>
                    </div>
                    <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 120px;">
                            <label>Цвет полосы</label>
                            <input type="color" class="ch-color" value="${d.color}" style="height: 45px; padding: 5px; cursor: pointer; width: 100%;" oninput="updatePreview()">
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top: 15px;">
                        <label>Изображения (URL)</label>
                        <div class="image-list"></div>
                        <button type="button" class="btn btn-secondary btn-small" onclick="addImageField(this.previousElementSibling); updatePreview();">+ Добавить картинку</button>
                    </div>

                    <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;">
                        <div class="form-group" style="flex: 2; min-width: 200px;">
                            <label>Ссылка на файл</label>
                            <input type="text" class="ch-attachment-url" value="${escapeHtml(d.attachmentUrl)}" placeholder="https://..." oninput="updatePreview()">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 120px;">
                            <label>Текст кнопки</label>
                            <input type="text" class="ch-attachment-name" value="${escapeHtml(d.attachmentName)}" placeholder="Скачать" oninput="updatePreview()">
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 15px;">
                        <button type="button" class="btn btn-danger btn-small" onclick="removeChapter(this)">🗑 Удалить главу</button>
                    </div>
                </div>
            `;

            // Обработчики
            card.querySelector('.chapter-header').addEventListener('click', (e) => {
                if (e.target.closest('.ch-btn')) return;
                card.classList.toggle('open');
            });

            card.querySelector('.ch-title').addEventListener('input', (e) => {
                card.querySelector('.ch-preview').textContent = e.target.value || 'Без заголовка';
            });

            // Заполняем картинки
            const imgList = card.querySelector('.image-list');
            d.images.forEach(img => addImageField(imgList, img));

            if (position !== undefined && container.children[position]) {
                container.insertBefore(card, container.children[position]);
            } else {
                container.appendChild(card);
            }

            if (container.children.length === 1) card.classList.add('open');
            
            renumberChapters();
            updatePreview();
        }

        // ... (функции renumberChapters, moveChapter, duplicateChapter, removeChapter остаются без изменений, добавляем только markDirty и updatePreview в нужные места)
        function markDirty() { isDirty = true; }

        function renumberChapters() {
            document.querySelectorAll('#chapters-container .chapter-card').forEach((card, i) => {
                card.querySelector('.ch-num').textContent = (i + 1) + '.';
                card.querySelector('.ch-btn[title="Выше"]').disabled = (i === 0);
                card.querySelector('.ch-btn[title="Ниже"]').disabled = (i === card.parentElement.children.length - 1);
            });
        }

        function moveChapter(btn, direction) {
            const card = btn.closest('.chapter-card');
            const container = card.parentElement;
            const idx = Array.from(container.children).indexOf(card);
            const target = idx + direction;
            if (target < 0 || target >= container.children.length) return;
            if (direction < 0) container.insertBefore(card, container.children[target]);
            else container.insertBefore(card, container.children[target].nextSibling);
            renumberChapters(); markDirty(); updatePreview();
        }

        function duplicateChapter(btn) {
            const card = btn.closest('.chapter-card');
            const data = {
                title: card.querySelector('.ch-title').value + ' (копия)',
                content: card.querySelector('.ch-content').value,
                color: card.querySelector('.ch-color').value,
                images: Array.from(card.querySelectorAll('.ch-image')).map(inp => inp.value),
                attachmentUrl: card.querySelector('.ch-attachment-url').value,
                attachmentName: card.querySelector('.ch-attachment-name').value
            };
            const idx = Array.from(card.parentElement.children).indexOf(card);
            addChapter(data, idx + 1);
            markDirty();
        }

        function removeChapter(btn) {
            if (!confirm('Удалить эту главу?')) return;
            btn.closest('.chapter-card').remove();
            renumberChapters(); markDirty(); updatePreview();
        }

         // Загрузка
        if (!isNew) {
            document.getElementById('page-title').innerHTML = '✍️ Редактирование гайда';
            document.getElementById('btn-delete').style.display = 'block';

            fetch('/api/guild/' + guildId + '/guides/' + guideId, { credentials: 'include' })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(guide => {
                    document.getElementById('guide-name').value = guide.name || '';
                    document.getElementById('guide-desc').value = guide.description || '';
                    
                    if (guide.chapters && guide.chapters.length > 0) {
                        guide.chapters.forEach(ch => addChapter(ch));
                    } else {
                        addChapter();
                    }
                    isDirty = false;
                    updatePreview();
                })
                .catch(err => alert('Ошибка загрузки гайда: ' + err.message));
        } else {
            addChapter();
            isDirty = false;
        }

        // Сбор данных при сохранении
        function saveGuide() {
            const name = document.getElementById('guide-name').value.trim();
            const description = document.getElementById('guide-desc').value.trim();
            const chapters = [];

            document.querySelectorAll('#chapters-container .chapter-card').forEach(card => {
                const images = Array.from(card.querySelectorAll('.ch-image'))
                    .map(inp => inp.value.trim())
                    .filter(Boolean); // Убираем пустые

                chapters.push({
                    title: card.querySelector('.ch-title').value.trim() || 'Без названия',
                    content: card.querySelector('.ch-content').value,
                    color: card.querySelector('.ch-color').value,
                    imageUrl: images[0] || '', // Для совместимости со старой моделью Discord
                    imageUrls: images,          // Новое поле (если модель его поддерживает)
                    attachmentUrl: card.querySelector('.ch-attachment-url').value.trim(),
                    attachmentName: card.querySelector('.ch-attachment-name').value.trim()
                });
            });

            if (!name) return alert('Введите название гайда!');
            if (chapters.length === 0) return alert('Добавьте хотя бы одну главу!');

            const method = isNew ? 'POST' : 'PUT';
            const url = isNew ? '/api/guild/' + guildId + '/guides' : '/api/guild/' + guildId + '/guides/' + guideId;

            const btn = document.getElementById('btn-save');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Сохранение...'; btn.disabled = true; btn.classList.add('btn-loading');

            fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ name, description, chapters })
            })
                .then(async res => {
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Ошибка сервера');
                    return data;
                })
                .then(data => {
                    isDirty = false;
                    btn.innerHTML = '✅ Сохранено!';
                    btn.style.background = '#2ecc71';
                    setTimeout(() => window.location.href = '/manage/' + guildId + '/guides', 1000);
                })
                .catch(err => {
                    alert('❌ Ошибка при сохранении: ' + err.message);
                    btn.innerHTML = originalText; btn.disabled = false; btn.classList.remove('btn-loading');
                });
        }

        function deleteGuide() {
            if (!confirm('Вы уверены, что хотите удалить этот гайд навсегда?')) return;
            const btn = document.getElementById('btn-delete');
            btn.innerHTML = '⏳ Удаление...'; btn.disabled = true;

            fetch('/api/guild/' + guildId + '/guides/' + guideId, { method: 'DELETE', credentials: 'include' })
                .then(res => {
                    if (!res.ok) throw new Error('Ошибка');
                    isDirty = false;
                    window.location.href = '/manage/' + guildId + '/guides';
                }).catch(() => {
                    alert('Не удалось удалить гайд');
                    btn.innerHTML = '🗑 Удалить гайд'; btn.disabled = false;
                });
        }

        document.addEventListener('input', () => { isDirty = true; });
        if (backLink) {
            backLink.addEventListener('click', (e) => {
                if (isDirty && !confirm('Вы не сохранили изменения. Выйти?')) e.preventDefault();
            });
        }
    </script>
</body>
</html>
