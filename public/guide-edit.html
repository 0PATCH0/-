<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор гайда — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="btn-back">← К гайдам</a>
        </nav>

        <div class="page-title">
            <h1 id="page-title">✍️ Новый гайд</h1>
            <p>☯ Знания начинаются с первой главы</p>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span>Общая информация</span>
            </div>
            <div class="form-group">
                <label>Название гайда *</label>
                <input type="text" id="guide-name" placeholder="Например: ГВГ Полный гайд">
            </div>
            <div class="form-group">
                <label>Краткое описание (для меню)</label>
                <input type="text" id="guide-desc" placeholder="Тактики, сборки и советы">
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span>Главы гайда</span>
                <button class="btn btn-primary btn-small" onclick="addChapter()">+ Добавить главу</button>
            </div>
            <div id="chapters-container"></div>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="saveGuide()" id="btn-save" style="flex: 1; min-width: 200px;">💾 Сохранить гайд</button>
            <button class="btn btn-danger" onclick="deleteGuide()" id="btn-delete" style="display: none;">🗑 Удалить гайд</button>
        </div>
    </div>

    <style>
        .chapter-card {
            background: linear-gradient(160deg, rgba(18, 22, 28, 0.9), rgba(10, 12, 16, 0.95));
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }
        .chapter-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .chapter-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
        }
        .chapter-header:hover { background: rgba(0,0,0,0.4); }
        .chapter-header .ch-num {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 14px;
            min-width: 24px;
        }
        .chapter-header .ch-preview {
            flex: 1;
            font-family: 'Cinzel', serif;
            color: var(--text-main);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chapter-header .ch-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .chapter-header .ch-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .chapter-header .ch-btn:hover { color: var(--gold); border-color: var(--gold); }
        .chapter-header .ch-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .chapter-body {
            display: none;
            padding: 16px;
            border-top: 1px solid rgba(212,175,55,0.1);
        }
        .chapter-card.open .chapter-body { display: block; }
    </style>

    <script>
        const pathParts = window.location.pathname.split('/');
        const guildId = pathParts[2];
        const guideId = pathParts[4];
        const isNew = guideId === 'new';

        const backLink = document.getElementById('btn-back');
        if (backLink) backLink.href = '/manage/' + guildId + '/guides';

        let isDirty = false;
        document.addEventListener('input', () => { isDirty = true; });
        if (backLink) {
            backLink.addEventListener('click', (e) => {
                if (isDirty && !confirm('Вы не сохранили изменения. Выйти?')) e.preventDefault();
            });
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[m]));
        }

        function addChapter(data = { title: '', content: '', color: '#d4af37', imageUrl: '', attachmentUrl: '', attachmentName: '' }, position) {
            const container = document.getElementById('chapters-container');
            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.innerHTML = `
                <div class="chapter-header">
                    <span class="ch-num">1.</span>
                    <span class="ch-preview">${escapeHtml(data.title || 'Без заголовка')}</span>
                    <div class="ch-actions">
                        <button class="ch-btn" title="Выше" onclick="event.stopPropagation(); moveChapter(this, -1)">↑</button>
                        <button class="ch-btn" title="Ниже" onclick="event.stopPropagation(); moveChapter(this, 1)">↓</button>
                        <button class="ch-btn" title="Дублировать" onclick="event.stopPropagation(); duplicateChapter(this)">📋</button>
                    </div>
                </div>
                <div class="chapter-body">
                    <div class="form-group">
                        <label>Заголовок главы</label>
                        <input type="text" class="ch-title" value="${escapeHtml(data.title || '')}" placeholder="Название главы">
                    </div>
                    <div class="form-group">
                        <label>Текст главы (поддерживает Markdown)</label>
                        <textarea class="ch-content" style="min-height: 120px;" placeholder="## Заголовок&#10;&#10;Текст...">${escapeHtml(data.content || '')}</textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Цвет главы</label>
                            <input type="color" class="ch-color" value="${data.color || '#d4af37'}" style="height: 45px; padding: 5px;">
                        </div>
                        <div class="form-group">
                            <label>Картинка (URL)</label>
                            <input type="text" class="ch-image" value="${escapeHtml(data.imageUrl || '')}" placeholder="https://...">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ссылка на вложение</label>
                            <input type="text" class="ch-attachment-url" value="${escapeHtml(data.attachmentUrl || '')}" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Текст кнопки</label>
                            <input type="text" class="ch-attachment-name" value="${escapeHtml(data.attachmentName || '')}" placeholder="Скачать PDF">
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
                        <button class="btn btn-danger btn-small" onclick="removeChapter(this)">🗑 Удалить главу</button>
                    </div>
                </div>
            `;

            // Открытие по клику на header
            card.querySelector('.chapter-header').addEventListener('click', (e) => {
                if (e.target.closest('.ch-btn')) return;
                card.classList.toggle('open');
            });

            // Обновление превью при вводе
            card.querySelector('.ch-title').addEventListener('input', (e) => {
                card.querySelector('.ch-preview').textContent = e.target.value || 'Без заголовка';
            });

            if (position !== undefined && container.children[position]) {
                container.insertBefore(card, container.children[position]);
            } else {
                container.appendChild(card);
            }

            if (container.children.length === 1) card.classList.add('open');
            renumberChapters();
        }

        function renumberChapters() {
            document.querySelectorAll('#chapters-container .chapter-card').forEach((card, i) => {
                const numEl = card.querySelector('.ch-num');
                if (numEl) numEl.textContent = (i + 1) + '.';
                // Дизейблим кнопки вверх/вниз на краях
                const upBtn = card.querySelector('.ch-btn[title="Выше"]');
                const downBtn = card.querySelector('.ch-btn[title="Ниже"]');
                if (upBtn) upBtn.disabled = (i === 0);
                if (downBtn) downBtn.disabled = (i === card.parentElement.children.length - 1);
            });
        }

        function moveChapter(btn, direction) {
            const card = btn.closest('.chapter-card');
            const container = card.parentElement;
            const idx = Array.from(container.children).indexOf(card);
            const target = idx + direction;
            if (target < 0 || target >= container.children.length) return;
            if (direction < 0) container.insertBefore(card, container.children[target]);
            else container.insertBefore(card, container.children[target].nextSibling);
            renumberChapters();
            isDirty = true;
        }

        function duplicateChapter(btn) {
            const card = btn.closest('.chapter-card');
            const data = {
                title: card.querySelector('.ch-title').value + ' (копия)',
                content: card.querySelector('.ch-content').value,
                color: card.querySelector('.ch-color').value,
                imageUrl: card.querySelector('.ch-image').value,
                attachmentUrl: card.querySelector('.ch-attachment-url').value,
                attachmentName: card.querySelector('.ch-attachment-name').value
            };
            const idx = Array.from(card.parentElement.children).indexOf(card);
            addChapter(data, idx + 1);
            isDirty = true;
        }

        function removeChapter(btn) {
            if (!confirm('Удалить эту главу?')) return;
            btn.closest('.chapter-card').remove();
            renumberChapters();
            isDirty = true;
        }

        // Загрузка
        if (!isNew) {
            document.getElementById('page-title').innerHTML = '✍️ Редактирование гайда';
            document.getElementById('btn-delete').style.display = 'block';

            fetch('/api/guild/' + guildId + '/guides/' + guideId, { credentials: 'include' })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(guide => {
                    document.getElementById('guide-name').value = guide.name || '';
                    document.getElementById('guide-desc').value = guide.description || '';
                    (guide.chapters || []).forEach(ch => addChapter(ch));
                    isDirty = false;
                })
                .catch(err => alert('Не удалось загрузить гайд: ' + err.message));
        } else {
            addChapter();
        }

        function saveGuide() {
            const name = document.getElementById('guide-name').value.trim();
            const description = document.getElementById('guide-desc').value.trim();
            const chapters = [];

            document.querySelectorAll('#chapters-container .chapter-card').forEach(card => {
                chapters.push({
                    title: card.querySelector('.ch-title').value.trim(),
                    content: card.querySelector('.ch-content').value,
                    color: card.querySelector('.ch-color').value,
                    imageUrl: card.querySelector('.ch-image').value.trim(),
                    attachmentUrl: card.querySelector('.ch-attachment-url').value.trim(),
                    attachmentName: card.querySelector('.ch-attachment-name').value.trim()
                });
            });

            if (!name) return alert('Введите название гайда!');
            if (chapters.length === 0) return alert('Добавьте хотя бы одну главу!');

            const method = isNew ? 'POST' : 'PUT';
            const url = isNew
                ? '/api/guild/' + guildId + '/guides'
                : '/api/guild/' + guildId + '/guides/' + guideId;

            const btn = document.getElementById('btn-save');
            btn.innerHTML = 'Сохранение...'; btn.disabled = true;

            fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ name, description, chapters })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('✅ Гайд сохранён!');
                        isDirty = false;
                        setTimeout(() => window.location.href = '/manage/' + guildId + '/guides', 500);
                    } else {
                        alert('❌ Ошибка: ' + (data.error || 'неизвестно'));
                        btn.innerHTML = '💾 Сохранить гайд'; btn.disabled = false;
                    }
                })
                .catch(() => {
                    alert('❌ Ошибка сети');
                    btn.innerHTML = '💾 Сохранить гайд'; btn.disabled = false;
                });
        }

        function deleteGuide() {
            if (!confirm('Удалить этот гайд навсегда?')) return;
            fetch('/api/guild/' + guildId + '/guides/' + guideId, {
                method: 'DELETE',
                credentials: 'include'
            }).then(() => {
                isDirty = false;
                window.location.href = '/manage/' + guildId + '/guides';
            });
        }
    </script>
</body>
</html>
