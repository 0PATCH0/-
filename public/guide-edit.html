<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование гайда</title>
    <link rel="stylesheet" href="/css/style.css?v=9">
    <script src="/js/ui.js"></script>
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"></a>
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard"><div class="icon icon-home"></div> К списку серверов</a>
            <hr style="border-color: var(--border); margin: 15px 0;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" class="active"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" id="nav-rr"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" id="nav-rem"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" id="nav-mod"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" id="nav-logs"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" id="nav-emb"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
                <h1 id="page-title"><div class="icon icon-pencil"></div> Создание гайда</h1>
                <a href="#" id="btn-back" class="btn btn-small"><div class="icon icon-arrow-left"></div> Назад</a>
            </div>
            
            <div class="form-card" style="margin-bottom: 20px;">
                <div class="form-group"><label>Название гайда</label><input type="text" id="guide-name" placeholder="Например: ГВГ Полный гайд"></div>
                <div class="form-group"><label>Краткое описание (для меню)</label><input type="text" id="guide-desc" placeholder="Например: Тактики, сборки и советы"></div>
            </div>

            <div class="header" style="margin-top: 40px; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="color: var(--gold); font-family: 'Georgia', serif;">Главы гайда</h2>
                <button class="btn btn-success btn-small" onclick="addChapter()"><div class="icon icon-plus"></div> Добавить главу</button>
            </div>
            <div id="chapters-container"></div>

            <div style="margin-top: 30px; display: flex; gap: 15px;">
                <button class="btn" onclick="saveGuide()" id="btn-save"><div class="icon icon-floppy-disk"></div> Сохранить гайд</button>
                <button class="btn btn-danger" onclick="deleteGuide()" id="btn-delete" style="display: none;"><div class="icon icon-trash"></div> Удалить гайд</button>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const guideId = window.location.pathname.split('/')[4]; 
        const isNew = guideId === 'new';

        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-logs': '/logs', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;
        
        // Защита от случайного выхода
        let isDirty = false;
        document.getElementById('btn-back').href = `/manage/${guildId}/guides`;
        document.getElementById('btn-back').addEventListener('click', (e) => {
            if (isDirty && !confirm('Вы не сохранили изменения. Выйти?')) e.preventDefault();
        });

        // Отслеживание изменений (для защиты)
        document.addEventListener('input', () => { isDirty = true; });

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => document.getElementById('server-name').innerText = data.name);

        function addChapter(data = { title: '', content: '', color: '#d4af37', imageUrl: '', attachmentUrl: '', attachmentName: '' }) {
            const container = document.getElementById('chapters-container');
            const block = document.createElement('div');
            block.className = 'form-card';
            block.style.marginBottom = '15px';
            block.style.position = 'relative';

            block.innerHTML = `
                <button class="btn btn-danger btn-small" style="position: absolute; top: 15px; right: 15px;" onclick="this.parentElement.remove()"><div class="icon icon-x"></div></button>
                <div class="form-group"><label>Заголовок главы</label><input type="text" class="ch-title" value="${data.title}"></div>
                <div class="form-group"><label>Текст (Поддерживает Markdown)</label><textarea class="ch-content" style="height: 120px;">${data.content}</textarea></div>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1;"><label>Цвет</label><input type="color" class="ch-color" value="${data.color}" style="height: 45px; padding: 5px;"></div>
                    <div class="form-group" style="flex: 2;"><label>Картинка (URL)</label><input type="text" class="ch-image" value="${data.imageUrl}" placeholder="https://..."></div>
                </div>
                <div style="display: flex; gap: 15px; flex-wrap: wrap; border-top: 1px dashed var(--border); padding-top: 15px; margin-top: 10px;">
                    <div class="form-group" style="flex: 2;"><label>Ссылка на файл (PDF, презентация)</label><input type="text" class="ch-attachment-url" value="${data.attachmentUrl}" placeholder="https://..."></div>
                    <div class="form-group" style="flex: 1;"><label>Текст кнопки</label><input type="text" class="ch-attachment-name" value="${data.attachmentName}" placeholder="Скачать PDF"></div>
                </div>
            `;
            container.appendChild(block);
        }

        if (!isNew) {
            document.getElementById('page-title').innerHTML = '<div class="icon icon-pencil"></div> Редактирование гайда';
            document.getElementById('btn-delete').style.display = 'block';
            fetch(`/api/guild/${guildId}/guides/${guideId}`).then(res => res.json()).then(guide => {
                document.getElementById('guide-name').value = guide.name;
                document.getElementById('guide-desc').value = guide.description || '';
                guide.chapters.forEach(ch => addChapter(ch));
                isDirty = false; // Сбрасываем флаг после загрузки
            });
        } else {
            addChapter();
        }

        function saveGuide() {
            const name = document.getElementById('guide-name').value;
            const description = document.getElementById('guide-desc').value;
            const chapters = [];

            document.querySelectorAll('#chapters-container .form-card').forEach(block => {
                chapters.push({
                    title: block.querySelector('.ch-title').value,
                    content: block.querySelector('.ch-content').value,
                    color: block.querySelector('.ch-color').value,
                    imageUrl: block.querySelector('.ch-image').value,
                    attachmentUrl: block.querySelector('.ch-attachment-url').value,
                    attachmentName: block.querySelector('.ch-attachment-name').value
                });
            });

            if (!name || chapters.length === 0) return showToast('Заполните название и добавьте хотя бы одну главу!', 'error');

            const method = isNew ? 'POST' : 'PUT';
            const url = isNew ? `/api/guild/${guildId}/guides` : `/api/guild/${guildId}/guides/${guideId}`;
            const btn = document.getElementById('btn-save');
            
            btn.innerHTML = 'Сохранение...'; btn.disabled = true;

            fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, description, chapters }) })
                .then(res => res.json()).then(data => {
                    if (data.success) {
                        showToast('Гайд сохранен!', 'success');
                        isDirty = false; // Сбрасываем флаг, чтобы можно было выйти
                        setTimeout(() => window.location.href = `/manage/${guildId}/guides`, 1000);
                    } else {
                        showToast('Ошибка: ' + data.error, 'error');
                        btn.innerHTML = '<div class="icon icon-floppy-disk"></div> Сохранить гайд'; btn.disabled = false;
                    }
                }).catch(() => {
                    showToast('Ошибка сети', 'error');
                    btn.innerHTML = '<div class="icon icon-floppy-disk"></div> Сохранить гайд'; btn.disabled = false;
                });
        }

        function deleteGuide() {
            if (!confirm('Удалить этот гайд навсегда?')) return;
            fetch(`/api/guild/${guildId}/guides/${guideId}`, { method: 'DELETE' }).then(() => {
                window.location.href = `/manage/${guildId}/guides`;
            });
        }
    </script>
</body>
</html>
