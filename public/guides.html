<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гайды</title>
    <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
    <div class="bg-particles"></div>
    <!-- КОНЕЦ БЛОКА С ФОНОМ -->

    <!-- Кнопка-печать "Главная" -->
    <a href="#" id="top-banner-link" class="top-banner"></a>
    
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>
    
    <div class="main-container">

    <a href="#" id="top-banner-link" class="top-banner"></a>
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard"><div class="icon icon-home"></div> К списку серверов</a>
            <hr style="border-color: var(--border); margin: 15px 0;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" class="active"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" id="nav-rr"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" id="nav-rem"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" id="nav-mod"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" id="nav-logs"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" id="nav-emb"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h1><div class="icon icon-book"></div> Гайды сервера</h1>
                <a href="#" id="btn-create" class="btn"><div class="icon icon-plus"></div> Создать гайд</a>
            </div>
            <div class="grid" id="guides-grid">
                <p style="color: var(--text-muted);">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-logs': '/logs', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;
        document.getElementById('btn-create').href = `/manage/${guildId}/guides/edit/new`;

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => document.getElementById('server-name').innerText = data.name);

        fetch(`/api/guild/${guildId}/guides`).then(res => res.json()).then(data => {
            const grid = document.getElementById('guides-grid');
            if (data.length === 0) return grid.innerHTML = '<p style="color: var(--text-muted);">Гайдов пока нет.</p>';
            
            grid.innerHTML = '';
            data.forEach(guide => {
                grid.innerHTML += `
                    <div class="card" style="border-left: 4px solid var(--gold); display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <h3 style="color: var(--gold);"><div class="icon icon-book"></div> ${guide.name}</h3>
                            <p style="margin-bottom: 15px;">${guide.description || 'Без описания'}</p>
                            <p style="font-size: 12px; color: var(--jade); margin-bottom: 15px;">Глав: ${guide.chapters.length}</p>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <a href="/manage/${guildId}/guides/edit/${guide._id}" class="btn btn-small" style="flex: 1;"><div class="icon icon-pencil"></div> Ред.</a>
                            <button class="btn btn-danger btn-small" onclick="deleteGuide('${guide._id}')"><div class="icon icon-trash"></div></button>
                        </div>
                    </div>
                `;
            });
        });

        function deleteGuide(id) {
            if (!confirm('Вы уверены, что хотите удалить этот гайд?')) return;
            fetch(`/api/guild/${guildId}/guides/${id}`, { method: 'DELETE' }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
