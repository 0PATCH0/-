<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гайды — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <pre id="debug" style="position:fixed; top:0; left:0; right:0; color:#e74c3c; background:#000; padding:6px 10px; font-size:11px; z-index:99999; margin:0; white-space:pre-wrap; display:none;"></pre>

    <div class="container" style="margin-top: 40px;">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в управление</a>
        </nav>

        <div class="page-title">
            <h1>📖 Гайды гильдии</h1>
            <p>☯ Знания, что передаются из поколения в поколение</p>
        </div>

        <div class="panel" id="error-panel" style="display:none;">
            <div class="empty-state" id="error-msg"></div>
        </div>

        <div style="text-align: center; margin-bottom: 30px;">
            <a href="#" id="btn-create" class="btn btn-primary">+ Создать гайд</a>
        </div>

        <div id="guides-grid" class="tiles">
            <div class="empty-state">Загрузка...</div>
        </div>
    </div>

    <style>
        .guide-tile {
            position: relative;
            overflow: hidden;
        }
        .guide-tile.has-cover {
            background-size: cover;
            background-position: center;
        }
        .guide-tile.has-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(6,8,10,0.3) 0%, rgba(6,8,10,0.95) 80%);
            z-index: 0;
        }
        .guide-tile > * { position: relative; z-index: 1; }
        .guide-cover-tag {
            display: inline-block;
            background: rgba(212,175,55,0.2);
            color: var(--gold);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 6px;
            border: 1px solid rgba(212,175,55,0.4);
        }
    </style>

    <script>
        const params = new URLSearchParams(window.location.search);
        const showDebug = params.get('debug') === '1';
        const dbg = document.getElementById('debug');
        if (showDebug) { dbg.style.display = 'block'; }
        function log(msg) { if (showDebug) dbg.textContent += msg + '\n'; }

        log('JS запущен');
        const guildId = window.location.pathname.split('/')[2];
        log('guildId: ' + guildId);

        const backLink = document.getElementById('back-link');
        if (backLink) backLink.href = '/manage/' + guildId;
        document.getElementById('btn-create').href = '/manage/' + guildId + '/guides/edit/new';

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function findCover(guide) {
            const chapters = guide.chapters || [];
            for (const ch of chapters) {
                if (ch.imageUrl && typeof ch.imageUrl === 'string' && ch.imageUrl.trim()) {
                    return ch.imageUrl.trim();
                }
            }
            return null;
        }

        function showError(msg) {
            document.getElementById('error-panel').style.display = 'block';
            document.getElementById('error-msg').textContent = msg;
            document.getElementById('guides-grid').innerHTML = '';
            log('ERROR: ' + msg);
        }

        async function loadGuides() {
            log('fetch /api/guild/.../guides');
            try {
                const res = await fetch('/api/guild/' + guildId + '/guides', { credentials: 'include' });
                log('  status: ' + res.status);
                if (res.status === 403) {
                    return showError('❌ У вас нет прав модератора на этом сервере.');
                }
                if (!res.ok) {
                    return showError('❌ Ошибка загрузки: HTTP ' + res.status);
                }
                const data = await res.json();
                log('  гайдов: ' + (data || []).length);
                render(data);
            } catch (e) {
                showError('❌ Ошибка: ' + e.message);
            }
        }

        function render(data) {
            const grid = document.getElementById('guides-grid');
            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="empty-state">Гайдов пока нет. Создайте первый!</div>';
                return;
            }
            grid.innerHTML = '';
            data.forEach(guide => {
                const chaptersCount = (guide.chapters || []).length;
                const date = guide.date ? new Date(guide.date).toLocaleDateString('ru-RU') : '—';
                const cover = findCover(guide);
                const preview = (guide.description || '').length > 120
                    ? guide.description.substring(0, 120) + '...'
                    : (guide.description || 'Без описания');

                const card = document.createElement('div');
                card.className = 'tile guide-tile' + (cover ? ' has-cover' : '');
                if (cover) {
                    card.style.backgroundImage = `url("${cover.replace(/"/g, '\\"')}")`;
                }
                card.innerHTML = `
                    ${cover ? '<span class="guide-cover-tag">📸 с обложкой</span>' : ''}
                    <span class="tile-icon">📖</span>
                    <span class="tile-title">${escapeHtml(guide.name || 'Без названия')}</span>
                    <span class="tile-desc">
                        ${escapeHtml(preview)}<br>
                        <span style="color:var(--text-muted);font-size:12px;">Глав: ${chaptersCount} • ${date}</span>
                    </span>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <a href="/manage/${guildId}/guides/edit/${guide._id}" class="btn btn-secondary btn-small" style="flex:1;">✏ Ред.</a>
                        <button class="btn btn-danger btn-small">🗑</button>
                    </div>
                `;
                card.querySelector('.btn-danger').onclick = (e) => {
                    e.preventDefault();
                    deleteGuide(guide._id);
                };
                grid.appendChild(card);
            });
            log('render: отрисовано ' + data.length);
        }

        function deleteGuide(id) {
            if (!confirm('Удалить этот гайд?')) return;
            fetch('/api/guild/' + guildId + '/guides/' + id, { method: 'DELETE', credentials: 'include' })
                .then(() => window.location.reload());
        }

        loadGuides();
    </script>
</body>
</html>
