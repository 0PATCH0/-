<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гайды</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-forest">
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="sidebar">
        <h2 id="server-name">Загрузка...</h2>
        <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;">← К списку серверов</a>
        <hr style="border-color: var(--border-color); margin-bottom: 20px;">
        <a href="#" id="nav-home">🏠 Обзор</a>
        <a href="#" id="nav-roster">🛡️ Состав гильдии</a>
        <a href="#" id="nav-rr">🎭 Роли по кнопкам</a>
        <a href="#" id="nav-rem">⏰ Напоминания</a>
        <a href="#" id="nav-mod">⚙️ Модерация</a>
        <a href="#" id="nav-emb">📨 Эмбеды</a>
        <a href="#" class="active">📖 Гайды</a>
        <a href="#" id="nav-logs">📜 Логи действий</a>
    </div>

    <div class="content">
        <div class="header">
            <h1>📖 Гайды сервера</h1>
            <a href="#" id="btn-create" class="btn">+ Создать гайд</a>
        </div>
        
        <div class="grid" id="guides-grid">
            <p style="color: var(--text-muted);">Загрузка...</p>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-emb': '/custom', 'nav-logs': '/logs'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;
        document.getElementById('btn-create').href = `/manage/${guildId}/guides/edit/new`;

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => document.getElementById('server-name').innerText = data.name);

        fetch(`/api/guild/${guildId}/guides`).then(res => res.json()).then(data => {
            const grid = document.getElementById('guides-grid');
            if (data.length === 0) return grid.innerHTML = '<p style="color: var(--text-muted);">Гайдов пока нет. Создайте первый!</p>';
            
            grid.innerHTML = '';
            data.forEach(guide => {
                grid.innerHTML += `
                    <div class="card" style="border-left: 4px solid var(--accent); display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <h3 style="color: var(--accent);">${guide.name}</h3>
                            <p style="margin-bottom: 15px;">${guide.description || 'Без описания'}</p>
                            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Глав: ${guide.chapters.length}</p>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <a href="/manage/${guildId}/guides/edit/${guide._id}" class="btn btn-small" style="flex: 1;">✏️ Редактировать</a>
                            <button class="btn btn-danger btn-small" onclick="deleteGuide('${guide._id}')">🗑️</button>
                        </div>
                    </div>
                `;
            });
        });

        function deleteGuide(id) {
            if (!confirm('Вы уверены, что хотите удалить этот гайд?')) return;
            fetch(`/api/guild/${guildId}/guides/${id}`, { method: 'DELETE' }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
