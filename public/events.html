<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>События — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 10px 20px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-family: 'Cinzel', serif; font-size: 16px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .event-card { background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .event-info h3 { margin: 0 0 5px 0; color: var(--gold); font-family: 'Cinzel', serif; }
        .event-meta { font-size: 14px; color: var(--text-muted); display: flex; gap: 15px; flex-wrap: wrap; }
        
        .event-form { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 200px; }
    </style>
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" onclick="history.back(); return false;">← Назад</a>
        </nav>

        <div class="page-title">
            <h1>📅 Календарь событий</h1>
            <p>Планируйте ГВГ, вечеринки и арены</p>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('events')">События</button>
            <button class="tab-btn" onclick="switchTab('settings')">Настройки</button>
        </div>

        <!-- Вкладка: События -->
        <div id="tab-events" class="tab-content active">
            <div class="event-form">
                <h3 style="margin-top: 0; color: var(--gold); font-family: 'Cinzel', serif;">Создать событие</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Название *</label>
                        <input type="text" id="ev-title" placeholder="ГВГ с гильдией X">
                    </div>
                    <div class="form-group">
                        <label>Тип</label>
                        <select id="ev-type">
                            <option value="ГВГ">ГВГ</option>
                            <option value="Вечеринка">Вечеринка</option>
                            <option value="Арена">Арена</option>
                            <option value="Рейд">Рейд</option>
                            <option value="Другое">Другое</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата и время</label>
                        <input type="datetime-local" id="ev-date">
                    </div>
                    <div class="form-group">
                        <label>Часовой пояс</label>
                        <select id="ev-tz">
                            <option value="3">МСК (UTC+3)</option>
                            <option value="0">UTC</option>
                            <option value="2">UTC+2</option>
                            <option value="4">UTC+4</option>
                            <option value="5">UTC+5</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="ev-desc" style="min-height: 80px;" placeholder="Детали события..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="createEvent()">Создать</button>
            </div>

            <h3 style="color: var(--gold); font-family: 'Cinzel', serif;">Предстоящие события</h3>
            <div id="events-list"></div>
        </div>

        <!-- Вкладка: Настройки -->
        <div id="tab-settings" class="tab-content">
            <div class="event-form">
                <h3 style="margin-top: 0; color: var(--gold); font-family: 'Cinzel', serif;">Настройки уведомлений</h3>
                <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">Бот будет присылать красивое сообщение с пингом роли за 5 минут до начала события.</p>
                
                <div class="form-group">
                    <label>Канал для анонсов</label>
                    <select id="set-channel"><option>Загрузка...</option></select>
                </div>
                <div class="form-group">
                    <label>Роль для пинга (тега)</label>
                    <select id="set-role"><option>Загрузка...</option></select>
                </div>
                <div class="form-group">
                    <label>Часовой пояс по умолчанию</label>
                    <select id="set-tz">
                        <option value="3">МСК (UTC+3)</option>
                        <option value="0">UTC</option>
                        <option value="2">UTC+2</option>
                        <option value="4">UTC+4</option>
                    </select>
                </div>
                
                <button class="btn btn-primary" onclick="saveSettings()">Сохранить настройки</button>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        let channelsData = { channels: [], roles: [] };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // Инициализация
        async function init() {
            // Загружаем каналы и роли
            try {
                const res = await fetch(`/api/guild/${guildId}/channels`, { credentials: 'include' });
                if (res.ok) {
                    channelsData = await res.json();
                    const chSelect = document.getElementById('set-channel');
                    chSelect.innerHTML = '<option value="">-- Не выбран --</option>' + 
                        channelsData.channels.map(c => `<option value="${c.id}">#${c.name}</option>`).join('');
                    
                    const roleSelect = document.getElementById('set-role');
                    roleSelect.innerHTML = '<option value="">-- Без тега --</option>' + 
                        channelsData.roles.map(r => `<option value="${r.id}">@${r.name}</option>`).join('');
                }
            } catch (e) { console.error('Ошибка загрузки каналов:', e); }

            // Загружаем настройки
            try {
                const res = await fetch(`/api/guild/${guildId}/event-settings`, { credentials: 'include' });
                if (res.ok) {
                    const set = await res.json();
                    if (set.eventChannelId) document.getElementById('set-channel').value = set.eventChannelId;
                    if (set.pingRoleId) document.getElementById('set-role').value = set.pingRoleId;
                    if (set.timezoneOffset !== undefined) document.getElementById('set-tz').value = set.timezoneOffset;
                }
            } catch (e) { console.error('Ошибка загрузки настроек:', e); }

            loadEvents();
        }

        async function loadEvents() {
            const list = document.getElementById('events-list');
            list.innerHTML = 'Загрузка...';
            try {
                const res = await fetch(`/api/events/${guildId}`, { credentials: 'include' });
                const events = await res.json();
                
                if (events.length === 0) {
                    list.innerHTML = '<p>Пока нет событий.</p>';
                    return;
                }

                list.innerHTML = events.map(ev => {
                    const d = new Date(ev.date);
                    const dateStr = d.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                    return `
                        <div class="event-card">
                            <div class="event-info">
                                <h3>${ev.title}</h3>
                                <div class="event-meta">
                                    <span>🏷️ ${ev.type || 'Другое'}</span>
                                    <span>🕒 ${dateStr}</span>
                                    <span>👥 ${ev.attendees.length} участников</span>
                                </div>
                            </div>
                            <button class="btn btn-danger btn-small" onclick="deleteEvent('${ev._id}')">Удалить</button>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = 'Ошибка загрузки: ' + e.message;
            }
        }

        async function createEvent() {
            const title = document.getElementById('ev-title').value.trim();
            const dateStr = document.getElementById('ev-date').value;
            const type = document.getElementById('ev-type').value;
            const tz = document.getElementById('ev-tz').value;
            const description = document.getElementById('ev-desc').value.trim();

            if (!title || !dateStr) return alert('Заполните название и время!');

            // Парсим дату как локальную, но переводим в Unix timestamp
            // Учитываем выбранный часовой пояс
            const date = new Date(dateStr);
            // Нужно скорректировать на часовой пояс, чтобы дата была правильной
            const utcTimestamp = date.getTime() - (date.getTimezoneOffset() * 60000) - (Number(tz) * 3600000);

            const res = await fetch(`/api/events/${guildId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ title, description, type, date: utcTimestamp, timezoneOffset: Number(tz) })
            });
            
            if (res.ok) {
                alert('Событие создано!');
                document.getElementById('ev-title').value = '';
                document.getElementById('ev-desc').value = '';
                loadEvents();
            } else {
                const data = await res.json();
                alert('Ошибка: ' + (data.error || 'неизвестно'));
            }
        }

        async function deleteEvent(id) {
            if (!confirm('Удалить событие?')) return;
            await fetch(`/api/events/${guildId}/${id}`, { method: 'DELETE', credentials: 'include' });
            loadEvents();
        }

        async function saveSettings() {
            const eventChannelId = document.getElementById('set-channel').value;
            const pingRoleId = document.getElementById('set-role').value;
            const timezoneOffset = Number(document.getElementById('set-tz').value);

            const res = await fetch(`/api/guild/${guildId}/event-settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ eventChannelId, pingRoleId, timezoneOffset })
            });

            if (res.ok) alert('Настройки сохранены!');
            else alert('Ошибка сохранения');
        }

        init();
    </script>
</body>
</html>
