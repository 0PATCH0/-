<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>События — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
    <div class="container">
        <h1>📅 Календарь событий</h1>
        
        <div class="panel" style="padding: 20px; margin-top: 20px;">
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="ev-title" value="Тест" style="width: 100%; padding: 10px;">
            </div>
            <!-- Кнопка вызывает функцию с принудительным алертом -->
            <button type="button" class="btn btn-primary" onclick="alert('Кнопка нажата!'); createEvent();" style="margin-top: 15px; padding: 15px 30px;">
                СОЗДАТЬ (ТЕСТ)
            </button>
        </div>

        <div id="events-list" style="margin-top: 20px;">События не загружены</div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];

        async function createEvent() {
            alert('Функция createEvent начала работу. Сейчас отправлю на сервер.');
            
            const title = document.getElementById('ev-title').value.trim();
            
            try {
                const res = await fetch('/api/events/' + guildId, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        title: title, 
                        description: 'Тестовое описание', 
                        date: Date.now(), 
                        type: 'Другое' 
                    })
                });

                const text = await res.text();
                
                if (res.ok) {
                    alert('✅ УСПЕХ! Сервер создал событие.');
                } else {
                    alert('❌ ОШИБКА СЕРВЕРА:\nСтатус: ' + res.status + '\nОтвет: ' + text);
                }
            } catch (e) {
                alert('❌ ОШИБКА СЕТИ: ' + e.message);
            }
        }
    </script>
</body>
</html>
