<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь событий — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 12px 24px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-family: 'Cinzel', serif; font-size: 16px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .event-card { background: rgba(18, 22, 28, 0.8); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .event-info h3 { margin: 0 0 5px 0; color: var(--gold); font-family: 'Cinzel', serif; }
        .event-meta { font-size: 14px; color: #ccc; display: flex; gap: 15px; flex-wrap: wrap; }
        
        .event-form { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-family: 'Marcellus', serif; }
        .hidden { display: none !important; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); }
        .btn-create { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--gold), #aa8624); color: #000; border: none; border-radius: 8px; font-family: 'Cinzel', serif; font-weight: bold; font-size: 16px; cursor: pointer; }
        .status-msg { margin-top: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container" style="max-width: 1000px; margin: 0 auto;">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" onclick="history.back(); return false;">← Назад</a>
        </nav>

        <div class="page-title">
            <h1>📅 Календарь событий</h1>
        </div>

        <div class="tabs-nav">
            <button type="button" class="tab-btn active" onclick="switchTab('events', this)">События</button>
            <button type="button" class="tab-btn" onclick="switchTab('settings', this)">Настройки</button>
        </div>

        <!-- Вкладка: События -->
        <div id="tab-events" class="tab-content active">
            <div class="event-form">
                <h3 style="margin-top: 0; color: var(--gold);">Создать событие</h3>
                <form action="/api/events/1482704899739975803" method="POST" id="eventForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Название *</label>
                            <input type="text" name="title" required>
                        </div>
                        <div class="form-group">
                            <label>Тип</label>
                            <select name="type">
                                <option value="ГВГ">ГВГ</option>
                                <option value="Вечеринка">Вечеринка</option>
                                <option value="Арена">Арена</option>
                                <option value="Другое">Другое</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Режим</label>
                            <select name="mode" id="modeSelect" onchange="toggleRecurrence()">
                                <option value="none">Разовое</option>
                                <option value="daily">Ежедневное</option>
                                <option value="weekly">Еженедельное</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Часовой пояс</label>
                            <select name="timezoneOffset">
                                <option value="3">МСК (UTC+3)</option>
                                <option value="0">UTC</option>
                            </select>
                        </div>
                    </div>

                    <div id="recurrence-fields" class="hidden">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Время начала (HH:MM)</label>
                                <input type="time" name="timeOfDay" value="20:00">
                            </div>
                            <div id="weekly-days" class="form-group hidden">
                                <label>Дни недели</label>
                                <select multiple name="recurrenceDaysList" style="height: 100px;">
                                    <option value="1">Пн</option>
                                    <option value="2">Вт</option>
                                    <option value="3">Ср</option>
                                    <option value="4">Чт</option>
                                    <option value="5">Пт</option>
                                    <option value="6">Сб</option>
                                    <option value="0">Вс</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <input type="hidden" name="isRecurring" id="h_isRecurring" value="false">
                    <input type="hidden" name="recurrenceType" id="h_recurrenceType" value="none">
                    <input type="hidden" name="recurrenceDays" id="h_recurrenceDays" value="[]">

                    <div id="date-field" class="form-group" style="margin-bottom: 15px;">
                        <label>Дата и время (для разового)</label>
                        <input type="datetime-local" name="date">
                    </div>

                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>Описание</label>
                        <textarea name="description" style="min-height: 80px;"></textarea>
                    </div>
                    
                    <!-- ВАЖНО: onsubmit срабатывает ДО отправки, чтобы успеть собрать данные -->
                    <button type="submit" class="btn-create" onsubmit="prepareForm()">✅ Создать событие</button>
                </form>
            </div>

            <h3 style="color: var(--gold);">Список событий</h3>
            <div id="events-list"><div class="empty-state">Загрузка...</div></div>
        </div>

        <!-- Вкладка: Настройки -->
        <div id="tab-settings" class="tab-content">
            <div class="event-form">
                <h3 style="margin-top: 0; color: var(--gold);">Настройки уведомлений</h3>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Канал</label>
                    <select id="set-channel"><option>Загрузка...</option></select>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Роль</label>
                    <select id="set-role"><option>Загрузка...</option></select>
                </div>
                <button type="button" class="btn-create" onclick="saveSettings()">💾 Сохранить</button>
                <div id="settings-status" class="status-msg"></div>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function toggleRecurrence() {
            const mode = document.getElementById('modeSelect').value;
            const recurFields = document.getElementById('recurrence-fields');
            const dateField = document.getElementById('date-field');
            const weeklyDays = document.getElementById('weekly-days');

            document.getElementById('h_isRecurring').value = (mode !== 'none').toString();
            document.getElementById('h_recurrenceType').value = mode;

            if (mode === 'none') {
                recurFields.classList.add('hidden');
                dateField.classList.remove('hidden');
            } else {
                recurFields.classList.remove('hidden');
                dateField.classList.add('hidden');
                if (mode === 'weekly') weeklyDays.classList.remove('hidden');
                else weeklyDays.classList.add('hidden');
            }
        }

        // Собираем данные из формы ПЕРЕД отправкой
        document.getElementById('eventForm').onsubmit = function(e) {
            // 1. Собираем дни недели (если выбраны)
            const days = [];
            const selectDays = document.querySelector('select[name="recurrenceDaysList"]');
            if (selectDays) {
                for (let i = 0; i < selectDays.options.length; i++) {
                    if (selectDays.options[i].selected) days.push(Number(selectDays.options[i].value));
                }
            }
            document.getElementById('h_recurrenceDays').value = JSON.stringify(days);

            // 2. Переводим дату из локального формата в UTC (timestamp)
            const dateInput = document.querySelector('input[name="date"]');
            if (dateInput && dateInput.value) {
                const d = new Date(dateInput.value);
                dateInput.value = d.getTime();
            }
            return true; // Разрешаем отправку
        };

        // === ЗАГРУЗКА СПИСКА СОБЫТИЙ ===
        function loadEvents() {
            fetch('/api/events/' + guildId + '?t=' + Date.now())
                .then(res => res.json())
                .then(events => {
                    const list = document.getElementById('events-list');
                    if (!events || events.length === 0) {
                        list.innerHTML = '<div class="empty-state">Нет событий.</div>';
                        return;
                    }
                    let html = '';
                    events.forEach(ev => {
                        let timeStr = 'Время не указано';
                        if (ev.isRecurring) {
                            if (ev.recurrenceType === 'daily') timeStr = `Ежедневно в ${ev.timeOfDay || '20:00'}`;
                            else if (ev.recurrenceType === 'weekly') timeStr = `Еженедельно в ${ev.timeOfDay || '20:00'}`;
                        } else if (ev.date) {
                            timeStr = new Date(ev.date).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                        }
                        html += `<div class="event-card">
                            <div class="event-info">
                                <h3>${ev.title}</h3>
                                <div class="event-meta">⏰ ${timeStr}</div>
                            </div>
                            <button class="btn btn-danger btn-small" onclick="deleteEvent('${ev._id}')">Удалить</button>
                        </div>`;
                    });
                    list.innerHTML = html;
                })
                .catch(() => {
                    document.getElementById('events-list').innerHTML = '<div class="empty-state" style="color: red;">Ошибка загрузки.</div>';
                });
        }

        // === ЗАГРУЗКА НАСТРОЕК ===
        function loadSettings() {
            fetch('/api/event-channels/' + guildId)
                .then(res => res.json())
                .then(data => {
                    let chHtml = '<option value="">-- Не выбран --</option>';
                    let roleHtml = '<option value="">-- Без тега --</option>';
                    if (data.channels) data.channels.forEach(c => chHtml += `<option value="${c.id}">#${c.name}</option>`);
                    if (data.roles) data.roles.forEach(r => roleHtml += `<option value="${r.id}">@${r.name}</option>`);
                    document.getElementById('set-channel').innerHTML = chHtml;
                    document.getElementById('set-role').innerHTML = roleHtml;
                })
                .then(() => {
                    // Только после заполнения каналов загружаем сохраненные настройки
                    return fetch('/api/guild/' + guildId + '/event-settings');
                })
                .then(res => res.json())
                .then(set => {
                    if (set.eventChannelId) document.getElementById('set-channel').value = set.eventChannelId;
                    if (set.pingRoleId) document.getElementById('set-role').value = set.pingRoleId;
                })
                .catch(err => console.error(err));
        }

        function deleteEvent(id) {
            if (!confirm('Удалить событие?')) return;
            fetch('/api/events/' + guildId + '/' + id, { method: 'DELETE' }).then(() => location.reload());
        }

        function saveSettings() {
            const ch = document.getElementById('set-channel').value;
            const role = document.getElementById('set-role').value;
            const statusDiv = document.getElementById('settings-status');
            
            if (!ch) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Выберите канал!';
                return;
            }

            statusDiv.style.color = '#aaa';
            statusDiv.textContent = 'Сохранение...';

            fetch('/api/guild/' + guildId + '/event-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventChannelId: ch, pingRoleId: role })
            })
            .then(r => {
                if (r.ok) {
                    statusDiv.style.color = '#2ecc71';
                    statusDiv.textContent = '✅ Сохранено!';
                } else {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = '❌ Ошибка.';
                }
            })
            .catch(() => {
                statusDiv.style.color = 'red';
                statusDiv.textContent = '❌ Ошибка сети.';
            });
        }

        // Запуск
        window.onload = function() {
            loadEvents();
            loadSettings();
        };
    </script>
</body>
</html>
