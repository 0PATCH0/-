<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>События — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        .event-card { background: rgba(18, 22, 28, 0.8); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .event-info h3 { margin: 0 0 5px 0; color: var(--gold); }
        .event-meta { font-size: 14px; color: #ccc; display: flex; gap: 15px; }
        .event-form { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 4px; }
        .hidden { display: none !important; }
        .btn { padding: 10px 20px; background: var(--gold); color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="admin-page">
    <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
        <h1 style="color: var(--gold);">📅 Календарь событий</h1>
        
        <div class="event-form">
            <h3 style="color: var(--gold);">Создать событие</h3>
            <form id="createForm">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="ev-title" required>
                </div>
                <div class="form-group">
                    <label>Режим</label>
                    <select id="ev-mode" onchange="toggleMode()">
                        <option value="single">Разовое</option>
                        <option value="daily">Ежедневное</option>
                        <option value="weekly">Еженедельное</option>
                    </select>
                </div>
                
                <!-- Блок для разового -->
                <div id="block-single">
                    <div class="form-group">
                        <label>Дата и время</label>
                        <input type="datetime-local" id="ev-date">
                    </div>
                </div>

                <!-- Блок для циклических -->
                <div id="block-recurring" class="hidden">
                    <div class="form-group">
                        <label>Время (HH:MM)</label>
                        <input type="time" id="ev-time" value="20:00">
                    </div>
                    <div id="block-weekly" class="hidden">
                        <div class="form-group">
                            <label>Дни недели</label>
                            <select id="ev-days" multiple style="height: 100px;">
                                <option value="1">Пн</option>
                                <option value="2">Вт</option>
                                <option value="3">Ср</option>
                                <option value="4">Чт</option>
                                <option value="5">Пт</option>
                                <option value="6">Сб</option>
                                <option value="0">Вс</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn">Создать</button>
            </form>
        </div>

        <h3 style="color: var(--gold);">Список событий</h3>
        <div id="events-list"></div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];

        function toggleMode() {
            const mode = document.getElementById('ev-mode').value;
            const blockSingle = document.getElementById('block-single');
            const blockRecurring = document.getElementById('block-recurring');
            const blockWeekly = document.getElementById('block-weekly');

            if (mode === 'single') {
                blockSingle.classList.remove('hidden');
                blockRecurring.classList.add('hidden');
            } else {
                blockSingle.classList.add('hidden');
                blockRecurring.classList.remove('hidden');
                if (mode === 'weekly') blockWeekly.classList.remove('hidden');
                else blockWeekly.classList.add('hidden');
            }
        }

        document.getElementById('createForm').onsubmit = async (e) => {
            e.preventDefault();
            const mode = document.getElementById('ev-mode').value;
            
            const payload = {
                title: document.getElementById('ev-title').value,
                type: 'Другое',
                isRecurring: mode !== 'single',
                date: Date.now(), // По умолчанию
                timeOfDay: '20:00'
            };

            if (mode === 'single') {
                const d = document.getElementById('ev-date').value;
                if (!d) return alert('Выберите дату');
                payload.date = new Date(d).getTime();
            } else {
                payload.recurrenceType = mode;
                payload.timeOfDay = document.getElementById('ev-time').value;
                if (mode === 'weekly') {
                    const days = [];
                    const select = document.getElementById('ev-days');
                    for (let opt of select.options) {
                        if (opt.selected) days.push(Number(opt.value));
                    }
                    payload.recurrenceDays = days;
                }
            }

            const res = await fetch('/api/events/' + guildId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                alert('Создано!');
                document.getElementById('createForm').reset();
                loadEvents();
            } else {
                alert('Ошибка');
            }
        };

        async function loadEvents() {
            const res = await fetch('/api/events/' + guildId);
            const events = await res.json();
            const list = document.getElementById('events-list');
            
            if (!events || events.length === 0) {
                list.innerHTML = '<p>Нет событий</p>';
                return;
            }

            let html = '';
            events.forEach(ev => {
                let timeStr = ev.isRecurring ? `${ev.timeOfDay}` : new Date(ev.date).toLocaleString();
                html += `<div class="event-card">
                    <div class="event-info">
                        <h3>${ev.title}</h3>
                        <div class="event-meta">⏰ ${timeStr}</div>
                    </div>
                    <button onclick="fetch('/api/events/${guildId}/${ev._id}', {method:'DELETE'}).then(()=>loadEvents())" class="btn" style="background:red;">Удалить</button>
                </div>`;
            });
            list.innerHTML = html;
        }

        window.onload = loadEvents;
    </script>
</body>
</html>
