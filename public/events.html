<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест создания события</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
    <div class="container" style="padding: 20px;">
        <h1>📅 Создание события</h1>
        <p>Введите название и нажмите кнопку. Это обычная HTML-форма, без JavaScript.</p>
        
        <!-- Форма отправляет POST запрос на сервер -->
        <form action="/api/events/1482704899739975803" method="POST" style="margin-top: 20px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Название события:</label>
                <!-- Атрибут name="title" критически важен! -->
                <input type="text" name="title" value="Событие через форму" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid var(--border); background: #000; color: #fff;">
            </div>
            
            <!-- Скрытые поля, чтобы сервер их принял -->
            <input type="hidden" name="date" value="1730000000000">
            <input type="hidden" name="type" value="Другое">
            <input type="hidden" name="description" value="Создано через HTML-форму">
            
            <button type="submit" class="btn btn-primary" style="padding: 15px 30px; font-size: 16px;">
                🚀 ОТПРАВИТЬ НА СЕРВЕР
            </button>
        </form>
    </div>
</body>
</html>
