<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>События</title>
    <link rel="stylesheet" href="/css/style.css?v=22">
</head>
<body>
    <a href="#" id="top-banner-link" class="top-banner"></a>
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard"><div class="icon icon-home"></div> К списку серверов</a>
            <hr style="border-color: var(--border); margin: 15px 0;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" class="active"><div class="icon icon-alarm"></div> События</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-alarm"></div> События гильдии</h1></div>
            <div class="form-card">
                <h3 style="color: var(--gold); margin-bottom: 15px;">Создать событие</h3>
                <div class="form-group"><label>Название</label><input type="text" id="ev-title" placeholder="Например: ГВГ"></div>
                <div class="form-group"><label>Описание</label><textarea id="ev-desc" style="height: 80px;"></textarea></div>
                <div class="form-group"><label>Дата и время</label><input type="datetime-local" id="ev-date"></div>
                <button class="btn" onclick="createEvent()">Создать</button>
            </div>
            <div class="grid" id="events-list" style="margin-top: 20px;">
                <p style="color: var(--text-muted);">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;
        document.getElementById('nav-home').href = `/manage/${guildId}`;

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => document.getElementById('server-name').innerText = data.name);

        function loadEvents() {
            fetch(`/api/guild/${guildId}/events`).then(res => res.json()).then(data => {
                const list = document.getElementById('events-list');
                if (data.length === 0) return list.innerHTML = '<p style="color: var(--text-muted);">Событий пока нет.</p>';
                
                list.innerHTML = '';
                data.forEach(ev => {
                    const dateObj = new Date(ev.date);
                    const dateStr = dateObj.toLocaleString('ru-RU');
                    const isPast = ev.date < Date.now();
                    
                    list.innerHTML += `
                        <div class="card" style="border-left: 4px solid ${isPast ? '#555' : 'var(--gold)'}; opacity: ${isPast ? '0.6' : '1'};">
                            <h3 style="color: var(--gold);">${ev.title}</h3>
                            <p style="color: var(--jade); font-weight: bold;">${dateStr}</p>
                            <p style="margin: 10px 0; color: var(--text-muted);">${ev.description || 'Без описания'}</p>
                            <button class="btn btn-danger btn-small" onclick="deleteEvent('${ev._id}')">Удалить</button>
                        </div>
                    `;
                });
            });
        }
        loadEvents();

        function createEvent() {
            const title = document.getElementById('ev-title').value;
            const desc = document.getElementById('ev-desc').value;
            const dateStr = document.getElementById('ev-date').value;
            
            if (!title || !dateStr) return alert('Заполните название и дату!');
            const date = new Date(dateStr).getTime();

            fetch(`/api/guild/${guildId}/events`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, description: desc, date })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    document.getElementById('ev-title').value = '';
                    document.getElementById('ev-desc').value = '';
                    loadEvents();
                }
            });
        }

        function deleteEvent(id) {
            if (!confirm('Удалить событие?')) return;
            fetch(`/api/guild/${guildId}/events/${id}`, { method: 'DELETE' }).then(() => loadEvents());
        }
    </script>
</body>
</html>
