<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>События — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 10px 20px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-family: 'Cinzel', serif; font-size: 16px; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab-btn:hover { color: var(--gold); }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .event-card { background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; transition: 0.2s; }
        .event-card:hover { border-color: rgba(212, 175, 55, 0.5); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .event-info h3 { margin: 0 0 5px 0; color: var(--gold); font-family: 'Cinzel', serif; }
        .event-meta { font-size: 14px; color: var(--text-muted); display: flex; gap: 15px; flex-wrap: wrap; }
        .event-meta span { display: flex; align-items: center; gap: 5px; }
        
        .event-form { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 200px; }
        
        .days-grid { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
        .day-checkbox { position: relative; }
        .day-checkbox input { position: absolute; opacity: 0; }
        .day-checkbox label { display: inline-block; padding: 8px 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-muted); transition: 0.2s; }
        .day-checkbox input:checked + label { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }
        
        .hidden { display: none !important; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" onclick="history.back(); return false;">← Назад</a>
        </nav>

        <div class="page-title">
            <h1>📅 Календарь событий</h1>
            <p>Планируйте ГВГ, вечеринки и арены</p>
        </div>

        <div class="tabs-nav">
            <button type="button" class="tab-btn active" onclick="switchTab('events', this)">События</button>
            <button type="button" class="tab-btn" onclick="switchTab('settings', this)">Настройки</button>
        </div>

        <!-- Вкладка: События -->
        <div id="tab-events" class="tab-content active">
            <div class="event-form">
                <h3 style="margin-top: 0; color: var(--gold); font-family: 'Cinzel', serif;">Добавить событие</h3>
                
                <!-- Форма отправляется нативно, это гарантирует работу на любом телефоне -->
                <form action="/api/events/1482704899739975803" method="POST" id="eventForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Название *</label>
                            <input type="text" name="title" required placeholder="ГВГ с гильдией X">
                        </div>
                        <div class="form-group">
                            <label>Тип</label>
                            <select name="type">
                                <option value="ГВГ">⚔️ ГВГ</option>
                                <option value="Вечеринка">🎉 Вечеринка</option>
                                <option value="Арена">🏟️ Арена</option>
                                <option value="Рейд">🐉 Рейд</option>
                                <option value="Другое">📌 Другое</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Режим</label>
                            <select name="mode" id="modeSelect" onchange="toggleRecurrence()">
                                <option value="none">Разовое</option>
                                <option value="daily">Ежедневное</option>
                                <option value="weekly">Еженедельное</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Часовой пояс</label>
                            <select name="timezoneOffset">
                                <option value="3">МСК (UTC+3)</option>
                                <option value="0">UTC</option>
                                <option value="2">UTC+2</option>
                                <option value="4">UTC+4</option>
                            </select>
                        </div>
                    </div>

                    <div id="recurrence-fields" class="hidden">
                        <div class="form-group">
                            <label>Время начала (HH:MM)</label>
                            <input type="time" name="timeOfDay" value="20:00">
                        </div>
                        <div id="weekly-days" class="hidden">
                            <label>Дни недели</label>
                            <div class="days-grid">
                                <div class="day-checkbox"><input type="checkbox" id="d1" value="1" class="day-cb"><label for="d1">Пн</label></div>
                                <div class="day-checkbox"><input type="checkbox" id="d2" value="2" class="day-cb"><label for="d2">Вт</label></div>
                                <div class="day-checkbox"><input type="checkbox" id="d3" value="3" class="day-cb"><label for="d3">Ср</label></div>
                                <div class="day-checkbox"><input type="checkbox" id="d4" value="4" class="day-cb"><label for="d4">Чт</label></div>
                                <div class="day-checkbox"><input type="checkbox" id="d5" value="5" class="day-cb"><label for="d5">Пт</label></div>
                                <div class="day-checkbox"><input type="checkbox" id="d6" value="6" class="day-cb"><label for="d6">Сб</label></div>
                                <div class="day-checkbox"><input type="checkbox" id="d0" value="0" class="day-cb"><label for="d0">Вс</label></div>
                            </div>
                        </div>
                    </div>

                    <input type="hidden" name="isRecurring" id="h_isRecurring" value="false">
                    <input type="hidden" name="recurrenceType" id="h_recurrenceType" value="none">
                    <input type="hidden" name="recurrenceDays" id="h_recurrenceDays" value="[]">

                    <div id="date-field" class="form-group">
                        <label>Дата и время (для разового)</label>
                        <input type="datetime-local" name="date">
                    </div>

                    <div class="form-group">
                        <label>Описание</label>
                        <textarea name="description" style="min-height: 80px;" placeholder="Детали события..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" onclick="prepareForm()" style="margin-top: 15px; font-size: 16px; padding: 12px 25px;">✅ Создать событие</button>
                </form>
            </div>

            <h3 style="color: var(--gold); font-family: 'Cinzel', serif;">Список событий</h3>
            <div id="events-list"><div class="empty-state">Загрузка...</div></div>
        </div>

        <!-- Вкладка: Настройки -->
        <div id="tab-settings" class="tab-content">
            <div class="event-form">
                <h3 style="margin-top: 0; color: var(--gold); font-family: 'Cinzel', serif;">Настройки уведомлений</h3>
                <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">Бот будет присылать сообщение с тегом роли ровно в момент начала события.</p>
                
                <div class="form-group">
                    <label>Канал для анонсов</label>
                    <select id="set-channel"><option>Загрузка...</option></select>
                </div>
                <div class="form-group">
                    <label>Роль для пинга (тега)</label>
                    <select id="set-role"><option>Загрузка...</option></select>
                </div>
                
                <button type="button" class="btn btn-primary" onclick="saveSettings()" style="margin-top: 10px;">💾 Сохранить настройки</button>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];

        // Переключение вкладок
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // Переключение режимов (Разовое/Ежедневное/Еженедельное)
        function toggleRecurrence() {
            const mode = document.getElementById('modeSelect').value;
            const recurFields = document.getElementById('recurrence-fields');
            const dateField = document.getElementById('date-field');
            const weeklyDays = document.getElementById('weekly-days');

            document.getElementById('h_isRecurring').value = (mode !== 'none').toString();
            document.getElementById('h_recurrenceType').value = mode;

            if (mode === 'none') {
                recurFields.classList.add('hidden');
                dateField.classList.remove('hidden');
            } else {
                recurFields.classList.remove('hidden');
                dateField.classList.add('hidden');
                if (mode === 'weekly') weeklyDays.classList.remove('hidden');
                else weeklyDays.classList.add('hidden');
            }
        }

        // Сбор выбранных дней перед отправкой
        function prepareForm() {
            const days = [];
            document.querySelectorAll('.day-cb:checked').forEach(cb => {
                days.push(Number(cb.value));
            });
            document.getElementById('h_recurrenceDays').value = JSON.stringify(days);
            
            // Если разовое, переводим дату из локального формата в timestamp
            const dateInput = document.querySelector('input[name="date"]');
            if (dateInput && dateInput.value) {
                const d = new Date(dateInput.value);
                dateInput.value = d.getTime();
            }
        }

        // Загрузка страницы
        window.onload = function() {
            // 1. Загружаем каналы
            fetch('/api/event-channels/' + guildId)
                .then(r => r.json())
                .then(data => {
                    const chSelect = document.getElementById('set-channel');
                    const roleSelect = document.getElementById('set-role');
                    
                    chSelect.innerHTML = '<option value="">-- Не выбран --</option>';
                    roleSelect.innerHTML = '<option value="">-- Без тега --</option>';
                    
                    if (data.channels && data.channels.length > 0) {
                        data.channels.forEach(c => {
                            chSelect.innerHTML += `<option value="${c.id}">#${c.name}</option>`;
                        });
                    }
                    if (data.roles && data.roles.length > 0) {
                        data.roles.forEach(r => {
                            roleSelect.innerHTML += `<option value="${r.id}">@${r.name}</option>`;
                        });
                    }

                    // 2. После загрузки каналов подтягиваем сохраненные настройки
                    fetch('/api/guild/' + guildId + '/event-settings')
                        .then(r => r.json())
                        .then(set => {
                            if (set.eventChannelId) chSelect.value = set.eventChannelId;
                            if (set.pingRoleId) roleSelect.value = set.pingRoleId;
                        })
                        .catch(err => console.error("Ошибка настроек:", err));
                })
                .catch(err => {
                    console.error("Ошибка каналов:", err);
                    document.getElementById('set-channel').innerHTML = '<option>Ошибка загрузки</option>';
                });

            // 3. Загружаем список событий
            fetch('/api/events/' + guildId)
                .then(r => r.json())
                .then(events => {
                    const list = document.getElementById('events-list');
                    if (events.length === 0) {
                        list.innerHTML = '<div class="empty-state">Пока нет событий. Создайте первое!</div>';
                        return;
                    }
                    let html = '';
                    events.forEach(ev => {
                        let timeStr = 'Время не указано';
                        let typeIcon = '📌';
                        if (ev.type === 'ГВГ') typeIcon = '⚔️';
                        if (ev.type === 'Вечеринка') typeIcon = '🎉';
                        if (ev.type === 'Арена') typeIcon = '🏟️';
                        if (ev.type === 'Рейд') typeIcon = '🐉';

                        if (ev.isRecurring) {
                            if (ev.recurrenceType === 'daily') timeStr = `Ежедневно в ${ev.timeOfDay || '20:00'}`;
                            else if (ev.recurrenceType === 'weekly') {
                                const daysMap = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
                                const days = (ev.recurrenceDays || []).map(d => daysMap[d]).join(', ');
                                timeStr = `Еженедельно (${days}) в ${ev.timeOfDay || '20:00'}`;
                            }
                        } else if (ev.date) {
                            timeStr = new Date(ev.date).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                        }

                        html += `
                            <div class="event-card">
                                <div class="event-info">
                                    <h3>${ev.title || 'Без названия'}</h3>
                                    <div class="event-meta">
                                        <span>${typeIcon} ${ev.type || 'Другое'}</span>
                                        <span>🕒 ${timeStr}</span>
                                        ${ev.description ? `<span>📝 ${ev.description.substring(0, 30)}...</span>` : ''}
                                    </div>
                                </div>
                                <button class="btn btn-danger btn-small" onclick="deleteEvent('${ev._id}')">🗑 Удалить</button>
                            </div>
                        `;
                    });
                    list.innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('events-list').innerHTML = '<div class="empty-state">Ошибка загрузки: ' + err.message + '</div>';
                });
        };

        // Удаление события
        function deleteEvent(id) {
            if (!confirm('Удалить событие?')) return;
            fetch('/api/events/' + guildId + '/' + id, { method: 'DELETE' })
                .then(() => location.reload());
        }

        // Сохранение настроек
        function saveSettings() {
            const ch = document.getElementById('set-channel').value;
            const role = document.getElementById('set-role').value;
            
            if (!ch) {
                alert('Выберите канал для уведомлений!');
                return;
            }

            fetch('/api/guild/' + guildId + '/event-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventChannelId: ch, pingRoleId: role, timezoneOffset: 3 })
            })
            .then(async r => {
                const data = await r.json();
                if (r.ok) {
                    alert('✅ Настройки сохранены! Бот будет присылать уведомления сюда.');
                } else {
                    alert('❌ Ошибка сервера: ' + (data.error || r.status));
                }
            })
            .catch(err => alert('❌ Ошибка сети: ' + err.message));
        }
    </script>
</body>
</html>
