<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профили гильдии — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/style.css?v=25">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: rgba(212, 175, 55, 0.35);
            --jade: #2ecc71;
            --danger: #e74c3c;
            --border: rgba(212, 175, 55, 0.18);
            --text-main: #e8e3d4;
            --text-muted: #8a8578;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Marcellus', serif;
            color: var(--text-main);
            background: #06080a;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .bg-ink {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 90%, rgba(46, 204, 113, 0.04) 0%, transparent 40%),
                linear-gradient(180deg, #06080a 0%, #0b0e13 100%);
            pointer-events: none;
        }
        .fog {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at 50% 100%, rgba(212,175,55,0.05) 0%, transparent 50%);
        }
        .container {
            position: relative; z-index: 2;
            max-width: 1100px; margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px;
            animation: fadeDown 0.8s ease-out;
        }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .logo {
            font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700;
            letter-spacing: 3px; color: var(--gold);
            text-shadow: 0 0 15px var(--gold-soft);
        }
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 13px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold); }

        .page-title {
            text-align: center; margin-bottom: 40px;
            animation: fadeUp 1s ease-out 0.2s both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .page-title h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(28px, 5vw, 42px);
            background: linear-gradient(135deg, #d4af37, #f4e4a0, #aa8624, #d4af37);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px; margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(212,175,55,0.3));
        }
        .page-title p {
            color: var(--text-muted); letter-spacing: 5px;
            text-transform: uppercase; font-size: 12px;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .profile-card {
            background: linear-gradient(160deg, rgba(18, 22, 28, 0.9), rgba(10, 12, 16, 0.95));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            position: relative;
            overflow: hidden;
            transition: 0.25s;
            animation: fadeUp 0.5s ease-out;
            display: flex;
            flex-direction: column;
        }
        .profile-card:hover {
            border-color: rgba(212,175,55,0.5);
            box-shadow: 0 8px 30px rgba(212,175,55,0.12);
            transform: translateY(-2px);
        }
        .profile-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .profile-header {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 18px;
        }
        .profile-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(212,175,55,0.4);
            overflow: hidden;
            flex-shrink: 0;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-user-info { min-width: 0; flex: 1; }
        .profile-username {
            font-family: 'Cinzel', serif;
            font-size: 16px; color: var(--gold);
            letter-spacing: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .profile-badge {
            display: inline-block;
            font-size: 11px;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(46,204,113,0.15);
            color: var(--jade);
            border: 1px solid rgba(46,204,113,0.4);
        }

        .characters-list {
            display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 16px; flex: 1;
        }
        .character-item {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(212,175,55,0.1);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .char-name {
            font-family: 'Cinzel', serif;
            font-size: 15px; color: var(--gold);
            margin-bottom: 4px;
        }
        .char-detail { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
        .char-detail b { color: #c4bfae; }

        .card-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn-view, .btn-edit, .btn-delete {
            flex: 1; padding: 10px; border-radius: 8px;
            font-family: 'Marcellus', serif; font-size: 13px;
            cursor: pointer; border: 1px solid transparent;
            transition: 0.2s;
        }
        .btn-view {
            background: rgba(212,175,55,0.1); color: var(--gold);
            border-color: rgba(212,175,55,0.4);
        }
        .btn-view:hover { background: rgba(212,175,55,0.25); }
        .btn-edit {
            background: rgba(46,204,113,0.1); color: var(--jade);
            border-color: rgba(46,204,113,0.4);
        }
        .btn-edit:hover { background: rgba(46,204,113,0.25); }
        .btn-delete {
            background: rgba(231,76,60,0.1); color: var(--danger);
            border-color: rgba(231,76,60,0.4); flex: 0 0 auto;
        }
        .btn-delete:hover { background: rgba(231,76,60,0.25); }

        .empty-state {
            text-align: center; padding: 40px 20px;
            color: var(--text-muted); font-style: italic;
            font-size: 14px;
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            .top-nav { margin-bottom: 25px; }
            .logo { font-size: 16px; letter-spacing: 2px; }
            .profiles-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в гильдию</a>
        </nav>

        <div class="page-title">
            <h1>👥 Профили гильдии</h1>
            <p>☯ Странники, идущие этим путём</p>
        </div>

        <div class="profiles-grid" id="profiles-container">
            <div class="empty-state">Загрузка профилей...</div>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const guildId = pathParts[2];
        let canModerate = false;

        document.getElementById('back-link').href = '/guild/' + guildId;

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }
        function hasBuild(c, tab) {
            const b = c.builds && c.builds[tab];
            if (!b) return false;
            return (b.mysticSkills && b.mysticSkills.length > 0) ||
                   (b.innerWays && b.innerWays.length > 0) ||
                   (b.martialArts && b.martialArts.length > 0);
        }

        function renderCard(p) {
            const characters = p.characters || [];
            const characterCards = characters.slice(0, 3).map(c => `
                <div class="character-item">
                    <div class="char-name">${escapeHtml(c.gameNickname || 'Без имени')}</div>
                    <div class="char-detail">
                        🏰 <b>${escapeHtml(c.guildName || '—')}</b><br>
                        🎯 ${hasBuild(c, 'PvE') ? '🌿 PvE ' : ''}${hasBuild(c, 'PvP') ? '⚔️ PvP' : ''}${!hasBuild(c, 'PvE') && !hasBuild(c, 'PvP') ? '—' : ''}
                    </div>
                </div>
            `).join('');

            const editBtns = canModerate ? `
                <button class="btn-edit" onclick="editProfile('${p.userId}')">✏ Ред.</button>
                <button class="btn-delete" onclick="deleteProfile('${p.userId}')" title="Удалить">🗑</button>
            ` : '';

            return `
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar"><img src="${p.avatar}" alt=""></div>
                        <div class="profile-user-info">
                            <div class="profile-username">@${escapeHtml(p.discordName)}</div>
                            <div class="profile-badge">🏰 Участник</div>
                        </div>
                    </div>
                    <div class="characters-list">
                        ${characterCards || '<div class="empty-state" style="padding:14px;font-size:12px;">Нет персонажей</div>'}
                    </div>
                    <div class="card-actions">
                        <button class="btn-view" onclick="viewProfile('${p.userId}')">👁 Открыть</button>
                        ${editBtns}
                    </div>
                </div>
            `;
        }

        async function init() {
            try {
                const res = await fetch('/api/guild/' + guildId, { credentials: 'include' });
                if (res.ok) canModerate = true;
            } catch (e) {}

            try {
                const res = await fetch('/api/guild/' + guildId + '/profiles-public', { credentials: 'include' });
                if (!res.ok) {
                    document.getElementById('profiles-container').innerHTML =
                        '<div class="empty-state">Ошибка загрузки профилей.</div>';
                    return;
                }
                const data = await res.json();
                // data может быть { local, global } — берём только local
                const local = (data && data.local) ? data.local : [];
                const container = document.getElementById('profiles-container');
                container.innerHTML = local.length
                    ? local.map(p => renderCard(p)).join('')
                    : '<div class="empty-state">Пока никто из участников не создал профиль.</div>';
            } catch (e) {
                console.error(e);
                document.getElementById('profiles-container').innerHTML =
                    '<div class="empty-state">Ошибка загрузки профилей.</div>';
            }
        }

        function viewProfile(userId) {
            window.location.href = '/view-profile/' + userId + '?guild=' + guildId;
        }
        function editProfile(userId) {
            window.location.href = '/profile?guild=' + guildId + '&user=' + userId;
        }
        async function deleteProfile(userId) {
            if (!confirm('Удалить профиль этого игрока?')) return;
            try {
                const res = await fetch('/api/guild/' + guildId + '/profiles/' + userId, {
                    method: 'DELETE', credentials: 'include'
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                init();
            } catch (e) {
                alert('Не удалось удалить: ' + e.message);
            }
        }

        init();
    </script>
</body>
</html>
