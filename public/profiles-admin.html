<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гильдия - Профили</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/ui.js"></script>
</head>
<body class="bg-forest">
    <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">☰</button>

    <div class="sidebar">
        <h2 id="server-name">Загрузка...</h2>
        <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;">← К списку серверов</a>
        <hr style="border-color: var(--border-color); margin-bottom: 20px;">
        <a href="#" id="nav-home">🏠 Обзор</a>
        <a href="#" id="nav-roster">🛡️ Состав гильдии</a>
        <a href="#" id="nav-guild" class="active">👥 Гильдия</a>
        <a href="#" id="nav-guides">📖 Гайды</a>
        <a href="#" id="nav-rr">🎭 Роли по кнопкам</a>
        <a href="#" id="nav-rem">⏰ Напоминания</a>
        <a href="#" id="nav-mod">⚙️ Модерация</a>
        <a href="#" id="nav-logs">📜 Логи действий</a>
        <a href="#" id="nav-emb">📨 Эмбеды</a>
    </div>

    <div class="content">
        <div class="header"><h1>👥 Профили гильдии</h1></div>
        
        <div class="grid" id="profiles-grid">
            <p style="color: var(--text-muted);">Загрузка профилей...</p>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guides': '/guides', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-mod': '/moderation', 'nav-logs': '/logs', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;

        fetch(`/api/guild/${guildId}`).then(r=>r.json()).then(d => document.getElementById('server-name').innerText = d.name);

        function loadProfiles() {
            fetch(`/api/guild/${guildId}/profiles`).then(res => res.json()).then(data => {
                const grid = document.getElementById('profiles-grid');
                if (data.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-muted);">Пока никто не заполнил свой профиль.</p>';
                    return;
                }
                grid.innerHTML = '';
                data.forEach(p => {
                    let charactersHtml = '';
                    if (p.characters && p.characters.length > 0) {
                        charactersHtml = p.characters.map(char => `
                            <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 2px solid var(--accent);">
                                <h4 style="color: var(--text-main); margin-bottom: 5px;">${char.gameNickname || 'Без ника'}</h4>
                                <p style="font-size: 13px; margin: 0;"><b>Класс:</b> ${char.classRole || 'Не указан'} | <b>Оружие:</b> ${char.weapon || 'Не указано'}</p>
                                <p style="font-size: 13px; margin: 0;"><b>Гильдия:</b> ${char.guildName || 'Не указана'}</p>
                                ${char.bio ? `<p style="font-size: 12px; font-style: italic; color: var(--text-muted); margin-top: 5px;">"${char.bio}"</p>` : ''}
                            </div>
                        `).join('');
                    } else {
                        charactersHtml = '<p style="color: var(--text-muted);">Персонажи не заполнены.</p>';
                    }

                    grid.innerHTML += `
                        <div class="card profile-card" style="display: block;">
                            <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                                <img src="${p.avatar}" class="profile-avatar" style="width: 60px; height: 60px;">
                                <div>
                                    <h3 style="margin: 0; color: var(--accent); font-family: 'Cinzel', serif;">@${p.discordName}</h3>
                                    ${p.isGlobal ? '<span style="font-size: 12px; color: #2ECC71;">🌐 Глобальный</span>' : ''}
                                </div>
                            </div>
                            <div>${charactersHtml}</div>
                            <!-- КНОПКИ УПРАВЛЕНИЯ -->
                            <div style="display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                                <a href="/profile?guild=${guildId}&user=${p.userId}" class="btn btn-small" style="flex: 1; background: var(--accent); color: black;">✏️ Ред.</a>
                                <button class="btn btn-danger btn-small" style="flex: 1;" onclick="deleteProfile('${p.userId}', '${p.discordName}')">🗑️ Удалить</button>
                            </div>
                        </div>
                    `;
                });
            });
        }
        loadProfiles();

        function deleteProfile(userId, username) {
            showConfirm('Удаление профиля', `Вы уверены, что хотите удалить профиль игрока @${username}?`, () => {
                fetch(`/api/guild/${guildId}/profiles/${userId}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            showToast('Профиль удален!', 'success');
                            loadProfiles();
                        } else showToast('Ошибка: ' + data.error, 'error');
                    });
            });
        }
    </script>
</body>
</html>
