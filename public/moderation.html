<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модерация — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>
    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в управление</a>
        </nav>
        <div class="page-title">
            <h1>⚙️ Права модераторов</h1>
            <p>☯ Кто может управлять порядком</p>
        </div>
        <div class="panel" id="error-panel" style="display:none;">
            <div class="empty-state" id="error-msg"></div>
        </div>
        <div class="panel">
    <div class="panel-title">
        <span>Роли и канал</span>
        <button class="btn btn-primary btn-small" onclick="saveModeration()" id="save-btn" disabled>💾 Сохранить</button>
    </div>
    <div class="panel-desc">Выберите роли модераторов и канал, куда будут приходить вызовы на дуэли.</div>
    
    <div class="form-group" style="margin-bottom: 20px;">
        <label>Канал для вызовов</label>
        <select id="challenge-channel" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px;">
            <option value="">— Выберите канал —</option>
        </select>
    </div>

    <label style="font-size: 14px; color: var(--text-muted); display: block; margin-bottom: 10px;">Роли модераторов</label>
    <div id="roles-list" style="max-height: 400px; overflow-y: auto;"></div>
    <div class="status-msg" id="status"></div>
        </div>
    </div>
    <style>
        .role-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .role-item:hover { border-color: rgba(212,175,55,0.4); }
        .role-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--jade); cursor: pointer; }
        .role-item span { font-size: 14px; color: var(--text-main); }
    </style>
    <script>
        const guildId = window.location.pathname.split('/')[2];
const backLink = document.getElementById('back-link');
if (backLink) backLink.href = '/manage/' + guildId;

let serverRoles = [];
let selectedRoles = new Set();
let challengeChannelId = '';

async function loadData() {
    try {
        const res = await fetch('/api/guild/' + guildId + '/moderation', { credentials: 'include' });
        if (res.status === 403) return alert('Нет прав');
        const data = await res.json();
        serverRoles = data.modRoles ? data.modRoles.map(id => ({ id, name: id })) : []; // Заглушка, лучше брать из /api/guild/:id
        // На самом деле роли мы тянем из /api/guild/:id, но для простоты сделаем так:
        const gRes = await fetch('/api/guild/' + guildId, { credentials: 'include' });
        const gData = await gRes.json();
        serverRoles = gData.roles || [];
        
        const channelSelect = document.getElementById('challenge-channel');
        (data.channels || []).forEach(ch => {
            const opt = document.createElement('option');
            opt.value = ch.id;
            opt.textContent = '#' + ch.name;
            if (ch.id === data.challengeChannelId) opt.selected = true;
            channelSelect.appendChild(opt);
        });
        challengeChannelId = data.challengeChannelId || '';
        
        selectedRoles = new Set(data.modRoles || []);
        renderRoles();
        document.getElementById('save-btn').disabled = false;
    } catch (e) { console.error(e); }
}

function renderRoles() {
    const list = document.getElementById('roles-list');
    list.innerHTML = serverRoles.map(r => `
        <label class="role-item">
            <input type="checkbox" value="${r.id}" ${selectedRoles.has(r.id) ? 'checked' : ''} onchange="toggleRole('${r.id}', this.checked)">
            <span>${r.name}</span>
        </label>
    `).join('');
}

function toggleRole(id, checked) {
    if (checked) selectedRoles.add(id); else selectedRoles.delete(id);
}

function saveModeration() {
    const chId = document.getElementById('challenge-channel').value;
    fetch('/api/guild/' + guildId + '/moderation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ modRoles: Array.from(selectedRoles), challengeChannelId: chId })
    }).then(res => {
        if (res.ok) alert('✅ Сохранено!');
    });
}
loadData();
    </script>
</body>
</html>
