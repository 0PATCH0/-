<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модерация</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"><h1>Главная</h1></a>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;"><div class="icon icon-arrow-left"></div> К списку серверов</a>
            <hr style="border-color: var(--border-color); margin-bottom: 20px;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" id="nav-guides"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" id="nav-rr"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" id="nav-rem"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" class="active"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" id="nav-logs"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" id="nav-emb"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-gear"></div> Права модераторов</h1></div>
            <div class="form-card">
                <p style="color: var(--text-muted); margin-bottom: 20px;">Выберите роли, которым разрешено использовать команды (/мут, /очистить, /сказать).</p>
                <div id="roles-list" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px; padding-right: 10px;"></div>
                <button class="btn" onclick="saveModeration()"><div class="icon icon-floppy-disk"></div> Сохранить права</button>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-guides': '/guides', 'nav-rr': '/reactionroles', 'nav-rem': '/reminders', 'nav-logs': '/logs', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;

        Promise.all([
            fetch(`/api/guild/${guildId}`).then(res => res.json()),
            fetch(`/api/guild/${guildId}/moderation`).then(res => res.json())
        ]).then(([guildData, modData]) => {
            document.getElementById('server-name').innerText = guildData.name;
            const list = document.getElementById('roles-list');
            
            guildData.roles.forEach(role => {
                const isChecked = modData.modRoles.includes(role.id) ? 'checked' : '';
                list.innerHTML += `
                    <label style="display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;" onmouseover="this.style.borderColor='var(--accent-jade)'" onmouseout="this.style.borderColor='transparent'">
                        <input type="checkbox" value="${role.id}" ${isChecked} style="width: 20px; height: 20px; accent-color: var(--accent-jade); cursor: pointer;">
                        <span style="font-weight: bold; color: var(--text-main);">${role.name}</span>
                    </label>
                `;
            });
        });

        function saveModeration() {
            const checked = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            fetch(`/api/guild/${guildId}/moderation`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ modRoles: checked })
            }).then(() => alert('✅ Настройки модерации сохранены!'));
        }
    </script>
</body>
</html>
