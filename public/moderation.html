<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модерация — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>

    <div class="container" style="margin-top: 40px;">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в управление</a>
        </nav>

        <div class="page-title">
            <h1>⚙️ Права модераторов</h1>
            <p>☯ Кто может управлять порядком</p>
        </div>

        <div class="panel" id="error-panel" style="display:none;">
            <div class="empty-state" id="error-msg"></div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span>Роли модераторов</span>
                <button class="btn btn-primary btn-small" onclick="saveModeration()" id="save-btn" disabled>💾 Сохранить</button>
            </div>
            <div class="panel-desc">
                Выберите роли Discord, которым разрешено использовать команды модерации
                (/мут, /очистить, /сказать, /настройки и т.д.).
            </div>
            <div id="roles-list">
                <div class="empty-state">Загрузка...</div>
            </div>
            <div class="status-msg" id="status"></div>
        </div>
    </div>

    <style>
        .role-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .role-item:hover { border-color: rgba(212,175,55,0.4); }
        .role-item input[type="checkbox"] {
            width: 20px; height: 20px;
            accent-color: var(--jade);
            cursor: pointer;
        }
        .role-item span { font-size: 14px; color: var(--text-main); }
    </style>

    <script>
        const guildId = window.location.pathname.split('/')[2];

        const backLink = document.getElementById('back-link');
        if (backLink) backLink.href = '/manage/' + guildId;

        let serverRoles = [];
        let selectedRoles = new Set();

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function showError(msg) {
            document.getElementById('error-panel').style.display = 'block';
            document.getElementById('error-msg').textContent = msg;
            document.getElementById('roles-list').innerHTML = '';
        }

        async function loadData() {
            try {
                const guildRes = await fetch('/api/guild/' + guildId, { credentials: 'include' });
                if (guildRes.status === 403) {
                    return showError('❌ У вас нет прав модератора на этом сервере.');
                }
                if (!guildRes.ok) {
                    return showError('❌ Ошибка загрузки гильдии: HTTP ' + guildRes.status);
                }
                const guildData = await guildRes.json();
                serverRoles = guildData.roles || [];
                const modRes = await fetch('/api/guild/' + guildId + '/moderation', { credentials: 'include' });

                if (modRes.status === 403) {
                    return showError('❌ У вас нет прав модератора на этом сервере.');
                }
                if (!modRes.ok) {
                    return showError('❌ Ошибка загрузки прав модерации: HTTP ' + modRes.status);
                }
                const modData = await modRes.json();
                selectedRoles = new Set(modData.modRoles || []);
                log('  выбрано: ' + selectedRoles.size);

                renderRoles();
                document.getElementById('save-btn').disabled = false;
                log('loadData: ГОТОВО');
            } catch (e) {
                showError('❌ Ошибка: ' + e.message);
            }
        }

        function renderRoles() {
            const list = document.getElementById('roles-list');
            if (serverRoles.length === 0) {
                list.innerHTML = '<div class="empty-state">Роли не найдены.</div>';
                return;
            }
            list.innerHTML = serverRoles.map(r => `
                <label class="role-item">
                    <input type="checkbox" value="${r.id}" ${selectedRoles.has(r.id) ? 'checked' : ''} onchange="toggleRole('${r.id}', this.checked)">
                    <span>${escapeHtml(r.name)}</span>
                </label>
            `).join('');
            log('renderRoles: отрисовано ' + serverRoles.length);
        }

        function toggleRole(id, checked) {
            if (checked) selectedRoles.add(id);
            else selectedRoles.delete(id);
        }

        function setStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status-msg ' + (type || '');
            if (type === 'ok') setTimeout(() => { el.textContent = ''; el.className = 'status-msg'; }, 3000);
        }

        function saveModeration() {
            log('saveModeration: POST');
            fetch('/api/guild/' + guildId + '/moderation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ modRoles: Array.from(selectedRoles) })
            }).then(res => {
                log('  status: ' + res.status);
                if (res.ok) setStatus('✅ Настройки модерации сохранены', 'ok');
                else setStatus('❌ Ошибка сохранения', 'err');
            }).catch(() => setStatus('❌ Ошибка сети', 'err'));
        }

        loadData();
    </script>
</body>
</html>
