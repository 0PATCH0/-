<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Напоминания</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <a href="#" id="top-banner-link" class="top-banner"><h1>Главная</h1></a>

    <div class="main-container">
        <div class="sidebar">
            <h2 id="server-name">Загрузка...</h2>
            <a href="/dashboard" style="color: var(--text-muted); margin-bottom: 20px;"><div class="icon icon-arrow-left"></div> К списку серверов</a>
            <hr style="border-color: var(--border-color); margin-bottom: 20px;">
            <a href="#" id="nav-home"><div class="icon icon-home"></div> Обзор</a>
            <a href="#" id="nav-roster"><div class="icon icon-shield"></div> Состав гильдии</a>
            <a href="#" id="nav-guild"><div class="icon icon-users"></div> Гильдия</a>
            <a href="#" id="nav-guides"><div class="icon icon-book"></div> Гайды</a>
            <a href="#" id="nav-rr"><div class="icon icon-masks"></div> Роли по кнопкам</a>
            <a href="#" class="active"><div class="icon icon-alarm"></div> Напоминания</a>
            <a href="#" id="nav-mod"><div class="icon icon-gear"></div> Модерация</a>
            <a href="#" id="nav-logs"><div class="icon icon-scroll"></div> Логи действий</a>
            <a href="#" id="nav-emb"><div class="icon icon-envelope"></div> Эмбеды</a>
        </div>

        <div class="content">
            <div class="header"><h1><div class="icon icon-alarm"></div> Управление напоминаниями</h1></div>
            <div class="grid" id="reminders-grid">
                <p style="color: var(--text-muted);">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        const guildId = window.location.pathname.split('/')[2];
        const banner = document.getElementById('top-banner-link');
        if (banner) banner.href = `/manage/${guildId}`;

        const navs = {'nav-home': '', 'nav-roster': '/roster', 'nav-guild': '/profiles', 'nav-guides': '/guides', 'nav-rr': '/reactionroles', 'nav-mod': '/moderation', 'nav-logs': '/logs', 'nav-emb': '/custom'};
        for (const [id, path] of Object.entries(navs)) document.getElementById(id).href = `/manage/${guildId}${path}`;

        fetch(`/api/guild/${guildId}`).then(res => res.json()).then(data => document.getElementById('server-name').innerText = data.name);

        fetch(`/api/guild/${guildId}/reminders`).then(res => res.json()).then(data => {
            const grid = document.getElementById('reminders-grid');
            if (data.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">Активных напоминаний нет.</p>';
                return;
            }
            grid.innerHTML = '';
            data.forEach(r => {
                const time = new Date(r.nextTime).toLocaleString('ru-RU');
                grid.innerHTML += `
                    <div class="card" style="border-left: 3px solid var(--accent-gold);">
                        <h3><div class="icon icon-alarm"></div> ${r.text}</h3>
                        <p style="margin-top: 10px; color: var(--text-main);">Сработает: <b>${time}</b></p>
                        <p style="color: var(--text-muted);">Повтор: ${r.repeat}</p>
                        <button class="btn btn-danger btn-small" style="margin-top: 15px;" onclick="deleteReminder('${r.id}')"><div class="icon icon-trash"></div> Удалить</button>
                    </div>
                `;
            });
        });

        function deleteReminder(id) {
            if (!confirm('Удалить напоминание?')) return;
            fetch(`/api/reminders/${id}`, { method: 'DELETE' }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
