<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Напоминания — Where Winds Meet</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <div class="bg-ink"></div>
    <div class="fog"></div>
    <div class="container">
        <nav class="top-nav">
            <div class="logo">WHERE WINDS MEET</div>
            <a href="#" class="back-link" id="back-link">← Назад в управление</a>
        </nav>
        <div class="page-title">
            <h1>⏰ Напоминания</h1>
            <p>☯ Автоматические пинги и события</p>
        </div>
        <div id="reminders-grid" class="tiles">
            <div class="empty-state">Загрузка...</div>
        </div>
    </div>
    <script>
        const guildId = window.location.pathname.split('/')[2];
        const backLink = document.getElementById('back-link');
        if (backLink) backLink.href = '/manage/' + guildId;

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        fetch('/api/guild/' + guildId + '/reminders', { credentials: 'include' })
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(data => {
                const grid = document.getElementById('reminders-grid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="empty-state">Активных напоминаний нет.</div>';
                    return;
                }
                grid.innerHTML = '';
                data.forEach(r => {
                    const time = new Date(r.nextTime).toLocaleString('ru-RU');
                    const card = document.createElement('div');
                    card.className = 'tile';
                    card.style.cursor = 'default';
                    card.innerHTML = `
                        <span class="tile-icon">⏰</span>
                        <span class="tile-title">${escapeHtml(r.text || 'Напоминание')}</span>
                        <span class="tile-desc">Сработает: <b>${time}</b><br>Повтор: ${escapeHtml(r.repeat || '—')}</span>
                        <button class="btn btn-danger btn-small" style="margin-top: 10px;">🗑 Удалить</button>
                    `;
                    card.querySelector('.btn-danger').onclick = () => deleteReminder(r.id);
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('reminders-grid').innerHTML =
                    '<div class="empty-state">Ошибка загрузки: ' + escapeHtml(err.message) + '</div>';
            });

        function deleteReminder(id) {
            if (!confirm('Удалить напоминание?')) return;
            fetch('/api/reminders/' + id, { method: 'DELETE', credentials: 'include' })
                .then(() => window.location.reload());
        }
    </script>
</body>
</html>
